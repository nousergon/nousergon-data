AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Nous Ergon data collection (component 1 of 4, alpha-engine-config
  architecture.d/146; alpha-engine-config-I10739). Owns the schedules and
  state machines that run market-data collection independently of every
  Crucible v1 pipeline, so Crucible v2 phase 4 can disable
  ne-postclose-trading-pipeline, ne-preopen-trading-pipeline and
  ne-weekly-freshness-pipeline without freezing s3://alpha-engine-research/market_data/*.
  Deployed on merge by .github/workflows/deploy-data-collection-stack.yml.

# ─────────────────────────────────────────────────────────────────────────────
# DECLARATION (sf-pipeline-policy §2.6): this file is the one place that says
# when collection runs and whether it runs at all.
#
#   * CollectionState   — the eod, morning and weekly schedules. Ships DISABLED:
#                         until phase 4's maintenance window the v1 SFs still
#                         run the same workloads, and both enabled would
#                         double-write the same keys.
#   * DailyHealState    — the daily-heal schedule, separately, because its v1
#                         rule `alpha-engine-daily-heal` is paused by Brian's
#                         2026-08-07 ruling (infrastructure/automation_pause.json).
#                         Cutover does not un-pause it; that is its own ruling.
#
# ENABLE = a PR that changes a Default below from DISABLED to ENABLED and, in
# the SAME PR, moves the schedule's name in automation_pause.json from
# `pending` to `not_paused`. Merging it is the apply. Nothing else flips state:
# deploy-data-collection-stack.sh passes these Defaults explicitly on every
# deploy, so a console edit is reverted by the next merge and reported by the
# weekly check-live run in between.
#
# NO IAM IN THIS TEMPLATE. This repo is public and IAM documents are
# hard-private (repository-tiering-policy; infrastructure-ownership-policy §4).
# The two roles named below are codified in nous-ergon-ops
# infrastructure/iam/, and no account literal appears here (AWS::AccountId).
# ─────────────────────────────────────────────────────────────────────────────

Parameters:
  CollectionState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
    Description: State of the eod, morning and weekly schedules. See the declaration block.
  DailyHealState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
    Description: State of the daily-heal schedule (paused by ruling 2026-08-07).
  ShadowSamedayState:
    Type: String
    Default: ENABLED
    AllowedValues: [DISABLED, ENABLED]
    Description: >-
      State of the shadow-sameday schedule. Born ENABLED, unlike
      CollectionState/DailyHealState above: the workload writes only under
      staging/shadow/, never market_data/*, so it carries none of the
      double-write risk the other schedules' DISABLED default guards against
      (alpha-engine-config-I11233).
  DefinitionS3Bucket:
    Type: String
    Default: alpha-engine-research
    Description: Bucket the deploy script stages the ASL definition into.
  DefinitionS3Key:
    Type: String
    Description: >-
      Content-addressed key of the staged ASL definition
      (infrastructure/nousergon-data-collection/data-collection-<sha256>.asl.json).
      A changed definition is a changed key, so CloudFormation updates every
      state machine; an unchanged one is a true no-op.
  DispatcherFunctionName:
    Type: String
    Default: alpha-engine-data-spot-dispatcher
    Description: >-
      The existing data-spot dispatcher. It stays deploy.sh-managed
      (deploy-data-spot-dispatcher.yml); only its schedules move here.
  AlertsTopicName:
    Type: String
    Default: alpha-engine-alerts
  StateMachineRoleName:
    Type: String
    Default: nousergon-data-collection-sfn-role
  SchedulerRoleName:
    Type: String
    Default: alpha-engine-eventbridge-sfn-role

Resources:
  CollectionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/ne-data-collection
      RetentionInDays: 90

  EodStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-data-collection-eod
      StateMachineType: STANDARD
      RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${StateMachineRoleName}
      DefinitionS3Location:
        Bucket: !Ref DefinitionS3Bucket
        Key: !Ref DefinitionS3Key
      DefinitionSubstitutions:
        DispatcherFunctionArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DispatcherFunctionName}
        AlertsTopicArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopicName}
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CollectionLogGroup.Arn
      Tags:
        - Key: component
          Value: nousergon-data-collection

  MorningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-data-collection-morning
      StateMachineType: STANDARD
      RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${StateMachineRoleName}
      DefinitionS3Location:
        Bucket: !Ref DefinitionS3Bucket
        Key: !Ref DefinitionS3Key
      DefinitionSubstitutions:
        DispatcherFunctionArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DispatcherFunctionName}
        AlertsTopicArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopicName}
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CollectionLogGroup.Arn
      Tags:
        - Key: component
          Value: nousergon-data-collection

  WeeklyStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-data-collection-weekly
      StateMachineType: STANDARD
      RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${StateMachineRoleName}
      DefinitionS3Location:
        Bucket: !Ref DefinitionS3Bucket
        Key: !Ref DefinitionS3Key
      DefinitionSubstitutions:
        DispatcherFunctionArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DispatcherFunctionName}
        AlertsTopicArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopicName}
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CollectionLogGroup.Arn
      Tags:
        - Key: component
          Value: nousergon-data-collection

  DailyHealStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-data-collection-daily-heal
      StateMachineType: STANDARD
      RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${StateMachineRoleName}
      DefinitionS3Location:
        Bucket: !Ref DefinitionS3Bucket
        Key: !Ref DefinitionS3Key
      DefinitionSubstitutions:
        DispatcherFunctionArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DispatcherFunctionName}
        AlertsTopicArn: !Sub arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${AlertsTopicName}
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt CollectionLogGroup.Arn
      Tags:
        - Key: component
          Value: nousergon-data-collection

  CollectionScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: nousergon-data-collection

  # Weekday end-of-day collection. Replaces ne-postclose-trading-pipeline's
  # LaunchPostMarketDataSpot + LaunchPostMarketArcticAppendSpot. 16:45 ET: after
  # the 16:00 close and outside the v1 postclose window, so the cutover day has
  # no overlap. `verify_units` is every manifest-emitting unit its two collector
  # workloads run (run_units.PHASE_UNITS ("daily", *) minus the arctic append the
  # --skip-arctic-append flag defers, plus MODE_UNITS["daily_arctic_append"]): the
  # completion claim covers every key each of them publishes, not the two Metron
  # reads most (alpha-engine-config-I10787). `arctic-probe` is absent because it
  # writes no run manifest — a gap named in the P-20 report, not a silent skip.
  EodSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      # Globally unique on purpose: CloudFormation's early existence check
      # compares a schedule's Name WITHOUT its group, so `weekly` collided with
      # crucible-v2's `crucible-v2/weekly` and rolled the first create back
      # (2026-09-14). Every name carries the `data-collection-` prefix.
      Name: data-collection-eod
      GroupName: !Ref CollectionScheduleGroup
      State: !Ref CollectionState
      ScheduleExpression: 'cron(45 16 ? * MON-FRI *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref EodStateMachine
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${SchedulerRoleName}
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        Input: '{"collection": "eod", "workloads": ["post-market-data", "post-market-arctic-append", "arctic-probe"], "require_trading_day": true, "verify_units": ["D03", "D19", "D20", "D21", "D22", "D23", "D24", "D25", "D26", "D27", "D28", "D29", "D30", "D31", "D32"]}'

  # Weekday pre-open ArcticDB enrich + append. Replaces ne-preopen-trading-
  # pipeline's LaunchMorningEnrichSpot + LaunchMorningArcticAppendSpot. 07:30 ET
  # leaves the observed ~50 + ~38 min tail finished before the 09:30 open.
  # Its former "no key verification" posture was never justified — the pre-open
  # enrich is what the predictor reads next, and an SSM exit code alone was the
  # whole completion claim. It now verifies D17/D18's run manifests.
  MorningSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-collection-morning
      GroupName: !Ref CollectionScheduleGroup
      State: !Ref CollectionState
      ScheduleExpression: 'cron(30 7 ? * MON-FRI *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref MorningStateMachine
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${SchedulerRoleName}
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        Input: '{"collection": "morning", "workloads": ["morning-enrich", "morning-arctic-append", "arctic-probe"], "require_trading_day": true, "verify_units": ["D17", "D18"]}'

  # Saturday weekly collection. Replaces ne-weekly-freshness-pipeline's
  # MorningEnrich -> DataPhase1 -> DataPhase2 -> RAGIngestion chain (v1 data
  # order; alpha-engine-config-I10753 adds the last two). 05:00 ET = the v1
  # SF's 09:00 UTC start under EDT.
  #
  # alternative-phase-two (D15) measured ~35 min and rag-weekly-ingestion
  # (D16/D46) measured ~20-23 min across two full v1 executions
  # (2026-08-04, 2026-08-07 ne-weekly-freshness-pipeline history) — both
  # comfortably inside the dispatcher's per-workload 7200s ceiling
  # (DATA_SPOT_MAX_RUNTIME_SECONDS) and, combined with weekly-phase-one's
  # ~88 min, well inside this state machine's own 28800s TimeoutSeconds.
  # No split needed (I10753 deliverable 3).
  #
  # Phase 1 auto-skips phases whose cycle output is already on S3, so an
  # unchanged LastModified was never a usable claim — which is why this used
  # to run unverified (verify_keys: []). The manifest check handles it
  # precisely instead: an auto-skipped unit DECLARES itself by writing an
  # `empty_fresh` guard with verdict `not_applicable`, which exempts its key
  # coverage and nothing else — its manifest must still exist for this run
  # and still report status ok. verify_units now covers every phase-1 unit
  # plus D15 (alternative-phase-two), D16 (rag-weekly-ingestion) and D46
  # (insider_transactions — no dispatcher key of its own, graded against the
  # SAME manifest D16 writes; its descriptor's run_manifest_prefix points at
  # D16's prefix, alpha-engine-config-I10753).
  #
  # D14 (prune_delisted_tickers) joins them (alpha-engine-config-I11001). The
  # `weekly-phase-one` workload has always RUN it — it is the second half of
  # that workload's subshell — but `builders/prune_delisted_tickers.py` wrote
  # no run manifest, so naming it here would have failed every execution on a
  # manifest that never existed. Its `--apply` entrypoint now goes through
  # `run_units.recorded_entry("D14", ...)` (the D16 wrapper shape), resolving
  # the trading day ONCE and passing it to both the prune and the manifest so
  # the audit key `builders/prune_audit/{trading_day}-*.json` and the manifest
  # the completion check renders it against cannot disagree about the date.
  #
  # D09 (signal_returns) is NOT listed, and that absence is the recorded
  # decision rather than an omission: its descriptor carries a `retirement:`
  # block (Brian 2026-09-14 R7, alpha-engine-config-I10748 plan §7 (b)) with
  # `no_successor_workload: true`, exactly like D40/D41. It was listed here
  # because PR1701 wrote this input BEFORE that ruling landed, so the stack
  # was asserting a completeness claim for a unit declared retired — green
  # today only because `weekly_collector.py --phase 1` still happens to run
  # the phase, and a guaranteed FALSE RED the day it stops.
  # `tests/test_data_collection_stack.py::
  # test_every_standalone_successor_unit_is_covered_or_retired` now pins both
  # directions, so a retired unit cannot reappear here and a live one cannot
  # quietly drop out (alpha-engine-config-I10753).
  #
  # D34 (chronic-gap-heal) joins them (alpha-engine-config-I11002). It had NO
  # successor at all until this change: `morning-enrich` above passes
  # `--skip-chronic-heal` on this schedule, and `daily-heal` (a different
  # schedule, weekday cadence) maps to D33, a different unit. The new
  # `chronic-gap-heal` workload runs it here rather than on `daily-heal`'s
  # weekday cadence, matching both D34's descriptor `trigger.schedule` (Sat
  # 05:00 America/New_York) and its v1 successor name
  # (`ne-data-collection-weekly`) — chronic-gap-heal was never a daily
  # operation, unlike D33's own heal.
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-collection-weekly
      GroupName: !Ref CollectionScheduleGroup
      State: !Ref CollectionState
      ScheduleExpression: 'cron(0 5 ? * SAT *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref WeeklyStateMachine
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${SchedulerRoleName}
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        Input: '{"collection": "weekly", "workloads": ["morning-enrich", "weekly-phase-one", "alternative-phase-two", "rag-weekly-ingestion", "chronic-gap-heal"], "require_trading_day": false, "verify_units": ["D01", "D02", "D03", "D04", "D05", "D06", "D07", "D08", "D10", "D11", "D12", "D13", "D14", "D15", "D16", "D17", "D34", "D46"]}'

  # Daily universe-gap heal. Replaces the orchestration stack's
  # alpha-engine-daily-heal rule (09:00 UTC = 05:00 EDT), now through a state
  # machine so the run's outcome is recorded rather than fired and forgotten.
  DailyHealSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-collection-daily-heal
      GroupName: !Ref CollectionScheduleGroup
      State: !Ref DailyHealState
      ScheduleExpression: 'cron(0 5 ? * MON-FRI *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Ref DailyHealStateMachine
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${SchedulerRoleName}
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        Input: '{"collection": "daily-heal", "workloads": ["daily-heal"], "require_trading_day": false, "verify_units": ["D33"]}'

  # Weekday shadow-sameday parity run (alpha-engine-config-I11233). Targets
  # the dispatcher LAMBDA DIRECTLY, not a state machine — the only schedule in
  # this stack that does, because the workload's own guard already resolves
  # the trading day and exits 0 on a non-trading day, so no SF wrapper adds
  # anything. `alpha-engine-eventbridge-sfn-role` (nous-ergon-ops
  # infrastructure/iam/alpha-engine-eventbridge-sfn-role/) carries a
  # lambda:InvokeFunction grant scoped to this one function; that grant lands
  # (and auto-applies on merge) before this schedule's PR merges, so the
  # first fire is never the first test of the permission.
  #
  # 18:30 ET: after this stack's own 16:45 ET EodSchedule and after v1's
  # postclose writes (measured starting 16:00 ET), leaving a wide margin
  # before either could still be writing. The workload's own 18000s (5h) cap
  # means a worst-case finish ~23:30 ET, comfortably inside the weekday
  # window and with no other schedule in this stack running after it.
  #
  # Born ENABLED (ShadowSamedayState, default ENABLED) rather than sharing
  # CollectionState: it writes only to staging/shadow/ (7-day lifecycle
  # expiry, no new retention rule needed) and never to market_data/*, so it
  # carries none of the double-write risk CollectionState's DISABLED default
  # exists to prevent — Brian ruling 2026-09-21 (alpha-engine-config-I11203)
  # chose a same-day run over a replay to close I11203's parity clause, and
  # this is that run's trigger.
  #
  # No require_trading_day, no verify_units: this schedule's Input is the
  # dispatcher's own direct-invoke contract (`{"workload": ...}`), not the
  # collection/workloads/verify_units shape the state-machine-targeting
  # schedules above use — there is no state machine here to pass
  # require_trading_day/verify_units to, and the workload's own guard already
  # covers the trading-day check. The completion claim is graded downstream,
  # by data.cutover_ready.parity reading data_collection/parity/{trading
  # day}.json, not by this stack's own verify_units machinery
  # (alpha-engine-config-I11233 closes-when).
  ShadowSamedaySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: data-collection-shadow-sameday
      GroupName: !Ref CollectionScheduleGroup
      State: !Ref ShadowSamedayState
      ScheduleExpression: 'cron(30 18 ? * MON-FRI *)'
      ScheduleExpressionTimezone: America/New_York
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${DispatcherFunctionName}
        RoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${SchedulerRoleName}
        RetryPolicy:
          MaximumRetryAttempts: 3
          MaximumEventAgeInSeconds: 3600
        Input: '{"workload": "shadow-sameday"}'

  # Failure alarms are NOT declared here. The fleet's alarms come from files
  # (nous-ergon-ops infrastructure/cloudwatch/alarms/ne-data-collection-*-failed.json,
  # applied on merge there), and that repo's daily drift check reports an
  # alarm owned by a sibling repo's template as `ERROR uncodified`. Their
  # dimension is the state machine ARN, which is fixed by StateMachineName
  # above, so the alarm files need nothing from this stack.

Outputs:
  EodStateMachineArn:
    Value: !Ref EodStateMachine
  MorningStateMachineArn:
    Value: !Ref MorningStateMachine
  WeeklyStateMachineArn:
    Value: !Ref WeeklyStateMachine
  DailyHealStateMachineArn:
    Value: !Ref DailyHealStateMachine
