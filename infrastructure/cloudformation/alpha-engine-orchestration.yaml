AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Alpha Engine orchestration infrastructure — Step Functions, EventBridge rules,
  SNS topics, and log metric filters. Does NOT manage Lambda functions, EC2
  instances, IAM roles or CloudWatch alarms (those are managed separately via deploy scripts
  and console). This template captures the "glue" that connects modules.

# ============================================================================
# Parameters
# ============================================================================
Parameters:
  MicroInstanceId:
    Type: String
    Default: i-09b539c844515d549
    Description: Always-on EC2 micro instance ID (runs data collection, dashboard)

  TradingInstanceId:
    Type: String
    Default: i-018eb3307a21329bf
    Description: Trading EC2 instance ID (runs executor, started/stopped daily)

  ResearchLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-research-runner:live

  DataCollectorLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-data-collector:live

  PredictorLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-predictor-inference:live

  AlertsLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-research-alerts

  # alpha-engine-config-I2717/I2722 (2026-07-16): the data-spot-dispatcher and
  # predictor-health-check Lambdas are managed OUTSIDE this stack (operator-
  # deployed, no --bootstrap IAM here) — same pattern as the other Lambda ARN
  # Parameters above, this stack only wires EventBridge glue to them by ARN.
  DataSpotDispatcherLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-data-spot-dispatcher

  PredictorHealthCheckLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-predictor-health-check:live

  # config-I7249: operator-deployed like every Lambda ARN Parameter above.
  PreflightSweepDispatcherLambdaArn:
    Type: String
    Default: arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-preflight-sweep-dispatcher

  StepFunctionsRoleArn:
    Type: String
    Default: arn:aws:iam::711398986525:role/alpha-engine-step-functions-role

  EventBridgeSfnRoleArn:
    Type: String
    Default: arn:aws:iam::711398986525:role/alpha-engine-eventbridge-sfn-role

  EventBridgeEc2RoleArn:
    Type: String
    Default: arn:aws:iam::711398986525:role/alpha-engine-eventbridge-role

  # alpha-engine-config-I12323 (C41): the Firehose delivery role for the alert
  # log below. Codified and bootstrapped in nous-ergon-ops
  # (infrastructure/iam/nousergon-alert-log-firehose-role/), not here. This
  # repo is public and this stack holds no IAM, the same as every role
  # parameter above.
  AlertLogFirehoseRoleArn:
    Type: String
    Default: arn:aws:iam::711398986525:role/nousergon-alert-log-firehose-role

  AlertEmail:
    Type: String
    Default: cipher813@gmail.com
    Description: Email for SNS alert notifications

# ============================================================================
# Resources
# ============================================================================
Resources:

  # --------------------------------------------------------------------------
  # SNS Topics
  # --------------------------------------------------------------------------
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: alpha-engine-alerts
      DisplayName: Alpha Engine Alerts

  AlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # alpha-engine-config-I9756 (crucible v2 phase 0, Brian ruling I9751 item
  # 3a: old weekly runs 1x/week, no reruns, results IGNORED during the v2
  # build). The parent session created this topic live 2026-09-01
  # (`aws sns create-topic --name alpha-engine-alerts-muted`, verified no
  # subscribers) and left it un-codified, with the SaturdayTrigger Input
  # switch recorded as a BLOCKED operator command (2 `aws events put-targets`
  # args) because the session's permission classifier would not let it run
  # `put-targets` directly. That command only rewrites this rule's Input,
  # which is fully expressible here — sns:CreateTopic is idempotent by name
  # (returns the existing ARN rather than erroring), so declaring this
  # resource ADOPTS the live topic into the stack rather than conflicting
  # with it, and CFN then owns pointing SaturdayTrigger at it on merge. No
  # AWS mutation was made by this PR's author; the change lands as IaC and
  # applies via deploy-infrastructure.yml on merge, same as every other
  # resource in this file.
  # Deliberately NO AlertsSubscription sibling — the whole point is zero
  # subscribers, so a forced weekly failure lands here and pages no one.
  # Re-exam: 2026-09-14 (matches the closes-when measurement date already
  # set on alpha-engine-config-I9756) — revert SaturdayTrigger's Input back
  # to AlertsTopic once phase 0 exits or the old pipeline is retired,
  # whichever comes first.
  AlertsMutedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: alpha-engine-alerts-muted
      DisplayName: Alpha Engine Alerts (muted — crucible v2 build window)

  # --------------------------------------------------------------------------
  # DynamoDB — Step Function Execution Mutex (L274 SF MutualExclusionGuard)
  # --------------------------------------------------------------------------
  # Single-writer-per-cadence-cell invariant for the three Alpha Engine SFs.
  # Closes the architectural hole that the L286a/b producer-side
  # `universe_writer_lock` covers for manual `daily_append` invocations —
  # that lock guards the data writer; this table guards the SF entry point.
  # Together they cover both halves of "exactly one cron-fired execution of
  # each SF per slot" (run-date slot for the weekly SF, minute bucket for
  # the weekday/EOD SFs — see Schema note below).
  #
  # Trigger of record: the 2026-05-26 duplicate-EventBridge-target incident
  # (PR #322), where two parallel SF executions raced 321 unique-symbol
  # ArcticDB E_NON_INCREASING_INDEX_VERSION errors in MorningEnrich and
  # hard-failed the weekday pipeline. The PR #322 CFN-target-uniqueness
  # CI gate catches the SPECIFIC duplicate-target shape; this mutex catches
  # the broader class (operator double-paste, EventBridge internal retry-on-
  # throttle, cross-region replay coincidence, any future shape the CI
  # chokepoint misses).
  #
  # Schema: mutex_key (S) PK, plus (config#2280) an OPTIONAL ttl_epoch (N)
  # attribute with table TTL enabled.
  # - WEEKLY SF (step_function.json): mutex_key encodes
  #   `{state-machine-name}#{pipeline_role}#{run_date}` — the RUN-SLOT — so
  #   staggered duplicate triggers of the same run-slot conflict at ANY
  #   minute distance (the old minute bucket only caught same-minute dups).
  #   A run-date key has no natural expiry, so the weekly AcquireMutex
  #   stamps ttl_epoch (~24h) as the crashed-holder BACKSTOP; the PRIMARY
  #   stale-item mechanism is scripts/weekly_sf_rerun.py's verified steal
  #   (delete only after the holder execution is confirmed terminal).
  #   alpha-engine-config-I12228: the weekly SF now also releases its own
  #   item on every Fail terminal (conditional DeleteItem) and takes over a
  #   held slot whose holder is FAILED/TIMED_OUT/ABORTED (GetItem +
  #   DescribeExecution + conditional PutItem) — same steal rule, in-machine.
  # - WEEKDAY/EOD SFs still key on the minute bucket and write NO ttl_epoch;
  #   items without the attribute never expire (DynamoDB TTL ignores them),
  #   so this TimeToLiveSpecification is a purely ADDITIVE, backward-
  #   compatible change — enabling TTL on a live table is a safe in-place
  #   UpdateTimeToLive, no table replacement.
  # Item accumulation is ~12 items/week × cadence runs ≈ <1000/yr;
  # PAY_PER_REQUEST storage cost is negligible (sub-cent annual). TTL
  # supersedes the config#730 stale-item sweeper for weekly items; the
  # weekday/eod minute-bucket items remain permanent-but-benign as before.
  ExecutionMutexTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: alpha-engine-sf-execution-mutex
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mutex_key
          AttributeType: S
      KeySchema:
        - AttributeName: mutex_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl_epoch
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  # NOTE: AlertsTopic also has a SECOND subscriber — a Lambda that mirrors
  # every alert to s3://alpha-engine-research/changelog/incidents/ for the
  # system-wide event-mining changelog. That Lambda + its IAM role + its
  # SNS subscription are managed OUTSIDE this CF stack, in
  # `infrastructure/lambdas/changelog-incident-mirror/`. Reason: when those
  # resources lived in this stack, every CI deploy hit a perm-cascade on
  # the github-actions-lambda-deploy OIDC role (iam:TagRole, iam:GetRole,
  # ...). Orphaning the Lambda kept the OIDC role narrow and removed the
  # cascade. See alpha-engine-config#860 "SNS-mirror Lambda — orphan vs CF
  # management" (migrated from ROADMAP.md on 2026-06-11, config PR #623) for
  # the full trade-off + future reconsideration triggers.

  # --------------------------------------------------------------------------
  # Step Functions — Saturday Pipeline
  # --------------------------------------------------------------------------
  SaturdayPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-weekly-freshness-pipeline
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionS3Location:
        Bucket: alpha-engine-research
        Key: infrastructure/step_function.json
      # SINGLE-WRITER CONTRACT (config#2273): the repo file
      # infrastructure/step_function.json is the sole source of truth for
      # this definition. DefinitionS3Location is only READ at stack-create /
      # resource-replacement time; both deploy paths
      # (deploy-infrastructure.sh on merge, deploy_step_function.sh for
      # manual/bootstrap) upload the stamped repo bytes to this exact S3
      # key BEFORE update-state-machine, so a CFN restamp can only ever
      # re-deploy the same bytes — CFN is not an independent writer in
      # practice. Drift backstop across all three copies (repo / S3 / live):
      # infrastructure/step-functions/check-definition-drift.py.
      # LoggingConfiguration is DECLARED here (declarative SoT for the
      # shape) and ASSERTED explicitly (--logging-configuration) by the
      # deploy scripts on every update since config#2273 — never left to
      # partial-update preservation (the recreate-drops-logging class is
      # config#1464). Logging the SF execution FailedEvents (level=ERROR)
      # is what carries the L274 MutexConflict Cause into the log group
      # for the metric filter below. The ne-* rename (config#1381)
      # re-created these SFs without logging — this restores it.
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WeeklyFreshnessLogGroup.Arn

  # --------------------------------------------------------------------------
  # Step Functions — Weekday Pipeline
  # --------------------------------------------------------------------------
  WeekdayPipeline:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: ne-preopen-trading-pipeline
      RoleArn: !Ref StepFunctionsRoleArn
      DefinitionS3Location:
        Bucket: alpha-engine-research
        Key: infrastructure/step_function_daily.json
      # LoggingConfiguration owned here — see SaturdayPipeline note above.
      LoggingConfiguration:
        Level: ERROR
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt PreopenTradingLogGroup.Arn

  # --------------------------------------------------------------------------
  # EventBridge Rules — Pipeline Triggers
  # --------------------------------------------------------------------------
  SaturdayTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-engine-saturday
      # 09:00 UTC chosen so polygon's prior-session daily aggregate has
      # settled (T+1 lag) before MorningEnrich + DataPhase1 fetch it.
      # THU-SAT (config#1824, Brian-ratified 2026-07-06): the weekly runs
      # ONE DAY AFTER the week's LAST trading session — Saturday normally,
      # Friday when Friday is an NYSE holiday, Thursday on a Thu+Fri double
      # holiday. The cron fires all three days; the SF's WeeklyRunDayGate
      # (predictor Lambda action=check_weekly_run_day, pure calendar math)
      # self-selects the single correct firing and Succeed-skips the rest.
      # Replaces the hand-built one-shot shift used for the 2026-07-03
      # holiday week.
      Description: Thu-Sat 09:00 UTC — weekly pipeline fires day after last trading session (WeeklyRunDayGate self-selects; config#1824)
      ScheduleExpression: 'cron(0 9 ? * THU-SAT *)'
      State: DISABLED
      # DISABLED by Brian's ruling 2026-10-28 (v1 Saturday weekly off; the v2
      # weekly and the data-collection weekly are separate triggers and still
      # run). Set DISABLED live 2026-10-28 15:08Z; pinned here so the next edit
      # to this resource cannot re-enable it. Declared in
      # infrastructure/automation_pause.json `paused` (alpha-engine-config-I12801);
      # retires with v1 under alpha-engine-config-I10655.
      Targets:
        # SINGLE TARGET PER RULE. EventBridge dispatches the cron event
        # to every target on a rule; a duplicate target ID fans the
        # trigger to two parallel SF executions. The Tuesday 5/26
        # weekday-pipeline failure (321 E_NON_INCREASING_INDEX_VERSION
        # ArcticDB races during MorningEnrich) was caused by exactly
        # that — PR #317 added a parallel target via the deploy script
        # alongside this CFN target. The substrate gate is the
        # TestCFNTargetUniqueness chokepoint, which fails CI if any
        # cron rule grows a second target. SoT for this rule is THIS
        # FILE; the deploy scripts no longer touch EventBridge.
        - Id: saturday-pipeline
          Arn: !Ref SaturdayPipeline
          RoleArn: !Ref EventBridgeSfnRoleArn
          # pipeline_role tag (Option-D 2026-05-25): identifies this as the
          # canonical Saturday weekly cadence run. Page 25 filters to
          # role="weekly" by default so smoke / recovery / operator-replay
          # executions don't displace the real weekly run as "most recent".
          # Ad-hoc operator launches MUST set their own pipeline_role
          # (smoke / recovery / backfill / operator-replay) per the
          # taxonomy in pipeline-reporting-revamp-260524.md §6.
          #
          # NO ec2_instance_id (config#2248, root-cause SPOF fix): this Input
          # used to hardcode ["${MicroInstanceId}"] — the always-on dashboard
          # box (12 live services, persistent/stateful) — as the launcher for
          # all 14 downstream SF states that SSM-invoke onto $.ec2_instance_id.
          # A full disk on that box killed the entire weekly run. The SF's own
          # CheckSpotDispatchNeeded/DispatchWeeklyFreshnessSpot states
          # (step_function.json, right after AcquireMutex) now populate
          # $.ec2_instance_id themselves from a FRESH ephemeral spot on every
          # cadence execution — this Input intentionally omits the field so
          # that dispatch path always engages. An operator wanting to target
          # an EXISTING box explicitly still can via a manual StartExecution
          # input carrying ec2_instance_id (the same escape hatch
          # scripts/weekly_sf_rerun.py's rerun passthrough uses) — this cron
          # Input is not that path.
          #
          # skip_parity (2026-08-13, Brian ruling — alpha-engine-config-I7309
          # tracks re-enabling in phase 3): the CADENCE run does not execute
          # pit_parity. CheckSkipParity routes straight to CheckSkipEvaluator,
          # which bypasses ParityParallel (lookahead + walkforward + replay)
          # AND PitParityCompare in one hop — compare is only reachable via
          # the Parallel's exit path, so this single flag disables the whole
          # branch and no second flag is needed.
          #
          # Legitimate because pit_parity gates nothing: analysis/pit_parity.py
          # states its own contract as "observational — it never gates the
          # Saturday SF and never writes optimizer configs". It emits a
          # contamination report a human reads. The weekly pipeline was being
          # blocked by a stage with no downstream consumer — 2 real verdicts in
          # 13 attempts (alpha-engine-config#6036).
          #
          # NOT a permanent removal and NOT a silent skip. Two blockers must
          # clear before I7309 can close: the walk-forward pass cannot finish
          # inside any sane budget (2700s timeout on 2026-08-13 runs -2/-4/-5;
          # the lookahead pass runs ONE simulation in 922s while walkforward
          # runs param_sweep.sweep -> _run_combos, one simulation PER COMBO —
          # asymptotically different work under a single shared ceiling), and
          # the walk-forward pass places ZERO orders (`shares round to 0
          # (weight=0.000, dollar=$0)` on all 20 signals -> pit_status
          # no_orders, while current_status is ok on the same date grid).
          #
          # Scope WAS the cadence trigger only. Widened 2026-08-14 (Brian
          # ruling, "disable it in the meantime"): the Friday shell-run trigger
          # Lambda (infrastructure/lambdas/eod-success-friday-shell-trigger/
          # index.py::_build_shell_run_input) and both inputs in
          # infrastructure/run_weekly_offcycle.sh now carry the flag too, so no
          # AUTOMATIC launch path runs parity until I7309 clears.
          #
          # The divergence was itself a defect: the Friday run exists to
          # rehearse Saturday, and a rehearsal taking a different input
          # rehearses something production never runs. Measured on execution
          # friday-shell-2026-08-14-validate-i7386 — it cleared every stage
          # Saturday actually executes, then died with States.DataLimitExceeded
          # inside ParityParallel, a state the cadence run skips entirely.
          #
          # The working loop for I7309 is unchanged, and is now the ONLY way
          # parity runs: an operator StartExecution carrying
          # {"skip_parity": false} overrides these defaults (InitializeInput's
          # JsonMerge puts user input ABOVE them), and the smoke-pit-parity
          # slice still reproduces the no_orders half in 70s.
          # sns_topic_arn routed to AlertsMutedTopic, not AlertsTopic
          # (alpha-engine-config-I9756, crucible v2 phase 0 deliverable 3;
          # Brian ruling I9751 item 3a — old-weekly results are IGNORED
          # during the v2 build). AlertsMutedTopic carries zero subscribers
          # by design, so all 28 sns:publish states this SF reaches land in
          # a topic that pages nobody. preopen/postclose are untouched —
          # each carries its own Input, unrelated to this rule. Re-exam
          # 2026-09-14: revert to "${AlertsTopic}" once phase 0 exits or
          # the old pipeline is retired.
          #
          # skip_data_phase2 + skip_rag_ingestion (alpha-engine-config-I11832,
          # 2026-10-02): ONE writer per unit. The v2 weekly schedule
          # (nousergon-data-collection.yaml :: WeeklySchedule, ENABLED,
          # Sat 05:00 America/New_York = this rule's 09:00 UTC under EDT)
          # runs `alternative-phase-two` (D15) and `rag-weekly-ingestion`
          # (D16 + D46) — the SAME commands this SF's DataPhase2 and
          # RAGIngestion states run, against the SAME keys
          # (market_data/weekly/{date}/alternative/*, rag/manifest/{date}.json,
          # rag/manifest/latest.json, rag/filing_changes/, the rag.* tables).
          # Left on, the two writers overlap: v1's DataPhase2 starts
          # ~ResearchPredictorParallel + 20 min, while v2's
          # alternative-phase-two is still mid-crawl, and phase 2's same-date
          # auto-skip only fires on a COMPLETED prior run's ok marker — so both
          # crawl Finnhub at once (~54 req/min each against a 60/min limit,
          # collectors/finnhub_client.py) and the later finisher's per-ticker
          # JSON wins. No other v1 state reads either stage's result, and
          # both sit at the tail of Branch A, after Scanner/SignalsEnvelope,
          # so later readers get the same keys from the v2 writer. Both
          # flags are plain boolean skip gates (CheckSkipDataPhase2,
          # CheckSkipRAGIngestion) — no topology change, revertible by
          # deleting these two lines. Pinned by
          # tests/test_saturday_trigger_skips_v1_data_copies.py. The stages
          # themselves leave the definition in I11832's own cutover.
          Input: !Sub |
            {
              "sns_topic_arn": "${AlertsMutedTopic}",
              "pipeline_role": "weekly",
              "skip_parity": true,
              "skip_data_phase2": true,
              "skip_rag_ingestion": true
            }

  # Friday-PM "shell run" cron rule (alpha-engine-friday-shell-run) RETIRED
  # 2026-05-29 (ROADMAP L4055): superseded by the event-driven
  # alpha-engine-eod-success-friday-shell-trigger Lambda
  # (infrastructure/lambdas/eod-success-friday-shell-trigger/, shipped #282),
  # which fires the Saturday SF in shell_run mode on the Friday EOD-SF
  # SUCCEEDED transition (trading_day-bound, not wall-clock) — eliminating the
  # cron's three failure modes (no-fire on Friday EOD failure, late-rerun
  # blindness, StopTradingInstance race). The cron ran DISABLED from the 5/21
  # event-driven cutover; the event-driven path confirmed across two Fridays
  # (5/22 + 5/29) before this deletion. The shell_run SF gate
  # (InitializeInput→CheckShellRun/ApplyShellRunDefaults) is UNCHANGED — the
  # Lambda still supplies {"shell_run": true, "pipeline_role": "shell-run"}.

  # RENAMED 2026-07-16 (config#2413 live-verification finding): CloudFormation
  # refuses to change a resource's Type under the same logical ID in an
  # update ("Update of resource type is not permitted") — confirmed via a
  # real --no-execute-changeset dry run. WeekdayTrigger existed as
  # AWS::Events::Rule; renaming the logical ID to WeekdayPipelineSchedule
  # makes CFN treat this as a replacement (delete the old Rule, create the
  # new Schedule) instead of an illegal in-place type transform. The
  # `Name: alpha-engine-weekday` PHYSICAL resource name is unchanged, so
  # nothing outside this template (EventBridge target ARNs, IAM references)
  # needs updating — only this logical ID.
  WeekdayPipelineSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: alpha-engine-weekday
      # 2026-05-19: moved 06:00 → 05:45 PT (13:00 → 12:45 UTC) — bought a
      # 13-min P99 buffer (daemon-ready ≤06:17 PT vs 06:30 open). That buffer
      # has since been consumed by added stages (CodeFreshnessGate, predictor
      # health/drift checks, chronic-gap self-heal): live SF history for
      # 2026-07-09/07-10/07-13 (all SUCCEEDED on the first scheduled attempt)
      # shows RunDaemon completing 06:31:45–06:34:15 PT — 2–4 min AFTER the
      # 06:30 PT open every time, not a one-off. State-level breakdown shows
      # PollMorningArcticAppendSpot alone consuming ~36–38 min (~75% of the
      # ~46–49 min total run) — a known/expected duration already documented
      # in alpha-engine-data's data-spot-dispatcher MAX_RUNTIME_SECONDS
      # comment, not a defect to fix here. 2026-07-13: moved 05:45 → 05:15 PT
      # (30-min buffer above the observed ceiling vs the 13-min buffer the
      # 05:45 change relied on) to absorb the same kind of stage-creep
      # without needing another manual bump every ~2 months. See
      # nousergon/alpha-engine-config#2412 (tracked follow-up: early-warning
      # canary so buffer erosion pages automatically instead of being
      # noticed anecdotally).
      # RESOLVED 2026-07-14 (config#2413): migrated this trigger from
      # AWS::Events::Rule to AWS::Scheduler::Schedule so
      # ScheduleExpressionTimezone can carry real IANA-timezone/DST-aware PT
      # scheduling, matching StopTradingSchedule below. Previously, the bare
      # UTC cron on AWS::Events::Rule (no ScheduleExpressionTimezone support)
      # silently assumed PDT (UTC−7); during PST the effective PT start would
      # have shifted an hour earlier (i.e. MORE buffer, not less — benign,
      # but not the documented 5:15 AM PT contract). EventBridge Scheduler
      # resolves the cron below against America/Los_Angeles directly, so it
      # is written in LOCAL PT TIME (05:15), not UTC, and auto-adjusts
      # across the DST boundary to always fire at 5:15 AM PT.
      # INCIDENT 2026-07-20 (first weekday after the migration deployed):
      # the migration originally kept the old UTC cron hour (15 12) while
      # switching the timezone to America/Los_Angeles, which means 12:15 PM
      # PT — the pipeline never fired pre-open and would have launched
      # mid-trading-day instead. When pairing ScheduleExpressionTimezone
      # with an expression, the expression must be converted to that zone's
      # local time.
      Description: Weekday 5:15 AM PT (DST-aware) — daily data + predictor + executor; daemon ready before 06:30 PT open
      ScheduleExpression: 'cron(15 5 ? * MON-FRI *)'
      ScheduleExpressionTimezone: 'America/Los_Angeles'
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        # SINGLE TARGET PER SCHEDULE. See the SaturdayTrigger Targets
        # comment for the 2026-05-26 duplicate-target incident that
        # codified the analogous EventBridge-Rule invariant. SoT for
        # this schedule is THIS FILE; the deploy scripts no longer
        # touch EventBridge/Scheduler.
        #
        # EventBridge Scheduler's Step-Functions integration
        # (arn:aws:scheduler:::aws-sdk:sfn:startExecution) wraps the
        # SFN StartExecution call: StateMachineArn is the target state
        # machine, and Input is a JSON STRING (not a nested object)
        # holding the payload passed through to the execution's own
        # input — the same payload the old AWS::Events::Rule target's
        # top-level Input carried verbatim.
        Arn: 'arn:aws:scheduler:::aws-sdk:sfn:startExecution'
        RoleArn: !Ref EventBridgeSfnRoleArn
        # pipeline_role="daily" (Option-D 2026-05-25): identifies this as
        # the canonical weekday trading-cadence run. Page 25 filters to
        # role="daily" by default for the Weekday section.
        Input: !Sub |
          {
            "StateMachineArn": "${WeekdayPipeline}",
            "Input": "{\"ec2_instance_id\": [\"${MicroInstanceId}\"], \"trading_instance_id\": [\"${TradingInstanceId}\"], \"sns_topic_arn\": \"${AlertsTopic}\", \"pipeline_role\": \"daily\"}"
          }

  # --------------------------------------------------------------------------
  # EventBridge Rules — Independent Triggers
  # --------------------------------------------------------------------------
  ResearchAlerts:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-research-alerts
      Description: Intraday price alerts every 30 min during market hours
      ScheduleExpression: 'cron(0/30 13-21 ? * MON-FRI *)'
      # PAUSED 2026-08-07 (Brian ruling — see infrastructure/automation_pause.json).
      # State lives here, not only live in AWS: deploy-infrastructure.yml re-applies
      # this stack on EVERY push to main, so a console-only disable comes back on the
      # next merge. Flip to ENABLED and drop the manifest entry to un-pause.
      State: DISABLED
      Targets:
        - Id: alerts-lambda
          Arn: !Ref AlertsLambdaArn

  ResearchAlertsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AlertsLambdaArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ResearchAlerts.Arn

  # alpha-engine-config-I2717 (Brian ruling 2026-07-16, option 1: standalone
  # daily heal): the universe-gap self-heal (formerly the head of the
  # preopen SF's MorningArcticAppend state) + the chronic-polygon-gap heal
  # (formerly the preopen SF's ChronicGapSelfHeal state, both REMOVED from
  # step_function_daily.json — see alpha-engine-config-I2722) now run as one
  # standalone EventBridge-triggered spot job, invoking the SAME
  # alpha-engine-data-spot-dispatcher Lambda the preopen/postclose SFs use,
  # via its "daily-heal" workload (weekly_collector.py --daily-heal).
  # 09:00 UTC — hours before the 12:45 UTC preopen, so a healed day still
  # lands same-day ahead of predictor inference.
  DailyHealTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-engine-daily-heal
      Description: Weekday 09:00 UTC — standalone universe-gap + chronic-polygon-gap data heal (alpha-engine-config-I2717), off the preopen critical path
      ScheduleExpression: 'cron(0 9 ? * MON-FRI *)'
      # PAUSED 2026-08-07 (Brian ruling — see infrastructure/automation_pause.json).
      # State lives here, not only live in AWS: deploy-infrastructure.yml re-applies
      # this stack on EVERY push to main, so a console-only disable comes back on the
      # next merge. Flip to ENABLED and drop the manifest entry to un-pause.
      State: DISABLED
      Targets:
        # SINGLE TARGET PER RULE — see SaturdayTrigger's Targets comment for
        # the 2026-05-26 duplicate-target incident that codified this
        # invariant fleet-wide.
        - Id: daily-heal-dispatch
          Arn: !Ref DataSpotDispatcherLambdaArn
          Input: '{"workload": "daily-heal"}'

  DailyHealTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DataSpotDispatcherLambdaArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyHealTrigger.Arn

  # alpha-engine-config-I2722 (Brian ruling 2026-07-16): PredictorHealthCheck
  # + PredictorDriftCheck re-home off the preopen SF onto their own direct
  # EventBridge triggers — approach (a)/(b) per state, NO new bundled health
  # SF (ARCHITECTURE §36: "adding redundant scheduled paths 'for safety' is
  # the wrong fix"). Both are non-blocking observability producers, never
  # trading gates, so a plain scheduled invoke (no SF Catch/fail-soft
  # plumbing needed) is the correct-weight mechanism. 14:40 UTC = after the
  # preopen SF has finished in BOTH DST regimes, so both checks observe the
  # SAME predictions/{trading_day}.json artifact they scored against when
  # they ran inside the SF. The preopen trigger is 05:15 America/Los_Angeles
  # (DST-aware), i.e. 12:15Z under PDT and 13:15Z under PST, and runs 15-50
  # min (measured 10-08..10-28, worst SUCCEEDED 48 min). The old 13:40Z sat
  # after it under PDT only; under PST it fired mid-run. A fixed UTC time
  # that is safe in both regimes needs no edit at either changeover; moving
  # these to AWS::Scheduler::Schedule would rename the resource type that
  # automation_pause.json, the freshness registry and the observability
  # rows key on, for no behavioural gain.
  PredictorHealthCheckTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-engine-predictor-health-check
      Description: Weekday 14:40 UTC — daily predictor model health (IC, hit rate, calibration, retrain triggers), re-homed off the preopen SF (alpha-engine-config-I2722)
      ScheduleExpression: 'cron(40 14 ? * MON-FRI *)'
      # UN-PAUSED 2026-08-26 (Brian ruling, alpha-engine-config-I8704). Paused
      # 2026-08-07 with the rest of the response plane (config-I6617); restored
      # per-entry, the same shape as alpha-engine-pipeline-watchdog-daily
      # (config-I6697) and the three freshness crons (config-I6792).
      #
      # Why this one comes back: it is the ONLY consumer of
      # production_health.json::degradation_flag. That flag has been true since
      # the 2026-08-22 weekly run (ic_ratio 0.11) and nothing could act on it —
      # predictor/alerts/history.jsonl had been silent since 2026-06-25. The
      # failure class it covers is the one the watchdog and the freshness
      # monitors structurally cannot see: a pipeline that succeeds, writes its
      # artifact on time, and reports a model that has stopped working.
      #
      # State lives here, not only live in AWS: deploy-infrastructure.yml
      # re-applies this stack on EVERY push to main, so a console-only enable
      # would be reverted on the next merge.
      State: ENABLED
      Targets:
        - Id: predictor-health-check
          Arn: !Ref PredictorHealthCheckLambdaArn
          Input: '{"action": "check"}'
          # Bounded retry: a once-a-day check needs at most a couple of
          # re-deliveries, not the AWS default of 185 (cost gate).
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  PredictorHealthCheckTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PredictorHealthCheckLambdaArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PredictorHealthCheckTrigger.Arn

  # config#1853 daily prediction-health producer, re-homed per I2722. The
  # SF-era Payload threaded $.trading_day_gate.Payload.check_date for the
  # `date` field — no such state exists on a bare EventBridge invoke, so this
  # omits `date` entirely: nousergon/crucible-predictor's check_drift now
  # defaults a missing date to nousergon_lib.dates.last_closed_trading_day()
  # (fixed alongside this PR — see crucible-predictor-PR<N>, previously
  # date.today() which is NOT trading-day-aware per this repo's Date
  # Conventions rule).
  PredictorDriftCheckTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-engine-predictor-drift-check
      Description: Weekday 14:40 UTC — daily prediction-drift producer (config#1853), re-homed off the preopen SF (alpha-engine-config-I2722)
      ScheduleExpression: 'cron(40 14 ? * MON-FRI *)'
      # PAUSED 2026-08-07 (Brian ruling — see infrastructure/automation_pause.json).
      # State lives here, not only live in AWS: deploy-infrastructure.yml re-applies
      # this stack on EVERY push to main, so a console-only disable comes back on the
      # next merge. Flip to ENABLED and drop the manifest entry to un-pause.
      State: DISABLED
      Targets:
        - Id: predictor-drift-check
          Arn: !Ref PredictorLambdaArn
          Input: '{"action": "check_drift"}'
          # Bounded retry: a once-a-day check needs at most a couple of
          # re-deliveries, not the AWS default of 185 (cost gate).
          RetryPolicy:
            MaximumRetryAttempts: 2
            MaximumEventAgeInSeconds: 3600

  PredictorDriftCheckTriggerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref PredictorLambdaArn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PredictorDriftCheckTrigger.Arn

  # --------------------------------------------------------------------------
  # EventBridge Scheduler — Stop Trading Instance (10 PM PT backstop)
  # --------------------------------------------------------------------------
  # Note: EventBridge Scheduler uses a different API than EventBridge Rules.
  # CloudFormation support for Scheduler is via AWS::Scheduler::Schedule.
  #
  # Role: late-night cost-guard backstop. The EOD SF's
  # ``StopTradingInstance`` + ``ForceStopInstance`` states are the
  # authoritative stoppers right after market close (success or failure
  # path). This scheduler only fires if both of those paths missed —
  # e.g. EOD SF never started, daemon never triggered the SF, or AWS
  # SDK call failures left the instance running past expected stop.
  # 10:00 PM PT places it ~8 h after market close, well outside any
  # legitimate same-day workflow.
  StopTradingSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: alpha-engine-stop-trading
      Description: Cost-guard backstop — stop trading EC2 at 10 PM PT if EOD SF didn't
      ScheduleExpression: 'cron(0 22 ? * MON-FRI *)'
      ScheduleExpressionTimezone: 'America/Los_Angeles'
      FlexibleTimeWindow:
        Mode: 'OFF'
      State: ENABLED
      Target:
        Arn: 'arn:aws:scheduler:::aws-sdk:ec2:stopInstances'
        RoleArn: !Ref EventBridgeEc2RoleArn
        Input: !Sub '{"InstanceIds": ["${TradingInstanceId}"]}'

  # --------------------------------------------------------------------------
  # CloudWatch Alarms: none. This stack owns no AWS::CloudWatch::Alarm.
  # --------------------------------------------------------------------------
  # alpha-engine-config-I9009 step 2: the 14 alarms this stack used to declare
  # were handed to their codified owner,
  # nous-ergon-ops/infrastructure/cloudwatch/alarms/<AlarmName>.json, which is
  # the only applier (alpha-engine-config-I7339). Step 1 (nousergon-data#2288)
  # deployed DeletionPolicy/UpdateReplacePolicy: Retain on all 14 first, so the
  # stack update that dropped them released the live alarms without calling
  # DeleteAlarms. Before this, every push to main re-stamped the stack and
  # reasserted this file's copy of each alarm over the codified one.
  # A new alarm goes in nous-ergon-ops, not here:
  # tests/test_orchestration_stack_owns_no_alarms.py fails on one.
  # The alarms retired here earlier (alpha-engine-config-I11792) are in git
  # history.
  WeeklyFreshnessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/ne-weekly-freshness-pipeline
      RetentionInDays: 30

  PreopenTradingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/ne-preopen-trading-pipeline
      RetentionInDays: 30

  # The SF MutualExclusionGuard (L274) fails a duplicate-trigger execution with a
  # terminal `MutexConflict` Fail. Until 2026-10-15 three log metric filters
  # (one per machine, matching "MutexConflict") and three alarms (`ne-{weekly-freshness,preopen-
  # trading,postclose-trading}-mutex-conflict`) paged on it. RETIRED by Brian's
  # "Cut redundant" ruling (alpha-engine-config-I11792): a MutexConflict is a Fail
  # state, so the execution ends FAILED and `alpha-engine-sf-status-change` ->
  # alpha-engine-sf-telegram-notifier already pages it, Cause line included, on
  # all three machines, alongside the SF's own HandleFailure email. Removing the
  # resources here is what deletes the live alarms: the stack update calls
  # DeleteAlarms via `InfraDeployCfnOnlyDelete` (aws:CalledVia=cloudformation).
  # Their codified copies leave nous-ergon-ops/infrastructure/cloudwatch/alarms/
  # in the same arc.

  # config#1819 (2026-07-06/07): SNS-publish TaskFailed metric on the weekly
  # SF. Its alarm, ne-weekly-freshness-sns-publish-failed, is codified in
  # nous-ergon-ops (alpha-engine-config-I9009); this filter stays here because
  # it is what emits the metric that alarm reads. Motivating incident (2026-06-12): NotifyComplete (a SUCCESS-path
  # notifier) threw SNS.InvalidParameterException (Subject >100 chars / a
  # newline / empty), failing an otherwise-succeeded pipeline. The SF fix
  # (step_function.json) wraps NotifyComplete + NotifyShellRunComplete in
  # their own Catch so a publish failure no longer fails the execution —
  # but a silently-caught failure needs its own visibility surface so it
  # doesn't just vanish. Step Functions logs a TaskFailed history event at
  # LoggingConfiguration Level:ERROR REGARDLESS of whether a Catch handles
  # it (confirmed against the AWS docs event-level table), so this filter
  # sees the caught failure even though the execution itself still shows
  # SUCCEEDED. SCOPE / KNOWN LIMITATION: TaskFailed's logged fields
  # (resource/resourceType/error/cause) do NOT include the state name —
  # CloudWatch Logs Metric Filters match a single line and cannot
  # correlate across the separate TaskStateEntered event that DOES carry
  # the name, so this filter matches ANY sns:publish TaskFailed on this SF
  # (all 7 sns:publish states), not NotifyComplete specifically. That is
  # an acceptable trade for this alarm's purpose (today, on the weekly SF,
  # the only sns:publish sites with a Catch that swallows the failure
  # entirely — i.e. that could otherwise go silent — are NotifyComplete /
  # NotifyShellRunComplete; every other sns:publish site either has no
  # Catch (so a failure already fails the execution -> the existing
  # HandleFailure email path) or is itself a best-effort early-signal alert
  # inside ResearchPredictorParallel whose branch still ends up visible via
  # CheckBranchOutcomes). Same string-match-precision trade the retired
  # MutexConflict filters (above) accepted.
  SnsPublishFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: WeeklyFreshnessLogGroup
    Properties:
      LogGroupName: /aws/stepfunctions/ne-weekly-freshness-pipeline
      FilterPattern: '"TaskFailed" "sns:publish"'
      MetricTransformations:
        - MetricNamespace: AlphaEngine/StepFunctions
          MetricName: WeeklyFreshnessSnsPublishFails
          MetricValue: '1'

# ============================================================================
# Outputs
# ============================================================================

  # --------------------------------------------------------------------------
  # Preflight sweep — daily all-stage --preflight-only check (config-I7249)
  # --------------------------------------------------------------------------
  # WHY this schedule is shaped as it is — declared HERE rather than baked
  # into deploy.sh; deliberately NO AWS::Lambda::Permission (the dispatcher
  # Lambda's resource-based policy is granted out-of-band by deploy.sh
  # --bootstrap, mirroring the other scheduled dispatchers in this template).
  # Its two alarms — the deadman alpha-engine-preflight-sweep-no-run, whose
  # Period/EvaluationPeriods derive from the declared daily cadence, and
  # alpha-engine-preflight-sweep-dispatcher-errors — are codified in
  # nous-ergon-ops (alpha-engine-config-I9009). The design is documented in infrastructure/preflight_sweep_stages.py,
  # infrastructure/preflight_sweep_cadence.json and the dispatcher README.
  # tests/test_preflight_sweep_cadence.py fails if any of it drifts from the
  # manifest (the single declared source per sf-pipeline-policy §2.6).
  #
  # These comments were trimmed to fit the old 51200-byte inline
  # --template-body ceiling and are restored here now that
  # deploy-infrastructure.sh uploads via --template-url instead
  # (alpha-engine-config-I7250 — the ceiling is 460800 bytes now).
  PreflightSweepDailyTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: alpha-engine-preflight-sweep-daily
      Description: >-
        Daily all-stage --preflight-only sweep of the weekly SF (config-I7249).
        Cadence declared in infrastructure/preflight_sweep_cadence.json — this
        rule's ScheduleExpression is asserted against that manifest by
        tests/test_preflight_sweep_cadence.py, so the two cannot drift apart
        silently.
      ScheduleExpression: 'cron(0 8 ? * * *)'
      State: ENABLED
      Targets:
        - Id: preflight-sweep
          Arn: !Ref PreflightSweepDispatcherLambdaArn
          Input: '{"mode": "scheduled"}'

  # --------------------------------------------------------------------------
  # Durable alert log (alpha-engine-config-I12323, Director plan C41)
  # --------------------------------------------------------------------------
  # Every `nousergon.alert.v1` event on the `nousergon-alerts` bus is kept in
  # two stores, because each answers a question the other cannot:
  #
  #   READ   AlertLogDeliveryStream -> s3://alpha-engine-research/ops/alerts/v1/
  #          dt=YYYY-MM-DD/<firehose object>. Each object is JSON Lines, one
  #          whole EventBridge envelope per line ({version, id, detail-type,
  #          source, account, time, region, resources, detail}). This is what
  #          the console's /planner alert views read (C42).
  #   REPLAY AlertBusArchive: the native EventBridge archive, 90 days. It can
  #          re-drive past events back onto the bus (for example into the
  #          Overseer intake after an intake outage), but it CANNOT be read
  #          in place. That is why it is not the console's store.
  #
  # The bus itself (and the Overseer intake rule on it) is still provisioned by
  # infrastructure/setup_overseer_intake.sh. Both resources here only REFER to
  # the bus by name. The pattern is detail-type only, so it covers every
  # emitter: krepis (`nousergon.krepis`), the SNS forwarder
  # (`nousergon.sns-forwarder`), the console milestone journal and any later
  # source that keeps the contract.
  AlertBusArchive:
    Type: AWS::Events::Archive
    Properties:
      ArchiveName: nousergon-alerts-alert-v1
      Description: Every nousergon.alert.v1 event on nousergon-alerts, for replay (alpha-engine-config-I12323)
      SourceArn: !Sub 'arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/nousergon-alerts'
      EventPattern:
        detail-type:
          - nousergon.alert.v1
      RetentionDays: 90

  # Buffering: 60 s / 1 MB. The bus carries ~65 events/day (~1 KB each, 4.8 KB
  # max, measured 14 days to 2026-10-15), so the interval, not the size,
  # flushes. That gives /planner one-minute freshness and at most one object
  # per minute that has alerts. AppendDelimiterToRecord makes the object JSON
  # Lines. Without it Firehose concatenates the envelopes with no separator.
  # Uncompressed: at this volume gzip saves nothing worth a decode step in
  # every reader.
  AlertLogDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: nousergon-alert-log
      DeliveryStreamType: DirectPut
      ExtendedS3DestinationConfiguration:
        BucketARN: arn:aws:s3:::alpha-engine-research
        RoleARN: !Ref AlertLogFirehoseRoleArn
        Prefix: 'ops/alerts/v1/dt=!{timestamp:yyyy-MM-dd}/'
        ErrorOutputPrefix: 'ops/alerts/v1-errors/!{firehose:error-output-type}/dt=!{timestamp:yyyy-MM-dd}/'
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 1
        CompressionFormat: UNCOMPRESSED
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: AppendDelimiterToRecord
              Parameters:
                - ParameterName: Delimiter
                  ParameterValue: '\n'

  AlertLogRule:
    Type: AWS::Events::Rule
    Properties:
      Name: nousergon-alert-log
      Description: Every nousergon.alert.v1 event -> Firehose nousergon-alert-log -> s3 ops/alerts/v1/ (alpha-engine-config-I12323)
      EventBusName: nousergon-alerts
      EventPattern:
        detail-type:
          - nousergon.alert.v1
      State: ENABLED
      Targets:
        - Id: nousergon-alert-log
          Arn: !GetAtt AlertLogDeliveryStream.Arn
          RoleArn: !Ref EventBridgeSfnRoleArn

Outputs:
  AlertsTopicArn:
    Value: !Ref AlertsTopic
    Description: SNS topic for all Alpha Engine alerts

  SaturdayPipelineArn:
    Value: !Ref SaturdayPipeline
    Description: Saturday pipeline state machine ARN

  WeekdayPipelineArn:
    Value: !Ref WeekdayPipeline
    Description: Weekday pipeline state machine ARN

  ExecutionMutexTableName:
    Value: !Ref ExecutionMutexTable
    Description: DynamoDB table name for SF execution mutex (L274)

  AlertLogPrefix:
    Value: s3://alpha-engine-research/ops/alerts/v1/
    Description: Durable nousergon.alert.v1 log, JSON Lines under dt=YYYY-MM-DD/ (alpha-engine-config-I12323)
