# Nousergon Overseer playbook registry — SSoT for the fleet's failure-response
# paths (alpha-engine-config-I2823, epic alpha-engine-config-I2821).
#
# Consumed by:
#   - infrastructure/lambdas/overseer-dispatcher (bundled into its zip at
#     deploy time) — routes dispatch requests to the executor Lambda and
#     handles verdict escalation.
#   - tests/test_overseer_playbook_registry.py — schema + cross-reference
#     contract (executor lambda dirs exist, benign_reasons present on routed
#     entries).
#
# Contract: playbooks.schema.json (sibling file). Additive-only evolution —
# new OPTIONAL fields are fine; renames/removals require a schema_version bump
# and a dispatcher release that reads both.
#
# `routed: false` entries are inventory-only: they appear here so the registry
# is the ONE place the watch plane's surface is enumerated (probes/alarms/
# dashboards can iterate it), but the overseer-dispatcher refuses to route to
# them (they have their own trigger topology, e.g. groom's demand-driven
# EventBridge cron — a cron→router hop would add a failure mode with zero
# routing decisions to make).

schema_version: 1

playbooks:
  sf-watch:
    description: >-
      Diagnose+fix+rerun agent for a fleet Step Function terminal failure.
      Triage/suppression policy (watch-log, attempt ceilings, fast path) lives
      UPSTREAM in alpha-engine-saturday-sf-watch-dispatcher; this playbook is
      the launch leg it dispatches when an agent is warranted.
    tier: T2
    routed: true
    enabled: true
    execution_surface: spot
    # config-I3293 — model/wake/cadence are REGISTRY-DECLARED (this file is
    # the one place that answers "what model runs this agent, what wakes it,
    # on what cadence"). `model` is LIVE config, not documentation: the
    # overseer-dispatcher injects it into the executor payload and the
    # executor threads it to the run script's `--model`; the run script's
    # inline default is the fallback ONLY for non-router invocation paths.
    model: deepseek-v4-pro
    # config-#5286 — dispatch semantics registry-declared (was hardcoded in the
    # executor Lambda as DEFER_MAX_GENERATION=3 + defer-not-drop policy). The
    # overseer-dispatcher injects these into the executor payload; the executor's
    # own hardcoded defaults are the fallback for non-router invocation paths.
    on_concurrent: defer
    attempt_ceiling: 3
    drill_isolation: true
    wake:
      - "eventbridge:alpha-engine-saturday-sf-watch-failed (fleet SF terminal failure -> triage Lambda -> router, M2)"
      - "eventbridge:alpha-engine-sf-watch-spot-interruption + alpha-engine-sf-watch-instance-terminated (reclaim/relaunch)"
    cadence: "event-driven only — no scheduled wake"
    # `wake` above is prose for a human; `triggers` is the same fact in a shape
    # a reader can JOIN (alpha-engine-config-I7056). Without it, nothing could
    # tell a playbook paused by Brian's 2026-08-07 ruling from one that is
    # simply broken — both emit nothing, and observability-policy.md §8.3
    # forbids reporting either as the other. infrastructure/overseer/arming.py
    # is the consumer; `surface` must match automation_pause.py's vocabulary
    # ("events" / "scheduler" are different APIs, not aliases).
    triggers:
      - {surface: events, name: alpha-engine-saturday-sf-watch-failed}
      - {surface: events, name: alpha-engine-sf-watch-spot-interruption}
      - {surface: events, name: alpha-engine-sf-watch-instance-terminated}
      # Found by trigger_surface_drift.py on its first live run
      # (alpha-engine-config-I9045). This schedule dispatches
      # {"playbook": "sf-watch", "payload": {"is_drill": "true", ...}} through
      # the router — a real wake path for THIS playbook — and it was declared
      # only under canary-replay, whose triggers list it because the drill is
      # canary-replay's instrument. Both are true and both belong here: the
      # ci-watch drill twin is already declared on both sides, which is what
      # made the asymmetry visible. Being drill-only does not exempt it —
      # `drill_isolation` governs how a drill run is graded, not whether the
      # thing that starts it is a trigger.
      - {surface: scheduler, name: alpha-engine-sf-watch-canary-drill-weekly}
    executor_function: alpha-engine-sf-watch-spot-dispatcher
    executor_lambda_dir: sf-watch-spot-dispatcher
    # Executor verdict `reason` values that are by-design declines — the
    # router treats them as success (no P1, no page). Anything else with
    # launched!=true escalates. NOTE: unlike ci-watch, this executor has no
    # `concurrent_skip` — defer-not-drop (config#2226) replaced it with
    # `deferred`/`recovered` (+ `drill_concurrent_skip` for drills); the
    # registry lockstep test pins this list to the executor's literals.
    benign_reasons: [disabled, deferred, recovered, drill_concurrent_skip]
    charter: alpha-engine-config/.github/sf-watch-prompt.md
    concurrency_domain: >-
      EC2 tag lock on (cadence_slug, pipeline_name, run_date); defer-not-drop
      via one-shot EventBridge Scheduler self-reinvoke (config#2226).
    supports_drill: true
    kill_switch_env: SF_WATCH_DISPATCH_ENABLED  # on the EXECUTOR Lambda
    # Wiring-integrity checks the overseer-liveness-probe runs (I2831). These
    # migrated verbatim from sf-watch-reclaim-sweep-handler's per-probe constants — the
    # registry is now the ONE place this surface is enumerated. The pipeline
    # list is a YAML anchor so it is declared ONCE and stays lockstep with
    # saturday-sf-watch-dispatcher's PIPELINES (pinned by
    # tests/test_overseer_playbook_registry.py). The reclaim-checker (config#2270)
    # + disabled-window sweep (config#2257) ACTION paths are NOT here — they stay
    # in the slimmed sf-watch-reclaim-sweep-handler (their EC2-event trigger topology +
    # 45 pinned tests; full migration tracked as a follow-up).
    liveness:
      checks:
        - type: eventbridge_rule
          rule_name: alpha-engine-saturday-sf-watch-failed
          expect_enabled: true
          expect_target_function: alpha-engine-saturday-sf-watch-dispatcher
          expect_state_machines: &sf_watch_pipelines
            - ne-weekly-freshness-pipeline
            - ne-preopen-trading-pipeline
            - ne-postclose-trading-pipeline
        - type: state_machines_exist
          state_machines: *sf_watch_pipelines
        - type: lambda_active
          function: alpha-engine-saturday-sf-watch-dispatcher
        - type: lambda_active
          function: alpha-engine-sf-watch-spot-dispatcher
          report_kill_switch: SF_WATCH_DISPATCH_ENABLED
          launch_config:
            ami_env: SF_WATCH_AMI_ID
            security_group_env: SF_WATCH_SECURITY_GROUP
            subnets_env: SF_WATCH_SUBNETS
        # alpha-engine-config-I2901: WIRING checks above (eventbridge_rule /
        # state_machines_exist / lambda_active) only assert the dispatcher is
        # deployed+wired — a dispatcher that is Active + correctly targeted but
        # CRASHES on every real invocation (2026-07-17 ListBucket/403 while
        # loading/writing the watch-log) is invisible to them. This check is
        # the INVOCATION-SUCCESS signal: for each mature terminal-failure
        # execution of a watched pipeline (read from the SFs' OWN execution
        # history — independent of the watch-log itself, so a broken writer
        # can't hide its own breakage), the day's watch-log doc must carry a
        # matching event record. `response_window_min` gives the async
        # EventBridge->Lambda hop + write time to land before a miss is a
        # finding, not a race. `watch_prefix` per pipeline mirrors
        # saturday-sf-watch-dispatcher's PIPELINES dict verbatim (pinned by
        # tests/test_overseer_playbook_registry.py).
        - type: sf_watch_invocation_success
          pipelines:
            - {state_machine: ne-weekly-freshness-pipeline, watch_prefix: consolidated/saturday_sf_watch}
            - {state_machine: ne-preopen-trading-pipeline, watch_prefix: consolidated/weekday_sf_watch}
            - {state_machine: ne-postclose-trading-pipeline, watch_prefix: consolidated/eod_sf_watch}
          response_window_min: 10
          lookback_hours: 24

  ci-watch:
    description: >-
      Diagnose+fix agent for a fleet main-branch CI failure. Fired from GHA
      (nousergon-lib notify-ci-failure.yml -> repository_dispatch ->
      sf-watch.yml ci-watch-dispatch job -> this router).
    tier: T2
    routed: true
    enabled: true
    model: deepseek-v4-pro   # config-I3293 — registry-declared, router-injected
    # config-#5286 — ci-watch uses concurrent_skip on collision (no retry),
    # not defer-not-drop: a second commit failing CI independently must get its
    # own dispatch, not queue behind the first (per-SHA lock is the narrow
    # guard). attempt_ceiling=1 means skip-on-first-collision with zero retry.
    on_concurrent: skip
    attempt_ceiling: 1
    drill_isolation: true
    wake:
      - "gha:nousergon-lib notify-ci-failure.yml -> repository_dispatch -> sf-watch.yml ci-watch-dispatch job -> this router (main-branch CI failure)"
    cadence: "event-driven only — no scheduled wake (deprecation to drain intake tracked: config-I2845)"
    triggers:
      - surface: github-actions
        ref: "nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml"
        reason: >-
          repository_dispatch into nousergon-data's sf-watch.yml ci-watch-dispatch
          job, then the router. GitHub Actions carries no AWS trigger state, so
          this leg is outside the 2026-08-07 AWS pause entirely and its arming
          cannot be read from EventBridge.
      - {surface: scheduler, name: alpha-engine-ci-watch-canary-drill-weekly}
    executor_function: alpha-engine-ci-watch-dispatcher
    executor_lambda_dir: ci-watch-dispatcher
    # signature_repeat_skip (config#2862): a signature marker for (repo,
    # today) already carries a fix_pr — the dispatcher declined to spend a
    # fresh spot launch on a SHA-independent defect a prior box today
    # already diagnosed+fixed. By-design decline, not a wiring bug.
    benign_reasons: [concurrent_skip, disabled, signature_repeat_skip]
    charter: alpha-engine-config/.github/ci-watch-prompt.md
    concurrency_domain: EC2 tag lock on (repo, sha) — per-commit, not per-repo.
    supports_drill: true
    kill_switch_env: CI_WATCH_DISPATCH_ENABLED  # on the EXECUTOR Lambda
    # The ci-watch executor's own liveness (was checked as part of
    # sf-watch-reclaim-sweep-handler's spot-dispatch leg; now attributed to its own
    # playbook). Kill-switch value REPORTED, never alerted.
    liveness:
      checks:
        - type: lambda_active
          function: alpha-engine-ci-watch-dispatcher
          report_kill_switch: CI_WATCH_DISPATCH_ENABLED
        # config-I5262: ci-watch dispatches are recorded at
        # ci_watch/_control/dispatched/{repo}-{sha}.json; completion markers
        # live at ci_watch/_control/completed/{repo}-{sha}.json with the
        # same filename. A dispatched record with no matching completion
        # marker after response_window_min means the box died before writing
        # its outcome (the exact failure that triggered this issue).
        - type: dispatch_invocation_success
          family: ci-watch
          dispatch_prefix: ci_watch/_control/dispatched/
          completion_prefix: ci_watch/_control/completed/
          response_window_min: 60
          lookback_hours: 24

  alert-drain:
    description: >-
      The Overseer's non-urgent queue processor (epic I2821 phase 3,
      config-I2824): consumes the nousergon-overseer-intake queue + S3
      fallback, classifies incidents into the T0-T3 authority tiers per the
      alert-drain charter, acts within charter authority (v1: PRs, issues,
      SF reruns only), writes the drain ledger. Fired 4x daily by
      EventBridge Scheduler THROUGH this router, plus event-time for
      freshness CRITICALs (config-I3282).
    tier: T2
    routed: true
    enabled: true
    model: deepseek-v4-pro   # config-I3293 — registry-declared, router-injected; charter may spawn complexity-matched sub-agents (Brian ruling 2026-07-22)
    # config-#5286 — alert-drain uses concurrent_skip on collision: single-lane
    # lock (one drain at a time), no retry on skip (at-least-once queue
    # discipline absorbs double-processing).
    on_concurrent: skip
    attempt_ceiling: 1
    drill_isolation: true
    wake:
      - "scheduler:alpha-engine-alert-drain-0400utc/1000utc/1600utc/2200utc (4x-daily non-urgent queue drain, Brian ruling 2026-07-22)"
      - "event-time: freshness-monitor CRITICAL page -> router (trigger=freshness-critical, config-I3282)"
    cadence: "4x daily 04:00/10:00/16:00/22:00 UTC + event-time on freshness criticals"
    # The worked example for why arming is a property of a TRIGGER, not of a
    # playbook. Measured 2026-08-12: all four schedules below are live DISABLED,
    # and alert-drain still dispatched twice that day — the event-time leg rides
    # the freshness monitors, which Brian deliberately KEPT enabled. A
    # playbook-level "paused" boolean would have been simply false.
    triggers:
      - {surface: scheduler, name: alpha-engine-alert-drain-0400utc}
      - {surface: scheduler, name: alpha-engine-alert-drain-1000utc}
      - {surface: scheduler, name: alpha-engine-alert-drain-1600utc}
      - {surface: scheduler, name: alpha-engine-alert-drain-2200utc}
      - surface: event-time
        ref: "freshness-monitor CRITICAL -> overseer-dispatcher (trigger=freshness-critical)"
        reason: >-
          Not an AWS trigger resource of its own — the freshness-monitor Lambdas
          invoke the router directly (config-I3282). Its arming is the arming of
          alpha-engine-freshness-monitor-{cron,historical-cron,intraday-cron},
          all three of which the pause manifest declares KEPT.
        # alpha-engine-config-I9045. The sentence above was true, joinable by a
        # human, and readable by nothing. Measured 2026-08-28: all four
        # schedules above were live DISABLED and alert-drain ran EVERY DAY that
        # week off this leg — and `arming.py` could only report the leg
        # `unjoinable`, because "its arming is the arming of X" lived in prose.
        # `depends_on` is that sentence in a form the code can follow: these are
        # the AWS resources whose live state IS this leg's arming, so the leg
        # resolves to armed/dark instead of a blank, and
        # `trigger_descriptions.py` can stamp the linkage onto both ends of it
        # (the rules gain `[wakes: alert-drain]`, the schedules gain a
        # `[sibling-legs: ...]` naming the rule that is doing the work).
        depends_on:
          - {surface: events, name: alpha-engine-freshness-monitor-cron}
          - {surface: events, name: alpha-engine-freshness-monitor-historical-cron}
          - {surface: events, name: alpha-engine-freshness-monitor-intraday-cron}
    executor_function: alpha-engine-alert-drain-dispatcher
    executor_lambda_dir: alert-drain-dispatcher
    benign_reasons: [concurrent_skip, disabled]
    charter: alpha-engine-config/.github/alert-drain-prompt.md
    concurrency_domain: >-
      Single lane — EC2 tag lock on Name=alpha-engine-alert-drain-spot (one
      drain at a time; overlap would double-process queue messages).
    supports_drill: true
    kill_switch_env: ALERT_DRAIN_DISPATCH_ENABLED
    # The alert-drain executor's own liveness. Its intake queue + the two
    # intake EventBridge rules are cross-cutting infra, checked under the
    # top-level watch_plane_liveness block below.
    #
    # Run-window accounting (alpha-engine-config#4474): for each MATURE expected
    # trigger (the 4x-daily scheduler cadence below), assert an S3 drain-ledger
    # artifact's run_start landed in [T, T+ceiling+margin]. Key on the LEDGER
    # (overseer/drain_ledger/) rather than the completion marker
    # (_control/completed/) — the marker is written even on rc=1 (a crashing
    # drain looks alive), the ledger only by a charter that ran.
    liveness:
      checks:
        - type: lambda_active
          function: alpha-engine-alert-drain-dispatcher
          report_kill_switch: ALERT_DRAIN_DISPATCH_ENABLED
        # Run-window accounting (config#4474): the drain ledger at
        # overseer/drain_ledger/ is only written by a charter that ran to
        # completion — the completion marker (_control/completed/) is written
        # even on crash, so the ledger (not the marker) is the liveness signal.
        # MAX_RUNTIME_SECONDS=10800 (180m) + boot/report margin = 210m ceiling;
        # margin beyond the ceiling is 30m. The 4x-daily schedule mirrors the
        # four EventBridge Scheduler names in watch_plane_liveness.
        #
        # run_start_field: the drain ledger keys its start timestamp
        # `started_at`; the groom artifact this check was ported from uses
        # `run_start`. Reading groom's name against the drain's schema found
        # nothing, and the reader skipped past every ledger silently, so all
        # four daily triggers were reported as silent deaths while the drain
        # was running normally (false pages 2026-07-29). The reader now RAISES
        # on a missing declared field. Retire this key when G16
        # (alpha-engine-config-I5284) gives every playbook one artifact schema.
        - type: run_window
          label: alert-drain
          artifact_prefix: overseer/drain_ledger/
          run_start_field: started_at
          ceiling_min: 210
          margin_min: 30
          lookback_hours: 30
          # An artifact proves the drain CHARTER RAN, not that it drained
          # anything. The exit-contract backstop (alert_drain_run.sh line 202)
          # already ensures the ledger only exists for a run that completed
          # the charter steps, but unlike the groom artifact (which is written
          # at BOOT time — a crash-cascade writes an artifact but no groom
          # agent ever runs), the drain ledger is written at charter completion
          # by the agent itself. So the ledger IS the proof of a complete run.
          #
          # productive_when tracks whether the drain found ACTUAL events:
          # ingested:queue > 0 means the intake queue had messages and the
          # drain consumed them. The empty-queue case (ingested.queue == 0)
          # is the legitimate zero — "nothing to drain" is a complete,
          # successful run of the dispatch pipe. The two clauses together
          # ensure that ANY well-formed ledger (with an ingested dict)
          # is recognized as productive, making this a DOCUMENTARY
          # declaration rather than a detection tool — the real value is
          # in having the contract explicit so a future schema change
          # cannot silently break it.
          productive_when:
            - {field: ingested.queue, gt: 0}
            - {field: ingested.queue, eq: 0}
          schedule:
            - hour: 4
              minute: 0
              dows: [0, 1, 2, 3, 4, 5, 6]
              label: "04:00 UTC daily"
            - hour: 10
              minute: 0
              dows: [0, 1, 2, 3, 4, 5, 6]
              label: "10:00 UTC daily"
            - hour: 16
              minute: 0
              dows: [0, 1, 2, 3, 4, 5, 6]
              label: "16:00 UTC daily"
            - hour: 22
              minute: 0
              dows: [0, 1, 2, 3, 4, 5, 6]
              label: "22:00 UTC daily"

  groom:
    description: >-
      Backlog groom, both legs of the SAME executor Lambda/SF (config#2201,
      config-I2928 Phase 3): (1) the three daily fixed-cron EventBridge
      triggers running the tier/decision-record groom proper, and (2) the
      demand-driven end-of-SF Haiku PR-sweep leg (`groom_run.sh --mode
      sweep`, fired by scripts/groom_driver.py after a fleet Step Function
      completes rather than on a schedule). Inventory-only here: both legs'
      trigger topology is scheduler/event-driven with zero routing decisions,
      so both keep their direct EventBridge->Lambda path rather than a
      separate registry line — see the liveness comment below for why sweep
      needs no dedicated check either.
    tier: T2
    routed: false
    enabled: true
    executor_function: alpha-engine-scheduled-groom-dispatcher
    # Model is complexity-tiered per issue (Haiku=low / Sonnet=mid+high), set
    # per-run by groom_driver — deliberately NOT the router-injected `model:`
    # field, which only applies to routed playbooks (config-I3293).
    wake:
      - "eventbridge: three daily fixed crons 04:00/12:00/20:00 UTC + Sun 09:00 UTC (demand-driven tier launches)"
      - "demand: end-of-SF Haiku PR-sweep leg (groom_run.sh --mode pr_sweep)"
    # config-I4988 retirement (2026-07-31): this playbook's coverage is the
    # 5-min lane-death + trigger-health reconciler probe INSIDE the dispatcher
    # Lambda (config-I5229 / I4988), NOT a run_window check — the registry no
    # longer mirrors SCHED_CRONS (the §2.7 derive-once defect I4988 was about).
    # The cadence string documents that sibling probe so the config#4474
    # coverage test's documented-sibling exemption applies.
    cadence: "3x daily fixed crons (+ a weekly Sunday slot) + end-of-SF sweep leg — covered by the dispatcher's own 5-min lane-death + trigger-health reconciler liveness probe (config-I5229/I4988), not a run_window check"
    triggers:
      - {surface: scheduler, name: alpha-engine-scheduled-groom-0400-daily}
      - {surface: scheduler, name: alpha-engine-scheduled-groom-1200-daily}
      - {surface: scheduler, name: alpha-engine-scheduled-groom-2000-daily}
      - {surface: scheduler, name: alpha-engine-scheduled-groom-sun0900-weekly}
      - {surface: scheduler, name: alpha-engine-groom-lane-reconciler-5min}
      - {surface: events, name: alpha-engine-groom-sf-failure}
    executor_lambda_dir: scheduled-groom-dispatcher
    charter: alpha-engine-config/scripts/groom_run.sh
    concurrency_domain: EC2 tag lock on groom-issue-filter (tier lane; sweep has its own lane).
    supports_drill: false
    # config-#5286 — groom is the canonical `custom_executor: true` escape
    # hatch. Its pace/demand/tier logic (complexity-tiered per issue, demand-
    # driven scheduling, and end-of-SF sweep leg) predates and cannot be
    # expressed through the instance-level dispatch primitives the registry
    # declares for routed executors. The overseer-dispatcher therefore skips
    # injecting dispatch-semantics fields for this playbook.
    custom_executor: true
    kill_switch_env: GROOM_DISPATCH_ENABLED
    # Run_window liveness check RETIRED 2026-07-31 (config-I4988/I5229) — the
    # reconciler (config-I5229, merged 2026-07-30 in nousergon-data#1111)
    # replaced it with two receipt-based legs inside the dispatcher Lambda,
    # both firing on the same 5-min EventBridge Scheduler tick:
    #
    #   1. lane-death leg — screens the dispatch-ledger expectations against
    #      live EC2 state (launched-but-dead lanes, page in ~5 min vs the old
    #      405-min maturity).
    #   2. trigger-health leg (config-I4988, added with this retirement) —
    #      screens the dispatch SF's OWN execution receipts: every scheduled
    #      fire records an execution, and the dispatcher's decision record
    #      (groom/decisions/{date}/trigger-{HHMM}.json incl. the zero-launch
    #      skip path, sweep-{HHMM}.json for sweep mode) is that fire's
    #      receipt. An execution with no receipt = the Scheduler→SF→Lambda
    #      chain broke below the scheduler → page.
    #
    # The registry deliberately carries NO schedule mirror anymore — the
    # mirrored SCHED_CRONS list whose drift left the check blind on
    # 2026-07-27/28 was the §2.7 derive-once defect this issue is about. The
    # one residual hole (a Scheduler rule that never fires at all produces no
    # execution) is the four scheduler_schedule_exists wiring checks for the
    # groom schedules in watch_plane_liveness (name+state only, no cron).
    #
    # config-I5262: the reconciler's lane-death leg screens live EC2 state —
    # but a lane can be alive on EC2 yet never write an outcome (hung boot,
    # crashed charter), so the completion-marker signal is checked here, on
    # the read-only probe plane. This check is the INVOCATION-SUCCESS signal:
    # for every dispatch-ledger entry (a box was launched with a run_token),
    # assert a completion marker exists at groom/_control/completed/{run_token}.json.
    # A mature dispatch with no completion marker means the box died before
    # writing any outcome.
    liveness:
      checks:
        - type: dispatch_invocation_success
          family: groom
          dispatch_prefix: groom/_control/dispatch-ledger/
          completion_prefix: groom/_control/completed/
          completion_key_field: run_token
          response_window_min: 30
          lookback_hours: 30

  gate-sweeps:
    description: >-
      Daily backlog gate-maintenance sweep train (config-I2928 Phase 3):
      gate_due_sweep.py (Re-exam date arrival flagging), gate_dependency_sweep.py
      (gate:dependency re-admission), gate_sf_run_sweep.py (gate:*-sf
      re-admission on SF success), gate_data_sweep.py (gate:data auto-lift +
      gate:device Re-exam maintenance), gate_milestone_sweep.py (gate:milestone
      auto-clear), check_definition_drift_sweep.py (SF definition drift
      backstop), complexity_gate_boundary_lint.py (complexity:ultra <->
      gate:decision boundary lint), gate_ask_block_sweep.py (Decision Queue
      Ask-block completeness), groom_gate_park.py --resurface (groom:parked
      issue resurface). Inventory-only here: NO Lambda is involved at all — this
      is a pure GitHub Actions scheduled workflow in a DIFFERENT repo
      (alpha-engine-config), so it has no overseer-dispatcher routing surface
      and no executor_function/kill_switch_env to speak of.
    tier: T3
    routed: false
    enabled: true
    trigger_type: github_actions_cron
    workflow_file: .github/workflows/gate-due-sweep.yml
    repo: alpha-engine-config
    schedule_cron: "30 13 * * *"
    triggers:
      - surface: github-actions
        ref: "nousergon/alpha-engine-config/.github/workflows/gate-due-sweep.yml"
        reason: >-
          Pure GitHub Actions cron in a different repo — no Lambda, no
          EventBridge rule, no Scheduler schedule. It is therefore outside the
          2026-08-07 AWS pause entirely, and its arming state lives in GitHub's
          workflow-enabled flag rather than anywhere this module can read.
    charter: alpha-engine-config/scripts/gate_due_sweep.py
    concurrency_domain: >-
      Single GHA concurrency group `gate-due-sweep` (cancel-in-progress:
      false) — the workflow's own steps run sequentially in one job, most
      with continue-on-error so one sweep's failure doesn't mask the rest.
    supports_drill: false

  canary-replay:
    description: >-
      Saturday-replay canary (alpha-engine-config#2246): replays the 3 bug
      classes the Friday dry-preflight is structurally blind to (filing-change
      detection, held-thesis-update, structured-output-retry) against LIVE
      data on a Thursday schedule AND per-PR (crucible-research/nousergon-data,
      `canary:replay` label). Inventory-only here (alpha-engine-config-I2906):
      this Lambda is invoked DIRECTLY by its own Thursday EventBridge rule
      (`alpha-engine-canary-replay-thursday`, classic rule->Lambda target, NOT
      through the overseer-dispatcher router) and synchronously by the GHA
      per-PR shim — zero routing decisions for the router to make, same
      rationale as `groom` above. Its OWN wiring (the Thursday rule + spot
      launch + completion marker) is watched by the dedicated
      `canary-replay-liveness-probe` sibling Lambda, NOT duplicated here —
      this entry exists purely so the registry stays the ONE place the watch
      surface is enumerated (the header claim this playbook was previously
      missing from).
    tier: T2
    routed: false
    enabled: true
    executor_function: alpha-engine-canary-replay-dispatcher
    # alpha-engine-config#4474: run-window liveness accounting. The dedicated
    # canary-replay-liveness-probe sibling Lambda ticks every 15min and provides
    # per-invocation health; this registry-level run_window is an additional
    # backstop asserting that a completion marker exists for each scheduled
    # trigger (Wednesday drills + Thursday weekly canary). The marker prefix
    # is tmp/canary/ (written by canary_replay_spot_bootstrap.sh even on probe
    # failure, so only missing markers = completely skipped launch = problem).
    liveness:
      checks:
        - type: run_window
          label: canary-replay
          artifact_prefix: tmp/canary/
          ceiling_min: 120
          margin_min: 60
          lookback_hours: 240
          schedule:
            - {hour: 15, minute: 0, dows: [3], label: "Wednesday sf-watch canary drill"}
            - {hour: 15, minute: 30, dows: [3], label: "Wednesday ci-watch canary drill"}
            - {hour: 9, minute: 0, dows: [4], label: "Thursday weekly canary replay"}
    wake:
      - "scheduler:alpha-engine-ci-watch-canary-drill-weekly + alpha-engine-sf-watch-canary-drill-weekly (Wednesday drills; router re-point tracked config-I2832)"
    cadence: "weekly Wednesday drills; liveness tick every 15min (eventbridge:alpha-engine-canary-replay-liveness-probe-tick)"
    triggers:
      - {surface: events, name: alpha-engine-canary-replay-thursday}
      - {surface: events, name: alpha-engine-canary-replay-liveness-probe-tick}
      - {surface: scheduler, name: alpha-engine-ci-watch-canary-drill-weekly}
      - {surface: scheduler, name: alpha-engine-sf-watch-canary-drill-weekly}
    executor_lambda_dir: canary-replay-dispatcher
    charter: alpha-engine-config/infrastructure/canary_replay_spot_bootstrap.sh
    concurrency_domain: >-
      Single lane — EC2 tag lock on Name=alpha-engine-canary-replay-spot (one
      canary replay at a time; the deterministic run_token also gives
      at-most-one-live-marker idempotency per ISO week / PR+sha).
    supports_drill: false
    kill_switch_env: CANARY_REPLAY_DISPATCH_ENABLED
    # Liveness is covered by the dedicated canary-replay-liveness-probe sibling
    # Lambda (its own wiring + schedule + tick cadence), NOT by the overseer's
    # registry-driven liveness probe — this entry is inventory-only, so the
    # run-window contract test below (config#4474) accepts this field as proof
    # of alternative coverage instead of requiring a run_window check here.
    sibling_probe_function: alpha-engine-canary-replay-liveness-probe

  arctic-migration:
    description: >-
      Merge-triggered in-region ArcticDB schema-migration runner
      (alpha-engine-config-I3242, runner half of the config-I3236 structural
      fix; pairs with the already-merged migration framework, nousergon-data-
      PR988). Inventory-only here (mirrors groom/canary-replay's own
      rationale): this Lambda is invoked DIRECTLY by
      `.github/workflows/run-arctic-migrations.yml`'s synchronous
      `lambda invoke` on every push to main touching `migrations/**` (plus a
      manual `workflow_dispatch` re-trigger path) — zero routing decisions
      for the overseer-dispatcher router to make, so it keeps its own direct
      GHA->Lambda path rather than a routed registry entry. Exists here
      purely so the registry stays the ONE place the watch-plane surface is
      enumerated.
    tier: T2
    routed: false
    enabled: true
    executor_function: alpha-engine-arctic-migration-dispatcher
    wake:
      - "gha: nousergon-data migrations/ path-filtered workflow on merge (ARCH §120) + manual workflow_dispatch"
    cadence: "event-driven (merge-triggered); no scheduled wake"
    triggers:
      - surface: github-actions
        ref: "nousergon/nousergon-data/.github/workflows/run-arctic-migrations.yml"
        reason: >-
          Synchronous `lambda invoke` from a path-filtered merge workflow (plus
          workflow_dispatch). No EventBridge surface exists to read, so its
          arming is GitHub's, not AWS's — and the 2026-08-07 pause does not
          reach it.
    executor_lambda_dir: arctic-migration-dispatcher
    charter: nousergon-data/scripts/run_arctic_migrations.py
    concurrency_domain: >-
      Single lane per head migration number — EC2 tag lock on
      Name=alpha-engine-arctic-migration-spot +
      arctic-migration-head=<NNNN> (fail-CLOSED on a probe error, unlike the
      fleet's other spot dispatchers' coverage-beats-dedupe posture — a
      migration full-rewrite racing a duplicate box is a correctness risk).
      The on-box runner ALSO refuses to start while any of the three trading
      Step Functions has a RUNNING execution (separate, stricter mutex).
    supports_drill: false
    kill_switch_env: ARCTIC_MIGRATION_DISPATCH_ENABLED

# ── Cross-cutting watch-plane liveness (alpha-engine-config-I2831) ────────────
# Checks that belong to NO single playbook: the overseer-dispatcher router
# itself + the phase-1 intake plane (setup_overseer_intake.sh, config-I2822).
# Today only CW alarms cover these — the probe now asserts their wiring too.
watch_plane_liveness:
  checks:
    - type: lambda_active
      function: alpha-engine-overseer-dispatcher
    # alpha-engine-config-I4480 — the bounded non-agentic responder on the
    # dumb backstop topic. Watched here so a deleted or disabled responder is
    # a finding rather than silence. Its own LAST-RESORT watcher is a
    # CloudWatch alarm on its Errors metric
    # (alpha-engine-watch-plane-backstop-responder-errors) terminating in an
    # SNS email that shares no component with this probe or the responder —
    # the probe watching the responder and the responder re-invoking the probe
    # is mutual, not circular, precisely because that dumb leg exists.
    - type: lambda_active
      function: alpha-engine-overseer-backstop-responder
    - type: sqs_queue_exists
      queue_name: nousergon-overseer-intake
      expect_dlq: nousergon-overseer-intake-dlq
    # alpha-engine-config-I7042: content, not depth. 138 alerts (3 CRITICAL)
    # sat in the DLQ 2026-07-30..08-03 undiagnosable for 12 days behind a
    # >=1 depth alarm and an AccessDenied groom role. Non-destructive sample
    # -> S3 summary + CloudWatch metric + a liveness finding naming every
    # severe body.
    - type: sqs_dlq_content
      dlq_name: nousergon-overseer-intake-dlq
      sample_max: 500
      report_prefix: overseer/dlq_reports/nousergon-overseer-intake-dlq
    - type: eventbridge_rule
      rule_name: overseer-intake-alert-events
      event_bus_name: nousergon-alerts
      expect_enabled: true
      expect_target_queue: nousergon-overseer-intake
    - type: eventbridge_rule
      rule_name: overseer-intake-cw-alarm-state
      expect_enabled: true
      expect_target_queue: nousergon-overseer-intake
    # alpha-engine-config-I2906: the router's OWN trigger topology also
    # includes 4 EventBridge Scheduler schedules (a DIFFERENT AWS resource
    # from the classic `events` rules above — no `eventbridge_rule` check
    # covers these). A deleted/disabled schedule silently stops that surface
    # with nothing watching it. Deliberately NAME + STATE only, never target
    # ARN: alpha-engine-config-I2832 (concurrent workstream) re-points the two
    # weekly canary-drill schedules' targets between the executor Lambdas and
    # this router — asserting target ARN here would race that migration.
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-alert-drain-0400utc
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-alert-drain-1000utc
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-alert-drain-1600utc
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-alert-drain-2200utc
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-ci-watch-canary-drill-weekly
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-sf-watch-canary-drill-weekly
    # alpha-engine-config-I4988: the four groom dispatch schedules. The
    # run_window check that used to watch them is retired — its trigger-
    # health leg inside the dispatcher reconciler covers fires that never
    # write a decision record, but a rule that never FIRES at all produces no
    # execution and is only visible here. NAME + STATE only — no cron mirror,
    # so this cannot drift like the retired schedule list did. Names must
    # stay in sync with SCHED_NAMES in scheduled-groom-dispatcher/deploy.sh
    # (a mismatch is a loud reviewable finding, never a silent blind spot).
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-scheduled-groom-0400-daily
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-scheduled-groom-1200-daily
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-scheduled-groom-2000-daily
    - type: scheduler_schedule_exists
      schedule_name: alpha-engine-scheduled-groom-sun0900-weekly
    # alpha-engine-config#6164: AGENT DISPATCH COMPLETENESS — for every dispatch
    # the dispatch ledger records as launched=True within lookback_hours, the
    # corresponding SSM command must have reached a terminal Success status. A
    # dispatch that reported success and whose command terminated non-success
    # (Failed/TimedOut/Cancelled) is a finding, immediately. This is the
    # 2026-08-01 outage class (nous-ergon-ops-I368): the entire Overseer response
    # plane was dead for ~11 hours and nothing reported it because every sensor
    # upstream of the agent reported success — the SF dispatcher fired, routed
    # via overseer-dispatcher (http=202, launched=True), spot box launched — but
    # the bootstrap aborted 75s in with SECRET_ENV_FILE: unbound variable. SSM
    # recorded Failed at PT1M75.6S. No issue, no PR, no alert. Found by a human
    # nine hours later.
    #
    # Tolerates the window between dispatch-ledger write and SSM command reaching
    # a terminal state (the ledger writes dispatched=True BEFORE the command is
    # known to have started). Commands still InProgress/Delayed/Pending within
    # response_window_min are skipped; commands past the window whose invocation
    # is absent (beyond SSM's ~30-day retention) are also skipped (the ledger
    # entry itself is the only surviving record).
    #
    # Per overseer-policy.md §5 Layer B: reads SSM (the upstream system's own
    # record), never the response plane's log.
    - type: agent_dispatch_completeness
      dispatch_ledger_prefix: overseer/dispatch_ledger/
      response_window_min: 15
      lookback_hours: 24
      ssm_retention_days: 30
    # alpha-engine-config-I4482: watch-plane backstop CloudWatch alarms must
    # exist and be wired to the independent backstop topic (rather than the
    # primary alpha-engine-alerts topic) — a blackout of the primary alert
    # channel must not also silence the alarm that watches the watchers.
    # The `alarm_action_pattern` expects the backstop topic name.
    #
    # Every pattern below was VERIFIED against live CloudWatch on 2026-08-14
    # (the PR's original TODO, now discharged): each matches at least one live
    # alarm, and every matched alarm's AlarmActions is
    # arn:aws:sns:us-east-1:711398986525:alpha-engine-alarm-backstop. So this
    # check reports CLEAN on the day it ships rather than opening with five
    # false "NO alarms match pattern" findings — a detector whose first run is
    # noise is one the reader learns to skip.
    #
    #   overseer-dispatcher            -> 2 alarms (errors, throttles)
    #   alert-drain-dispatcher         -> 2 alarms (errors, throttles)
    #   overseer-intake                -> 3 alarms (dlq-depth, age, severe-content)
    #   overseer-intake-dlq-depth      -> 1
    #   overseer-intake-age            -> 1
    - type: alarm_coverage
      alarms:
        # Per-Lambda watch-plane Errors + Throttles (setup_watch_plane_alarms.sh)
        - name_pattern: alpha-engine-watch-plane-overseer-dispatcher
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168
        - name_pattern: alpha-engine-watch-plane-alert-drain-dispatcher
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168
        - name_pattern: alpha-engine-watch-plane-overseer-intake
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168
        # Intake DLQ depth + age-of-oldest-message
        - name_pattern: alpha-engine-watch-plane-overseer-intake-dlq-depth
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168
        - name_pattern: alpha-engine-watch-plane-overseer-intake-age
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168
        # DLQ severe-content: exists live and wired to the backstop topic, but
        # was undeclared here. Added 2026-08-14 — an alarm nothing declares is
        # outside the coverage denominator, which is the gap this check exists
        # to close.
        - name_pattern: alpha-engine-watch-plane-overseer-intake-dlq-severe-content
          alarm_action_pattern: alpha-engine-alarm-backstop
          max_insufficient_data_hours: 168

# ── Alert-class registry (config-I3211; Brian directive 2026-07-22) ──────────
# One row per DISTINCT notification class the fleet emits. This answers, in
# one read: what can page, on which intake path the overseer sees it, and
# what the declared response is. Inventory verified 2026-07-22 by fleet-wide
# sweep (all 10 repos) + live AWS checks. Contract:
#   intake: bus       — rides the krepis chokepoint -> nousergon-alerts ->
#                       intake SQS (drain consumes; criticals also eligible
#                       for event-time dispatch per artifact registry
#                       remediation declarations, config-I3282)
#   intake: cw-alarm  — CloudWatch ALARM-state tap on the default bus (zero
#                       per-class code; covers every CW alarm)
#   intake: none      — DRAIN-BLIND. Forbidden without either a
#                       migration_issue (tracked path onto the bus) or an
#                       operator_reason (explicit page-only/informational
#                       declaration). CI-enforced.
#   response: drain-queue        — the alert-drain charter's T0-T3 tiers
#   response: playbook:<name>    — a routed playbook responds (must exist)
#   response: operator           — declared human-only
# The drain charter's runtime backstop treats an intake event whose source
# matches NO row here as a T3 finding (registry drift caught at run time;
# the cross-repo static chokepoint is tracked separately).

alert_classes:
  # ── executor (crucible-executor) ──
  - class: executor_turnover_tripwire
    source: "alpha-engine/executor/turnover_tripwire.py"
    severities: [dynamic]
    intake: bus
    response: drain-queue
    # derived: severities [dynamic] — resolved per emission
    tier: dynamic
  - class: executor_optimizer_shadow_rebalance
    source: "alpha-engine/executor/optimizer_shadow.py"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: shadow-optimizer divergence, named in I6751's NOTIFY-SILENT row.
    tier: notify-silent
  - class: executor_order_book_rationale_write
    source: "alpha-engine/executor/main.py"
    severities: [warning]
    intake: bus
    response: drain-queue
    # derived: warning/info only, automated response declared
    tier: tracked-only

  # ── backtester (crucible-backtester) ──
  - class: backtester_executor_opt_rejected
    source: "alpha-engine-backtester/evaluate.py::_run_executor_opt"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: guardrail-HELD is the system working. Named in I6751's
    # TRACKED-ONLY row.
    tier: tracked-only
  - class: backtester_empty_param_sweep
    source: "alpha-engine-backtester/backtest.py"
    severities: [warning]
    intake: bus
    response: drain-queue
    # derived: warning/info only, automated response declared
    tier: tracked-only
  - class: backtester_stance_drift
    source: "alpha-engine-backtester/analysis/stance_distribution.py"
    severities: [error]
    intake: bus
    response: drain-queue
    # DECLARED: stance drift is named in I6751's NOTIFY-SILENT row (suboptimal,
    # not broken).
    tier: notify-silent
  - class: backtester_cost_anomaly
    source: "alpha-engine-backtester/analysis/cost_report.py"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent
  - class: backtester_champion_promotion
    # I3302 rename complete: code now emits the canonical alpha-engine-backtester/ prefix.
    source: "alpha-engine-backtester/optimizer/champion_promotion.py::run_weekly_evaluation"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent
  - class: backtester_producer_arena
    # alpha-engine-config-I9318: the R-slot (selection-producer) arena cycle.
    # Fires only when the cycle comes out `unmeasurable` or `unservable` — i.e.
    # the slot could not decide the live config/producer_champion.json pointer
    # on evidence. Distinct from backtester_champion_promotion above, which
    # alerts when the weekly run RAISES: a cycle that completes and honestly
    # reports "no arm is measurable" is not an exception, and collapsing the
    # two would make the drain queue unable to tell a code defect from missing
    # upstream evidence.
    source: "alpha-engine-backtester/optimizer/producer_arena.py::run_arena_cycle"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent
    operator_reason: >-
      The R-slot arena could not promote or defend the live producer_champion
      pointer on evidence (unmeasurable or unservable). drain-queue is the
      closed loop: T0-T3 triage distinguishes code defects from upstream
      evidence gaps tracked as alpha-engine-config-I9405.
  - class: backtester_live_key_reconciliation
    source: "alpha-engine-backtester/optimizer/live_key_reconciliation.py"
    severities: [critical]
    intake: bus
    response: drain-queue
    # derived: critical/alarm-capable
    tier: page
  - class: backtester_pit_parity
    source: "alpha-engine-backtester/pit_parity"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: point-in-time parity divergence is a measurement-quality
    # finding.
    tier: notify-silent
  - class: backtester_input_quality
    source: "alpha-engine-backtester/analysis/input_quality.py"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: input-quality degradation — suboptimal results, not a halt.
    tier: notify-silent

  # ── predictor (crucible-predictor) ──
  - class: predictor_risk_model_persist
    source: "alpha-engine-predictor/training/train_handler.py::risk_model_persist"
    severities: [warning]
    intake: bus
    response: drain-queue
    # derived: warning/info only, automated response declared
    tier: tracked-only
  - class: predictor_model_zoo
    source: "alpha-engine-predictor/training/model_zoo.py::run_rotation_and_select"
    severities: [info, warning, critical]
    intake: bus
    response: drain-queue
    # derived: critical/alarm-capable
    tier: page
  - class: predictor_predictions_write
    source: "alpha-engine-predictor/inference/stages/write_output.py::write_predictions"
    severities: [warning, critical]
    intake: bus
    response: drain-queue
    # derived: critical/alarm-capable
    tier: page
  - class: predictor_observe_calibration
    source: "predictor.inference.observe_calibration"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: calibration drift, named in I6751's NOTIFY-SILENT row.
    tier: notify-silent
  - class: predictor_shadow_leaderboard_unmeasurable_arm
    # alpha-engine-config-I9336 (crucible-predictor-PR587): a registered
    # stage=challenger arm (e.g. sota-directional-combine, the champion-arch
    # candidate) that wrote no comparable shadow prediction within the last
    # MEASURABILITY_LAG_CYCLES cohort cycles. DELIBERATELY `warning` +
    # `drain-queue`, never `critical`/`operator` — this is a measurement-
    # coverage signal (fixed by repairing the shadow write path, or by the
    # shadow runner's own rotation reaching the starved arm), not a
    # trading-halt condition, and must not page the one operator chat
    # (the 2026-08-28 alert-destination-arc lesson: severity alone does not
    # pick a destination tier, so severity and response are chosen together
    # here, not severity alone).
    source: "alpha-engine-predictor/analysis/observe_leaderboard.py::build_observe_leaderboard"
    severities: [warning]
    intake: bus
    response: drain-queue
    # DECLARED: the row's own comment already argues this — a
    # measurement-coverage signal that 'must not page the one operator chat'.
    # The tier field is where that intent finally binds instead of being a
    # comment the delivery path never read.
    tier: tracked-only
  - class: predictor_inference
    # alpha-engine-config-I7740 (operator ruling 2026-08-21): new registry
    # row for a previously-undeclared source. One source string covers
    # multiple observed failure shapes (KeyError 'offenders'/'violations',
    # UnknownAction action='check_market_hours_typo', DRIFT ALERT confidence
    # collapse, stage-coverage assertion — "No module named
    # nousergon_lib.stage_coverage", and a ClientError PutMetricData
    # AccessDenied) — the schema's `severities` enum is closed and
    # `additionalProperties: false` forbids adding a differentiating field,
    # so this is deliberately ONE row at [dynamic] rather than several rows
    # keyed on an invented field the consumers do not read.
    source: "alpha-engine-predictor-inference"
    severities: [dynamic]
    intake: bus
    response: drain-queue
    # derived: severities [dynamic] — resolved per emission
    tier: dynamic
  - class: deploy_notification_predictor
    # config#3305 static-chokepoint registration: predictor deploy scripts
    # that call ``krepis.alerts publish --source <path>/deploy.sh``.
    source: "alpha-engine-predictor/infrastructure/deploy.sh"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent

  # ── research (crucible-research) ──
  # alpha-engine-config-I8177 (crucible-research-PR724). The weekly
  # eval_rolling_mean Lambda hangs four best-effort aggregations off the
  # rolling-mean run (calibration_kappa, control_bands, agent_quality,
  # producer_leaderboard). Their failure must not sink the primary deliverable
  # — but recording it only in a WARN log and an unread return field is how the
  # agent_quality producer stayed broken for two months while eight report-card
  # components read N/A. All four now publish here at ERROR, deduped per
  # producer per ISO week.
  - class: research_eval_rolling_mean_producer_failure
    source: "crucible-research/eval_rolling_mean_handler"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent
  - class: research_score_aggregator_gap
    source: "research:score_aggregator"
    severities: [warning]
    intake: bus
    response: drain-queue
    # derived: warning/info only, automated response declared
    tier: tracked-only
  - class: research_archive_writer_quarantine
    source: "research:archive_writer"
    severities: [error]
    intake: bus
    response: drain-queue
    # derived: error-capable, automated response declared
    tier: notify-silent
  - class: research_daemon_down
    source: "research:alerts_handler"
    severities: [critical]
    intake: bus
    response: drain-queue
    # derived: critical/alarm-capable
    tier: page
  # config#3305 static-chokepoint registration: crucible-research
  # ``publish_observe_alert`` call sites detected during the cross-repo
  # completeness sweep. All are secondary observability (non-fatal, no
  # downstream blocking) — matched via wildcard rows where call sites
  # share a namespace pattern.
  - class: research_runner_observe_alerts
    source: "research-runner:*"
    severities: [warning]
    intake: bus
    response: drain-queue
    # derived: warning/info only, automated response declared
    tier: tracked-only
  - class: research_challenger_producers
    source: "research:challenger_producers"
    severities: [warning]
    intake: bus
    response: drain-queue
