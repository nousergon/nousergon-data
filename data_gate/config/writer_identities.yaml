# Which workload identity each data-collection unit writes under — read by
# `data_gate/unit_readers.py::read_identity` (alpha-engine-config-I10823).
#
# The `identity` base column grades the TARGET identity: plan §6 moves every
# unit onto the standalone `nousergon-data-collection` stack, whose EC2 workload
# runs as `nousergon-data-collection-box-role` (alpha-engine-config-I10756,
# nous-ergon-ops infrastructure/iam/nousergon-data-collection-box-role/). A
# unit whose `trigger.runs_on` has no row here renders UNMET naming this file:
# an undeclared writer identity cannot be shown to be scoped.
#
# Keyed by `trigger.runs_on`, not by unit, because the box role is ONE identity
# shared by every unit on the box — it is graded per unit against that unit's
# declared prefixes, and against an undeclared probe key that no unit writes.
#
# Role names are not secrets (data-gate.yml and data_gate/clauses.py already
# name fleet roles and this account); policy content stays in nous-ergon-ops.
schema_version: data_writer_identities.v1
account_id: "711398986525"
bucket: alpha-engine-research
# A key no unit declares and no grant should cover. PutObject or DeleteObject
# being ALLOWED here is a whole-bucket wildcard.
undeclared_probe_key: data_gate_identity_probe/undeclared-prefix/probe.json
by_runs_on:
  ec2-spot: nousergon-data-collection-box-role
  # D43's manual repair builders: in-region only, "under the component role"
  # (its descriptor; alpha-engine-config-I10756 / I9771) — the same box
  # identity, never the laptop (nousergon-data-PR1746 enforces the region).
  "in-region only (alpha-engine-config-I9771)": nousergon-data-collection-box-role
# Per-unit overrides, read BEFORE `by_runs_on` (alpha-engine-config-I10929).
# `runs_on` is a compute CLASS, not an identity: two `github-hosted` units
# federate into different roles, and two `lambda` units are two functions with
# two execution roles. A unit whose identity is not the class default declares
# it here, and every row below was read off the live deployment on 2026-09-17,
# not inferred from the unit's name.
by_unit:
  # Dashboard-box systemd timers (trigger.owner: "dashboard box"); the box runs
  # under alpha-engine-dashboard-profile -> alpha-engine-dashboard-role.
  D36: alpha-engine-dashboard-role
  D37: alpha-engine-dashboard-role
  # Lambda `alpha-engine-crypto-balances`; its execution role, read from the
  # deployed function configuration.
  D38: alpha-engine-crypto-balances-role
  # GitHub-hosted, but the writer is the OIDC role the workflow assumes
  # (.github/workflows/inst-ownership-weekly.yml `role-to-assume`), not the
  # runner.
  D39: nousergon-data-inst-ownership-sync
  # GitHub-hosted dispatch only: run-arctic-migrations.yml invokes
  # alpha-engine-arctic-migration-dispatcher, which launches the in-region spot
  # box under ARCTIC_MIGRATION_IAM_PROFILE. The box is what writes ArcticDB.
  #
  # alpha-engine-config-I11019: the dispatcher's default now names
  # nousergon-data-collection-box-profile -> nousergon-data-collection-box-role
  # (nousergon-data-PR<THIS>). Declaration follows deployment, not code: this
  # row still names the role the box actually ran under LAST, and stays
  # alpha-engine-executor-role until (1) the operator applies the dispatcher's
  # updated iam-policy.json (`deploy.sh --apply-iam`, IAM is never CI-applied
  # here) AND (2) a subsequent migrations/** push launches a box and that box
  # is observed writing ArcticDB under the new role. Flip this row in that
  # follow-up PR, not here — changing the row without changing what the
  # dispatcher launches (or vice versa) makes the column lie (I11019 itself).
  D42: alpha-engine-executor-role  # PENDING flip to nousergon-data-collection-box-role, see above
