# The data collector's gate ladder — one rung per phase (plan §6).
#
# Rungs are declared here rather than in code so the ladder the console renders
# and the phases the plan names are one list. `gate: null` is never a pass: the
# rung renders UNMEASURED, which the console renders UNREPORTED and counts
# against the transparency gap.
#
# `tracker` is each rung's own alpha-engine-config issue and becomes the row's
# console Decision id — deliberately the same identifier the console's git-host
# adapter mints for that issue, so the two claims merge into one row instead of
# rendering the phase twice (`console-policy` §2.5).
#
# Where `tracker_is_placeholder: true`, a rung would point at the parent KEY issue
# because its own phase issue was not filed yet (plan item P-26; filed 2026-09-14
# as alpha-engine-config-I10792..I10795). That is not a
# quiet default: `data.board.phase_trackers_declared` is UNMET while any rung
# carries it, so the ladder says out loud that part of itself is not tracked.
#
# --- `exit:` IS GRADED, NOT PROSE (alpha-engine-config-I10954) ---------------
#
# Every rung's `exit:` is a LIST of criteria, and each criterion names the
# clause(s) that measure it:
#
#   `clause:`            the clause that exists FOR this criterion — the
#                        operational counter the plan's exit names.
#   `exit_measured_by:`  the clause(s) that already covered this criterion for
#                        another reason. A name or an `fnmatch` pattern over the
#                        clause family (e.g. `data.D*.run_record`), which must
#                        match at least one generated clause.
#
# `tests/test_phase_exit_criteria_are_graded.py` fails on a criterion matched by
# neither, on a name that no generated clause carries, and on a clause the
# rung's own gate does not grade. Until this structure existed the criteria were
# PROSE: the gate rolled up the clause columns, so `data_gate read --gate
# data-phase1` would have reported MET with not one of "5 consecutive EOD
# successes", "10 consecutive trading days" or "sustained over 20 trading days"
# ever measured. `notes:` carries what a rung says about ITSELF rather than about
# the system, and is graded by nothing.

schema_version: data_phases.v2
ladder: data

phases:
  - id: data-phase0
    number: 0
    title: Instrument the board, all red
    gate: data-phase0
    tracker_issue: 10792
    tracker_is_placeholder: false
    notes: >-
      The phase-0 gate measures that the board is HONEST, not that it is green.
      Withholding the ladder or a manifest must render UNREPORTED/UNMEASURABLE
      rather than green — a property of the READER, graded by
      tests/test_data_gate.py rather than by a clause, because no artifact can
      witness the absence of its own reader.
    exit:
      - criterion: the ladder is live, with an as_of under 26 hours
        exit_measured_by: data.gate.ladder_fresh
      - criterion: >-
          414 base clauses exist, one per audit cell, over all 46 units
        exit_measured_by:
          - data.board.population_complete
          - data.board.cells_reconciled
      - criterion: >-
          the first reading reproduces the audit, with every disagreement citing
          its evidence — the transcribed cells still add up to the audit's own
          §5 summary, which is the independent tally a transcription slip moves
        exit_measured_by: data.board.cells_reconciled
      - criterion: >-
          the writer inventory reconciles: every write site resolves to a unit
          descriptor and every descriptor to a write site
        exit_measured_by: data.inventory.writers_declared
      - criterion: every rung of the ladder names its own tracker issue
        exit_measured_by: data.board.phase_trackers_declared

  - id: data-phase1
    number: 1
    title: Standalone stack live, contracts published
    gate: data-phase1
    tracker_issue: 10793
    tracker_is_placeholder: false
    exit:
      - criterion: >-
          survives_phase4 reads 0 red, from live schedule state and a successful
          standalone-stack manifest per unit (plan §6.2 item 7, read after the
          cutover's first trading days)
        exit_measured_by: data.phase1.units_produced
      - criterion: >-
          schema_contract, observability_row, artifact_registry, run_record and
          consumers read 0 red for every non-retired unit
        exit_measured_by:
          - data.D*.schema_contract
          - data.D*.observability_row
          - data.D*.artifact_registry
          - data.D*.run_record
          - data.D*.consumers
      - criterion: 1 complete ne-data-collection-eod cycle, proving the standalone collector ran end to end
        clause: data.phase1.consecutive_eod_cycles
      - criterion: 1 complete ne-data-collection-morning cycle
        clause: data.phase1.consecutive_morning_cycles
      - criterion: 1 complete Saturday of ne-data-collection-weekly with complete manifests
        clause: data.phase1.consecutive_weekly_cycles
      - criterion: v1 Step Functions data-stage executions since the cutover = 0
        clause: data.phase1.v1_data_stage_quiet
    notes: >-
      The EOD/morning/weekly exit criteria above ask for ONE complete cycle, not a streak —
      Brian's ruling, 2026-09-21 (verbatim): "it sounds like the only time gate we should have
      here is for v2 phase 4 deleting the v1 pipelines, so a time gate here makes sense. as
      such we should be able to work up to this point without time gates." Answering the point
      that nothing at this exit is irreversible (the cutover's rollback is one PR revert) while
      Crucible v2 phase 4 deleting the v1 pipelines and Lambdas IS
      (alpha-engine-config-I10655) — so the repeat count moved there. The plan's ORIGINAL
      ratified streak (5 EOD / 5 morning / 2 weekly) is now published as standing reliability
      rows under the `data-collection-reliability` gate (`data_gate/clauses.py::RELIABILITY_GATE`),
      read and rendered every day with the real streak, graded by no data-phase gate — Crucible
      v2 phase 4 gates its irreversible deletion on THAT gate's own artifact, the same shape
      it already uses for `data-cutover-ready`.

      "a 4-week tagged cost baseline measured" is NOT an exit criterion of this rung —
      Brian's ruling, 2026-09-21 (verbatim): "i'm not clear why we need to time gate
      anything, why not just collect the data when it is ready but not block subsequent
      issues". The `component` cost-allocation tag went Active 2026-09-21T14:59Z and the
      CUR export `nous-ergon-fleet-cur` was created 16:50Z, so 28 days of tagged spend
      cannot exist before ~2026-10-20 while every OTHER phase-1 criterion above can clear
      by ~2026-10-04 — as an exit clause this alone would have held phases 1, 2 AND 3 shut
      for ~16 days on a vendor billing-export lag, not a defect. `data.phase1.cost_baseline_measured`
      is now a STANDING clause (`data_gate/clauses.py::StandingClause`) — read and rendered
      every day with its real state, on the board and in `data_gate read`'s output, but
      graded by no gate. Same shape as Brian's 2026-09-13 crucible ruling (`af86cf6`) that
      turned three calendar-floored phase-2 clauses into standing SLO rows.

  - id: data-phase2
    number: 2
    title: Completeness and correctness guards
    gate: data-phase2
    tracker_issue: 10794
    tracker_is_placeholder: false
    exit:
      - criterion: >-
          every applicable guard clause is enforcing AND has been commissioned
          by an induced fault
        exit_measured_by: data.D*.guard.*
      - criterion: >-
          the EOD spine's priced universe == the declared universe minus declared
          exclusions on 10 consecutive trading days
        clause: data.phase2.eod_universe_covered
      - criterion: empty-but-fresh count 0 over 20 cycles
        clause: data.phase2.empty_fresh_free
      - criterion: >-
          vendor divergence emitted on 20 of 20 cycles within bound, or each
          breach named
        clause: data.phase2.vendor_divergence_emitted
      - criterion: the executor profile shows no collection writes over 7 days
        clause: data.phase2.executor_collection_writes_zero

  - id: data-phase3
    number: 3
    title: Board green, SLOs standing
    gate: data-phase3
    tracker_issue: 10795
    tracker_is_placeholder: false
    exit:
      - criterion: >-
          all clauses MET, 0 UNMEASURABLE, 0 UNREPORTED, sustained over 20
          consecutive trading days and 4 Saturdays
        clause: data.phase3.sustained_window
      - criterion: freshness SLO attainment >= 19/20 per family
        exit_measured_by: data.slo.freshness.*
      - criterion: >-
          every published key met its declared completeness floor, per family
        exit_measured_by: data.slo.completeness.*
      - criterion: cost within the ratified ceiling for one full calendar month
        exit_measured_by: data.cost.monthly
      - criterion: pages <= 2 in that month
        exit_measured_by: data.pages.monthly
      - criterion: human mutating calls 0 outside the reserved list
        exit_measured_by: data.human_touch.monthly

# A SUB-gate of phase 1, read before the v2 phase-4 maintenance window (plan
# §6.2). Registered as a gate so it can be READ, but deliberately NOT a rung:
# it is a precondition inside phase 1, and giving it a rung would make the
# ladder claim five phases where the plan declares four.
sub_gates:
  - id: data-cutover-ready
    within: data-phase1
    reads: >-
      stack check-live green; all 37 SF-only units have a standalone workload or
      a recorded retirement decision; roles bootstrapped (iam-drift-check
      clean); pre-cutover parity per published key. `crucible gate --gate
      phase4` gains one clause that reads this gate's own artifact, coupling
      components 1 and 2 through a published artifact rather than through code.
  - id: data-collection-reliability
    within: null
    reads: >-
      `alpha-engine-config-I10793`/`-I10788`, Brian's 2026-09-21 ruling. Not "within" any
      numbered rung — a STANDING gate, published daily alongside the ladder, never a ceiling
      over it. Three clauses, each the real current streak against the plan's ORIGINAL
      ratified target (5 consecutive complete EOD cycles, 5 morning, 2 Saturdays of weekly)
      graded by NO data-phase gate (`data_gate/clauses.py::StandingClause`,
      `RELIABILITY_GATE`). Published as `data_collection/gates/data-collection-reliability/latest.json`
      (current) and `.../{date}/gate.json` (dated history), `gate.v1` schema — the SAME shape
      `data-cutover-ready` already publishes. Crucible v2 phase 4 gates its irreversible
      v1-pipeline deletion (`alpha-engine-config-I10655`) on this gate's own `met` field, the
      same way it already reads `data-cutover-ready`'s artifact for the cutover itself.
