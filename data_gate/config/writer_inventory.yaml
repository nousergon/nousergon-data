# Scope declaration for `data.inventory.writers_declared` (plan §4.1).
#
# The inventory clause is an AST scan of this repository for S3 PUT and ArcticDB
# write call sites, asserting a bijection with the unit descriptors: every write
# site resolves to a descriptor, and every descriptor resolves to a write site.
# **A new collector with no descriptor turns the board red on its own** — which
# is the only mechanism in this design that notices a unit nobody registered.
#
# A scan needs a scope, and a scope is a place to hide. So the scope lives HERE,
# in a reviewable file, with one stated reason per entry, rather than as a
# constant inside the scanner: a filter nobody can see is how the 47th unit stops
# being counted without the count changing.
#
# Two boundaries are drawn deliberately and are the ones to challenge first:
#
#  1. **The data-producer plane, not the ops plane.** `infrastructure/lambdas/`
#     is almost entirely the watch/alert/dispatch plane — it writes ops
#     artifacts, not published data keys, and it is a different component with
#     its own registry rows. Walking it would put ~60 rows of someone else's
#     component on this board. The two producers that DO live there are named
#     individually below, so narrowing the root does not lose them.
#  2. **Library modules fold into their parent** (audit §2, verbatim: "Library
#     modules called only from a parent fold into the parent"). Each one below
#     names the parent unit whose descriptor accounts for its writes, so its
#     call sites are ATTRIBUTED rather than excused.

schema_version: writer_inventory.v1

# Directories walked for write call sites. A producer outside this list is
# invisible to the clause, so adding a producer directory is a deliberate act.
roots:
  - collectors
  - builders
  - features
  - data
  - rag
  - corporate_actions
  - store
  - scripts
  - lambda

# Python attribute names that constitute a write. Kept narrow on purpose: a
# broad verb list produces findings nobody can act on, and an inventory that
# cries wolf is an inventory that gets its scope quietly widened until it is
# silent.
write_calls:
  s3:
    - put_object
    - upload_file
    - upload_fileobj
    - copy_object
  arcticdb:
    - write
    - append
    - update
    - write_batch
    - write_metadata
    - stage
  pandas:
    # The feature store and the staging closes are written as parquet through
    # pandas rather than through a put_object call. Omitting these verbs would
    # make the two most-read published keys in the component invisible to the
    # one clause that counts producers.
    - to_parquet

# Producers that live OUTSIDE the walked roots and are named individually.
extra_paths:
  - path: infrastructure/lambdas/crypto-balances/index.py
    parent_units: [D38]
    reason: The crypto-balances Lambda, the only scheduled data producer in that tree.
  - path: infrastructure/lambdas/arctic-migration-dispatcher/index.py
    parent_units: [D42]
    reason: The ArcticDB migration dispatcher.
  - path: weekly_collector.py
    parent_units: [D17, D19, D33, D34]
    reason: >-
      alpha-engine-config-I10830: the largest single producer in the repo — ~30
      S3 put_object/to_parquet call sites (heal-summary, weekly manifest.json +
      latest_weekly.json pointer, validation.json, health/data_phase{N}.json
      markers, the alternative-scope ledger, the pending-upgrades ledger, the
      price-cache parquet writeback) — sits at the TOP LEVEL of the repo, one
      directory above every walked root, so it was invisible to the forward
      (write-site -> descriptor) direction of this scan even though D17/D19/
      D33/D34 already claim it via `code_path` (their REVERSE direction stayed
      green throughout, via the collectors/daily_closes.py shared-writer entry
      below, which is exactly how the gap read MET for months). This entry adds
      the file to the scan population; no descriptor change was needed.

# Third boundary, added by I10830: the walked roots are the DATA-producer
# directories, but the repo's remaining top-level `*.py` files and `validators/`
# are the ops/QA plane by the same logic as `infrastructure/lambdas/` above —
# scripts that probe or grade a run rather than publish a data key. Verified by
# an AST sweep of every top-level file and `validators/` for the same S3/
# ArcticDB/parquet verbs this scan uses (I10830): the only two genuine write
# call sites found there are named in
# `tests/test_data_gate.py::_KNOWN_OPS_PLANE_WRITE_SITES` (`preflight.py`'s S3
# PUT/DELETE permission sentinel, and `validators/stage_output_sweep.py`'s own
# sweep-verdict artifact) — neither publishes a data key a unit descriptor
# would claim. That test re-derives this from source on every run, so a THIRD
# ops-plane write site, or a genuine new producer dropped anywhere outside
# `roots`/`extra_paths`, turns it red rather than staying invisible.

# Modules that write ON BEHALF OF a parent unit rather than being units
# themselves (audit §2). Each names the parent whose descriptor accounts for its
# writes.
shared_writers:
  - path: collectors/arctic_probe.py
    parent_units: [D18, D32]
    reason: >-
      The in-region ArcticDB probe record (plan P-05, alpha-engine-config-I10772):
      the FINAL workload of the morning (D18) and EOD (D32) collection runs, writing
      data_collection/probes/arctic/{trading_day}.json so the ladder can read
      ArcticDB evidence without opening ArcticDB. It observes those runs' libraries
      rather than producing a published dataset, so its write is attributed to them;
      its own staleness is a ladder clause, not a unit.
  - path: store/arctic_store.py
    parent_units: [D13, D14, D18, D32, D35, D42, D43]
    reason: >-
      The single ArcticDB writer. Every unit that appends to a library goes
      through it, so attributing its call sites to one unit would be wrong and
      attributing them to none would drop them from the denominator.
  - path: store/schema_version.py
    parent_units: [D42]
    reason: Writes the universe_schema_meta library on behalf of the migration runner.
  - path: collectors/daily_closes.py
