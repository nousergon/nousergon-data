# Declared recoveries of ONE missed scheduled fire each — read by
# `data_gate/standalone.py::read_survives_phase4` (alpha-engine-config-I11812).
#
# `survives_phase4` asks two things of a fire: did the schedule's own execution
# start for it (within EXECUTION_START_WINDOW), and did that execution SUCCEED
# with an ok scheduled manifest for the unit inside it. A recovery started by
# hand can never satisfy the second half, by design: a hand run is not proof the
# schedule survives.
#
# An entry here changes the second half for exactly one (schedule, fire) and
# nothing else. For that fire the reader still requires the scheduled execution
# named below to have started inside the 15-minute window (the trigger did its
# job), then requires the declared recovery execution to be SUCCEEDED in live
# state and to have started inside [fire, fire + COMPLETION_GRACE], and grades
# each unit by the cycle counter's rule (`exit_criteria.collect_cycles`): an ok
# scheduled-trigger manifest that started inside [fire, fire + COMPLETION_GRACE].
# Every other fire of every schedule is graded exactly as before.
#
# An entry is INERT until `ruling:` names the ruling that admitted it. `pending`
# keeps the normal grading and says on the row that a recovery is declared but
# not yet ruled. Add-by-PR-only; one entry per fire, never a range.
schema_version: data_recovered_fires.v1
recovered_fires:
