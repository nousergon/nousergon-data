[venvs.crucible]
about = "The crucible harness (pyproject + uv.lock). pyarrow >=26 is held by Dependabot ignore under Brian's ruling #25 (2026-10-14) until alpha-engine-config-I12318 lifts it; the ignore is declared here so it cannot drift from the data venv unseen."
