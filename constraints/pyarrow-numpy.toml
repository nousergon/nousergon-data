numpy_below_2 = false

[[venvs.crucible.surfaces]]
repo = "crucible"
path = "pyproject.toml"
kind = "requirements"

[[venvs.crucible.surfaces]]
repo = "crucible"
path = ".github/dependabot.yml"
kind = "dependabot"
