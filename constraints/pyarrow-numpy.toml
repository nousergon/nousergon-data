[[venvs.dashboard.surfaces]]
path = "infrastructure/lambdas/weekly-freshness-spot-dispatcher/index.py"
kind = "bootstrap"

[[venvs.dashboard.surfaces]]
repo = "crucible-dashboard"
path = "requirements.in"
kind = "requirements"

[[venvs.dashboard.surfaces]]
repo = "crucible-dashboard"
path = "requirements.txt"
kind = "lock"

[[venvs.dashboard.surfaces]]
repo = "crucible-dashboard"
path = "infrastructure/spot_backtest.sh"
