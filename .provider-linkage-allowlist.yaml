# .provider-linkage-allowlist.yaml — pre-cleared provider-linkage matches
# (alpha-engine-config-I9295, spine I9294 — Brian's 2026-08-29 ruling: the
# entire nous ergon system runs through the krepis router). Schema:
# nousergon-lib scripts/provider_linkage_guard.py::load_allowlist. Replaces
# the retired .openrouter-allowlist.yaml (narrower schema, openrouter-only).
schema_version: 1
entries:
  - path: infrastructure/lambdas/expense-collector/iam-policy.json
    pattern: "openrouter:env_key"
    reason: >-
      IAM grant for the SSM parameter backing the expense-collector's
      OpenRouter billing-telemetry read (index.py collect_openrouter) —
      not an LLM call site, no completion is ever requested.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/iam-policy.json
    pattern: "deepseek:env_key"
    reason: >-
      IAM grant for the SSM parameter backing the expense-collector's
      DeepSeek billing-telemetry read (index.py collect_deepseek) — not
      an LLM call site, no completion is ever requested.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/index.py
    pattern: "openrouter:env_key"
    reason: >-
      SSM_OPENROUTER names the SSM parameter path read for the
      expense-collector's OpenRouter account-balance/credits REST read
      (console Expenses page) — billing metadata, not an LLM call, and
      krepis has no billing-telemetry surface to proxy through.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/index.py
    pattern: "deepseek:env_key"
    reason: >-
      SSM_DEEPSEEK names the SSM parameter path read for the
      expense-collector's DeepSeek /user/balance billing read — same
      shape as the OpenRouter entry above.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/index.py
    pattern: "anthropic:base_url"
    reason: >-
      collect_anthropic reads Anthropic's own Admin API cost_report
      endpoint directly for the account's actual monthly spend (console
      Expenses page) — billing metadata, not a completion call, and this
      is the Admin API (org-level cost reporting) which krepis does not
      and should not proxy.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/index.py
    pattern: "openrouter:base_url"
    reason: >-
      collect_openrouter reads OpenRouter's /api/v1/credits billing
      endpoint directly for cost telemetry — same shape as the
      Anthropic Admin API entry above.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/index.py
    pattern: "deepseek:base_url"
    reason: >-
      collect_deepseek reads DeepSeek's /user/balance billing endpoint
      directly for cost telemetry — same shape as the Anthropic Admin
      API entry above.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/test_handler.py
    pattern: "openrouter:base_url"
    reason: >-
      Test fixture mocking the OpenRouter /credits billing endpoint
      exercised by collect_openrouter above.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/expense-collector/test_handler.py
    pattern: "deepseek:base_url"
    reason: >-
      Test fixture mocking the DeepSeek /user/balance billing endpoint
      exercised by collect_deepseek above.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/step_function.json
    pattern: "anthropic:env_key"
    reason: >-
      Literal ANTHROPIC_API_KEY appears only inside a State "Comment"
      documentation string describing the alpha-engine-evaluator-director
      Lambda's SSM secret usage (that Lambda lives in crucible-evaluator,
      not this repo) — prose, not a call site in nousergon-data. Not
      excluded by the doc-extension carve-out because the file is .json.
    expires: "2026-11-27"
    tracking: alpha-engine-config-I9295
  - path: infrastructure/lambdas/eval-judge-spot-dispatcher/test_handler.py
    pattern: "anthropic:base_url"
    reason: >-
      test_never_names_a_model_a_provider_or_a_direct_endpoint asserts the
      spot-box bootstrap command NEVER contains "api.anthropic.com" (nor
      anthropic_api_key, openrouter, claude-, gpt-, litellm_master_key) —
      a regression test for the literal's ABSENCE that enforces the very
      rule this guard enforces. Same negative-assertion shape as the
      tests/test_no_secret_environ_reads.py entry below. Landed in #1593,
      which raced #1587's allowlist and so was not in its finding set.
    expires: "2027-02-27"
    tracking: alpha-engine-config-I9295
  - path: tests/test_no_secret_environ_reads.py
    pattern: "anthropic:env_key"
    reason: >-
      _PINNED_SECRETS asserts ANTHROPIC_API_KEY is NEVER read via
      os.environ.get/getenv anywhere in this repo's tree or its
      first-party dependency packages — a regression test for the
      literal's ABSENCE, not a use of it.
    expires: "2027-02-27"
    tracking: alpha-engine-config-I9295
  - path: requirements.txt
    pattern: "openai:dist"
    reason: >-
      `krepis[openai]` is the ROUTER'S OWN EXTRA, not a provider call site.
      krepis IS the router (Brian's 2026-08-29 ruling, alpha-engine-config-I9294
      / -I9295); the extra installs the `openai` SDK for krepis's own use so it
      can speak the OpenAI WIRE FORMAT to the router endpoint. No call site in
      this repo addresses OpenAI, and the router package's own extras cannot by
      construction be a bypass of the router.
      It is load-bearing rather than incidental: `crucible` pins the same extra
      under alpha-engine-config-I10473, where omitting it meant no v2 box could
      make a call in the openai wire format at all (`ModuleNotFoundError: No
      module named 'openai'`, measured 2026-09-10 on i-0fcd1c9649a27aa62).
      INTERIM. Nothing in this repo changed: the guard workflow was bumped
      nousergon-lib@c115e758 -> @855687d6 by Dependabot #1782 on 2026-09-17 and
      the stricter guard began matching a pin that has been at
      requirements.txt:208 for months, holding `main` red from b804b940 onward.
      The real fix is in the guard — a dist spec for the router package itself,
      with any extras, must not match — tracked at alpha-engine-config-I11017.
      DELETE THIS ENTRY when that lands; its `closes-when` is this repo green
      with no entry for krepis[openai].
    expires: "2026-10-17"
    tracking: alpha-engine-config-I11017
