# Standard fleet Dependabot config (weekly, grouped minor+patch) — alpha-engine-config-I2525
# Majors are surfaced as ONE grouped PR per ecosystem, throttled by a 30-day
# major-version cooldown — alpha-engine-config-I2734. NOTE: Dependabot requires a
# unique (package-ecosystem, directory, target-branch) per update config, so the
# I2734 intent CANNOT be a second per-ecosystem block on its own monthly schedule
# (that shape is invalid and disables ALL updates for the repo). The `majors`
# group + `cooldown.semver-major-days: 30` below is the closest legal expression.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
    # Deferred to the tracked migration alpha-engine-config-I5213. Dependabot re-proposing
    # this every week is pure queue noise while the migration is unscheduled, and
    # it re-enters /backlog-triage each cycle. Narrow by dependency-name ON
    # PURPOSE: a blanket "*" major ignore would also suppress future
    # security-relevant majors. REMOVING THIS ENTRY IS PART OF alpha-engine-config-I5213's closes-when.
    #
    # pandas 3 is held by a version RANGE, not by update-types. The
    # update-types semver-major form this entry carried since #1088 did not
    # stop #2257 (pandas >=2.0 -> >=3.1.0): requirements.txt has a bare lower
    # bound and no lockfile, so Dependabot has no current version to classify
    # the bump against. And pandas 3 cannot install here at all: requirements.txt
    # pins arcticdb>=6.28.1, and arcticdb 6.28.1 (latest, 2026-10-20) requires
    # pandas<3, as has every release since 6.8.0 (verified on PyPI 2026-10-23).
    # Re-examine when an arcticdb release lifts that cap, and no later than
    # 2026-12-01.
    ignore:
      - dependency-name: "pandas"
        versions: [">=3"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major

  # NOTE: no cooldown here — Dependabot rejects cooldown.semver-major-days for
  # the github-actions ecosystem (semver cooldown keys are per-ecosystem; pip
  # supports them, actions does not — validated live 2026-07-16). The majors
  # group alone carries the I2734 grouping intent for actions.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      majors:
        update-types:
          - major
