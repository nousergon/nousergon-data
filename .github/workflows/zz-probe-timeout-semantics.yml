name: zz probe timeout semantics (temporary, alpha-engine-config C23)
# Throwaway probe: measures what `cancelled()` / `failure()` return in a job
# whose need was killed at its own timeout-minutes. Deleted in the next commit.
on:
  push:
    branches: [c23-notify-on-timeout]
    paths: [.github/workflows/zz-probe-timeout-semantics.yml]
permissions: {}
jobs:
  slow:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: sleep 150
  report:
    needs: [slow]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "needs.slow.result=${{ needs.slow.result }}"
          echo "cancelled()=${{ cancelled() }}"
          echo "failure()=${{ failure() }}"
          echo "success()=${{ success() }}"
  cond-not-cancelled:
    needs: [slow]
    if: ${{ always() && (failure() || (contains(needs.*.result, 'cancelled') && !cancelled())) }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "the !cancelled() arm RAN"
  cond-cancelled:
    needs: [slow]
    if: ${{ cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "cancelled() arm RAN"
