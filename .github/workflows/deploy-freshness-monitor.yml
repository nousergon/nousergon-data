name: Deploy freshness-monitor

# Auto-deploy the alpha-engine-freshness-monitor Lambda CODE on merge to main.
#
# Why this exists: the freshness-monitor was previously operator-deployed only
# (its function ARN was deliberately omitted from the github-actions-lambda-
# deploy role's enumerated grant). The 2026-06-26 open_orders active-window fix
# shipped to the registry + lib but couldn't go live without a manual deploy.sh
# — so a registry/lib fix sat inert. This closes that gap: any change under
# infrastructure/lambdas/freshness-monitor/** redeploys the Lambda code.
#
# Separation of concerns: this deploys CODE only (deploy.sh --code-only). The
# artifact REGISTRY is owned by alpha-engine-config and pushed to S3 by its own
# sync-artifact-registry.yml on registry merges — so this job needs no
# ae-config clone and never touches the registry.
#
# IAM: the github-actions-lambda-deploy role's LambdaUpdate grant was collapsed
# from an enumerated function list to arn:...:function:alpha-engine-* (which now
# covers this function and freed ~4.6KB under the 10,240-char inline-policy
# ceiling). Apply via nous-ergon-ops/infrastructure/iam/apply.sh at merge.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/freshness-monitor/**'
      - 'infrastructure/overseer/playbooks.yaml'
      - 'infrastructure/overseer/trigger_descriptions.py'
      - 'infrastructure/overseer/trigger_surface_drift.py'
      - '.github/workflows/deploy-freshness-monitor.yml'
  workflow_dispatch:

concurrency:
  group: deploy-freshness-monitor-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy freshness-monitor Lambda (code-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy freshness-monitor (code-only)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/freshness-monitor/deploy.sh --code-only

      # alpha-engine-config-I9045. The linkage between a playbook and the AWS
      # resources that wake it existed only as prose in playbooks.yaml. These
      # two steps put it on the resources themselves and then assert it landed
      # — the assertion is the half that matters: a description applied once by
      # hand drifts the first time a wake leg is added, and is checked by
      # nothing. Needs no new IAM: scheduler:{Create,Update}Schedule,
      # events:PutRule and the matching reads are already on
      # github-actions-lambda-deploy.
      - name: Install the reconciler's one dependency
        run: pip install --upgrade pyyaml

      - name: Reconcile trigger descriptions from playbooks.yaml
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/freshness-monitor/deploy.sh --reconcile-triggers

      - name: Assert the live trigger surface matches playbooks.yaml
        working-directory: alpha-engine-data
        run: python3 infrastructure/overseer/trigger_surface_drift.py --source-file infrastructure/lambdas/freshness-monitor/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-freshness-monitor \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-freshness-monitor.yml

  # Alert (Telegram) on genuine post-merge failure on the default branch.
  # Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
