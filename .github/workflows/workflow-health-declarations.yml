name: workflow-health-declarations

# alpha-engine-config-I13916 (also alpha-engine-config-I13881): the shared
# finding-surface guard. A workflow that declares WORKFLOW_HEALTH_FINDING_STEPS
# names its finding steps by string; renaming a step without updating the
# declaration silently turns a detector's intended red into an unexplained one
# (or mutes it). The validator lives in nousergon-lib (`workflow_health_semantics`,
# console entry `workflow-health-semantics`, first shipped in v0.124.224) and
# reads only this repo's own workflow files.
#
# It lives in its OWN workflow file, not in ci.yml, for the same reason
# cost-gate.yml does: its nousergon-lib pin is deliberately ahead of
# requirements.txt (the entry point does not exist before v0.124.224, and
# bumping the repo-wide pin would change the weekly-run dependency set). A
# differing pin inside ci.yml would have forced ci.yml out of the lockstep
# sweep in tests/test_lib_pin_lockstep.py; a separate file lets ci.yml stay
# held to the root pin. The pin here is governed by an explicit contract
# (floor + lag bound + re-exam date) in that test.
#
# Runs unconditionally on every PR, push to main and merge-group entry: no
# paths filter, no `if:`, no continue-on-error, no secrets. Installed WITHOUT
# extras: the validator needs only pyyaml and the standard library.
# Pinned by tests/test_workflow_health_declarations_are_guarded.py.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  workflow-health-declarations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.12"
      - name: Install the shared workflow-health validator (pinned nousergon-lib)
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet "nousergon-lib @ git+https://github.com/nousergon/nousergon-lib@v0.124.224"
      - name: Validate workflow finding-surface declarations
        run: workflow-health-semantics --workflow-dir .github/workflows
