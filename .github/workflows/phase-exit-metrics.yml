name: Data-collection phase-exit metrics

# Schedules the phase-exit metric producers nothing schedules today
# (alpha-engine-config-I11058; producers landed CLI-only in
# nousergon-data-PR1797 / alpha-engine-config-I11035, -I11036).
#
# `data_gate.producers.v1_data_stage` and `.executor_profile` are
# `python -m` entry points with argparse mains. Until this workflow, nothing
# in the fleet ever invoked them: the S3 keys `data.phase1.v1_data_stage_quiet`
# and `data.phase2.executor_collection_writes_zero` read were never written,
# and both clauses report UNMEASURABLE forever (`alpha-engine-config-I11035`,
# `-I11036`).
#
# ── `cost_monthly` is a THIRD job here, not a separate workflow ─────────
#
# `alpha-engine-config-I10788` added `data_gate.producers.cost_monthly`
# (the 4-week tagged-cost baseline `data.phase1.cost_baseline_measured`
# reads). It runs as a job in THIS workflow — not a new `cost-monthly-
# metrics.yml` — so it reuses this role's trust policy exactly as pinned
# (`job_workflow_ref` already covers `phase-exit-metrics.yml`), avoiding a
# SECOND operator-gated `update-assume-role-policy` on top of the one
# `alpha-engine-config-I11061` already needed. The `WriteOnlyItsOwnMetric
# AndRunRecordPrefixes`-style inline-policy grant this job needs is
# additive and auto-applies on merge (`nous-ergon-ops-PR<N>`, same
# session) — no operator step for `cost_monthly` at all.
#
# It carries its own `timeout-minutes` and no `needs:` on the other two
# jobs — independent, per `alpha-engine-config-I11261` (the
# `executor_profile` job already hit its 15-minute cap once; a slow
# neighbour must not gate or be gated by this one).
#
# ── `trigger_observation` is a FOURTH job, for the same reason ─────────
#
# `alpha-engine-config-I11189` deliverable 2 added
# `data_gate.producers.trigger_observation`: it reads each unit descriptor's
# LIVE trigger (states:ListExecutions / events:DescribeRule /
# scheduler:GetSchedule — read-only) and publishes what it saw for
# `data.phase1.triggers_reconciled` to reconcile against the declared
# `trigger.schedule`. A job here, not a new workflow, so the role's trust
# policy (`job_workflow_ref` pins THIS file) needs no operator-gated edit; its
# additive inline grants auto-apply on merge in `nous-ergon-ops`. Until they
# do, this job fails loud on AccessDenied at its first read — the clause it
# feeds reads UNMEASURABLE meanwhile, never MET.
#
# ── `slo` and `pages_monthly` are the FIFTH and SIXTH jobs ────────────────
#
# `alpha-engine-config-I10789` (plan P-22): `data_gate.producers.slo`
# (nousergon-data-PR2055) writes the sixteen
# `data_collection/metrics/slo/{freshness,completeness}/<family>/latest.json`
# documents the `data.slo.*` clauses read, and `data_gate.producers.
# pages_monthly` (nousergon-data-PR2104) writes `data_collection/metrics/
# pages/monthly/latest.json` for `data.pages.monthly`. Both landed CLI-only;
# until these jobs nothing invoked them, so all 17 documents were absent
# (measured 2026-10-31). Jobs here, not a new workflow, for the reason the
# jobs above give: the role's trust policy pins THIS file. Their grants
# (`nous-ergon-ops-PR1970`: reads on `data_collection/runs/*` and
# `changelog/{entries,quarantine}/*`, writes on their own metric and run-
# record prefixes only) must be applied BEFORE this lands, or both jobs
# fail on AccessDenied and page through notify-main-failure every day.
# Independent jobs, no `needs:` between them (`alpha-engine-config-I11261`).
#
# ── Cadence: mirrors the collector's own daily cadence ─────────────────────
#
# `data-gate.yml` (this repo) evaluates the whole ladder at `30 23 * * *`
# (daily) and additionally `0 18 * * 6` (Saturday). These two producers run
# at `0 22 * * *` — 90 minutes before the daily ladder read, same cadence
# (daily, every day including Saturday) as the rest of the collector's
# metric documents, so the clauses' freshness has defined meaning: a reading
# more than a day old is late, not merely absent.
#
# A SEPARATE workflow from `data-gate.yml` and `data-report.yml` for the
# same reason `data-report.yml`'s own header gives: a workflow carries ONE
# schedule set, and a scheduled workflow needs its own absence detector
# (`notify-main-failure`) rather than a shared one another job's failure
# could mask.
#
# ── The absence of data must never render green ─────────────────────────
#
# Each producer's `main()` (data_gate/producers/_run_record.py) writes a
# run record to `data_collection/runs/<producer>/{date}.json` on BOTH the
# success and the failure path — so a day this schedule silently never
# fired (no record at all) is distinguishable from a day it fired and had
# nothing to report (a record with status=ok and a zero count). The GHA
# job also goes red on the failure path (no swallow: `main()` re-raises
# after recording), which is what `notify-main-failure` below pages on.
#
# ── IAM: a NEW role, not yet applied ────────────────────────────────────
#
# `github-actions-data-collection-phase-exit-metrics` needs:
#   states:ListExecutions, states:GetExecutionHistory on
#     arn:aws:states:us-east-1:<account>:stateMachine:ne-weekly-freshness-pipeline
#   s3:ListBucket, s3:GetObject on nousergon-fleet-cloudtrail-archive
#     (prefix AWSLogs/<account>/CloudTrail/*)
#   s3:PutObject on alpha-engine-research
#     data_collection/metrics/{v1_data_stage,executor_profile}/* and
#     data_collection/runs/{v1_data_stage,executor_profile}/*
# Codified in `nous-ergon-ops` (out of this repo's tier — IAM is private),
# tracked as `alpha-engine-config-I11061` (filed alongside this PR). Until
# that stack is applied this job fails loud on the identity read-back below
# naming the exact operator command — the same operator-gated-apply shape
# `data-report.yml` already uses for `github-actions-data-report`
# (`pull-request-policy.md` §4.2 form 3: the merge emits the exact command
# AND a detector stays red until it runs).

on:
  schedule:
    - cron: '0 22 * * *'
  # `drill_only` (alpha-engine-config-I10795): a manual run of ONLY the
  # freshness-monitor commissioning drill. Without it a dispatch re-runs all
  # seven producers just to write the drill's receipts, which is why the
  # drill's receipts otherwise wait for its first due day. Off by default,
  # and absent on a `schedule` event (`inputs.drill_only` is null there, so
  # `!inputs.drill_only` is true and every job runs exactly as before). It
  # changes WHEN the drill can run, never what it checks or what the reader
  # accepts: the receipts are the same induced -> fired -> cleared records.
  workflow_dispatch:
    inputs:
      drill_only:
        description: 'Run only the freshness-monitor commissioning drill (skip the other producers)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: phase-exit-metrics
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PHASE_EXIT_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-data-collection-phase-exit-metrics

jobs:
  v1_data_stage:
    name: v1_data_stage phase-exit metric
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}. The role does not exist yet until the nous-ergon-ops stack granting it (alpha-engine-config-I11061) has been applied. That apply is OPERATOR-GATED as a security boundary, not automated — see the issue for the exact command. This job staying red until then is the detector, per pull-request-policy 4.2 form 3."; exit 1 ;; esac

      - name: Run v1_data_stage producer
        run: python -m data_gate.producers.v1_data_stage

  executor_profile:
    name: executor_profile phase-exit metric
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}. The role does not exist yet until the nous-ergon-ops stack granting it (alpha-engine-config-I11061) has been applied. That apply is OPERATOR-GATED as a security boundary, not automated — see the issue for the exact command. This job staying red until then is the detector, per pull-request-policy 4.2 form 3."; exit 1 ;; esac

      - name: Run executor_profile producer
        run: python -m data_gate.producers.executor_profile

  cloudtrail_evidence:
    name: bounded CloudTrail evidence
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}. The role does not exist yet until the nous-ergon-ops stack granting it (alpha-engine-config-I11061) has been applied. That apply is OPERATOR-GATED as a security boundary, not automated — see the issue for the exact command. This job staying red until then is the detector, per pull-request-policy 4.2 form 3."; exit 1 ;; esac

      # Lower bound: verified apply run 36471214957 completed at 19:18:11Z.
      - name: Export bounded CloudTrail evidence
        timeout-minutes: 3
        run: python -m data_gate.producers.cloudtrail_evidence --trail fleet-cloudtrail --since 2026-09-28T19:18:11Z

  cost_monthly:
    name: cost_monthly metric (4-week baseline)
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      # `alpha-engine-config-I11272`: no CUR/Data Export exists in the
      # account yet, and provisioning one is operator-gated. Until the
      # operator runs it AND sets these two repository variables, this
      # job must not page daily for a by-design pending state — but it
      # must also never render a metric document, or a $0/absent state
      # would read as measured. Skip LOUDLY (a visible ::notice, a green
      # job) rather than fail, and rather than pass silently with no
      # output at all.
      - name: CUR export provisioned?
        id: cur_provisioned
        run: |
          if [ -z "${{ vars.CUR_EXPORT_BUCKET }}" ] || [ -z "${{ vars.CUR_EXPORT_NAME }}" ]; then
            echo "::notice::cost_monthly SKIPPED — CUR/Data Export not yet provisioned (alpha-engine-config-I11272): CUR_EXPORT_BUCKET/CUR_EXPORT_NAME repository variables are unset. No metric document is written this run — that is deliberate, not a pass: writing one now would render a false \$0/absent baseline instead of an honest not-yet-measured state."
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}."; exit 1 ;; esac

      - name: Run cost_monthly producer
        if: steps.cur_provisioned.outputs.provisioned == 'true'
        run: >
          python -m data_gate.producers.cost_monthly
          --days 28
          --cur-bucket "${{ vars.CUR_EXPORT_BUCKET }}"
          --cur-export-name "${{ vars.CUR_EXPORT_NAME }}"

  trigger_observation:
    name: trigger_observation metric (declared vs live triggers)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}."; exit 1 ;; esac

      - name: Run trigger_observation producer
        if: ${{ !inputs.drill_only }}
        run: python -m data_gate.producers.trigger_observation

      # alpha-engine-config-I10795 (ruling 2026-10-14): the monthly
      # freshness-monitor threshold-tightening drill. A STEP on this daily
      # job, not a new workflow or job, so it costs no runner minutes on the
      # days it does not run (fleet GHA cap): `--only-if-due` returns before
      # any AWS call except on the month's first NYSE trading day, judged by
      # the date the cron fire was SCHEDULED for (a fire started hours late,
      # past 00:00Z, still counts as its own day). A manual
      # `workflow_dispatch` runs it unconditionally; with `drill_only` it is
      # the only producer that runs. `!cancelled()` so a
      # failed trigger_observation read above cannot skip the month's drill.
      # It reads the published registry and the drilled rows' S3 metadata,
      # writes only data_collection/commissioning/<unit>/freshness-monitor/
      # latest.json and its run record, and exits 1 (paging through
      # notify-main-failure) when any unit's drill is inconclusive.
      - name: Monthly freshness-monitor commissioning drill
        if: ${{ !cancelled() }}
        run: python -m data_gate.producers.freshness_commissioning ${{ github.event_name == 'schedule' && '--only-if-due' || '' }}

  slo:
    name: slo metric (freshness and completeness SLO per family)
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}."; exit 1 ;; esac

      - name: Run slo producer
        run: python -m data_gate.producers.slo

  pages_monthly:
    name: pages_monthly metric (monthly page count)
    if: ${{ !inputs.drill_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}."; exit 1 ;; esac

      - name: Run pages_monthly producer
        run: python -m data_gate.producers.pages_monthly

  # Required of every scheduled workflow in this repo by
  # tests/test_scheduled_workflow_reachability.py, by job NAME, with `needs:`
  # naming every other job and an `if` gated to the default branch.
  notify-main-failure:
    needs: [v1_data_stage, executor_profile, cloudtrail_evidence, cost_monthly, trigger_observation, slo, pages_monthly]
    if: ${{ always() && github.ref == 'refs/heads/main' && (failure() || (contains(needs.*.result, 'cancelled') && !cancelled())) }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
