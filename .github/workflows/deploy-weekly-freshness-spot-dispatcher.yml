name: Deploy weekly-freshness-spot-dispatcher

# Auto-deploy the alpha-engine-weekly-freshness-spot-dispatcher Lambda CODE on
# merge to main. Mirrors deploy-data-spot-dispatcher.yml — same gap, same fix:
# a merged code change to the dispatcher must not sit inert until someone
# remembers to run deploy.sh by hand (the exact failure mode that broke the
# 2026-07-08 EOD run, where the invoking SF def auto-deployed but the Lambda
# did not exist — config#2248's dispatcher inherits the same ordering risk
# since step_function.json ALSO auto-deploys on merge).
#
# Separation of concerns: this deploys CODE only (deploy.sh with NO flag —
# the flagless run is code-only; --bootstrap is what ADDS the IAM-role
# creation, and stays operator-only: the github-actions-lambda-deploy OIDC
# role deliberately has no iam:CreateRole / iam:PutRolePolicy — see
# nous-ergon-ops/infrastructure/iam/README.md).
#
# IAM: no new grant needed — LambdaUpdate already covers
# arn:...:function:alpha-engine-* (nous-ergon-ops/infrastructure/iam/github-actions-lambda-
# deploy.json), which already includes this function.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/weekly-freshness-spot-dispatcher/**'
      - '.github/workflows/deploy-weekly-freshness-spot-dispatcher.yml'
  workflow_dispatch:

concurrency:
  group: deploy-weekly-freshness-spot-dispatcher-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy weekly-freshness-spot-dispatcher Lambda (code-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy weekly-freshness-spot-dispatcher (code-only — no --bootstrap)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/weekly-freshness-spot-dispatcher/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-weekly-freshness-spot-dispatcher \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-weekly-freshness-spot-dispatcher.yml

  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@8c40481c0e80790bda54b30af63b4a341bebcccb # main
    secrets: inherit
