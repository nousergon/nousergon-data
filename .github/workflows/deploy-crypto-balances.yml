name: Deploy crypto-balances

# Auto-deploy the alpha-engine-crypto-balances Lambda (D38) on merge to main
# (alpha-engine-config-I11812, R2 (a): re-enable at a daily cadence).
#
# THIS WORKFLOW DID NOT EXIST before that change, which is why the live
# function still ran code from 2026-06-29 — older than the run-manifest work
# (alpha-engine-config-I10810), so even an enabled schedule would have written
# no D38 run record. A Lambda with no deploy workflow is a Lambda whose repo is
# not its source of truth (the deploy-alert-drain-liveness-probe.yml reasoning).
#
# Code + schedule, no IAM: the flagless deploy.sh updates the function code
# (LambdaUpdate covers arn:...:function:alpha-engine-*) and then re-asserts the
# `alpha-engine-crypto-balances-15min` schedule's expression and its state from
# infrastructure/automation_pause.json (deploy.sh step 3b: scheduler:UpdateSchedule
# plus iam:PassRole on alpha-engine-* to scheduler.amazonaws.com, both already
# held by github-actions-lambda-deploy). The armed state of a trigger is owned by
# the repo and re-asserted by the merge. Role and schedule CREATION stay
# `deploy.sh --bootstrap`, an operator step that was run on 2026-06-29.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/crypto-balances/**'
      - 'collectors/crypto_balances.py'
      - 'run_units.py'
      - 'dates.py'
      - 'infrastructure/automation_pause.json'
      - '.github/workflows/deploy-crypto-balances.yml'
  workflow_dispatch:

concurrency:
  group: deploy-crypto-balances-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy crypto-balances Lambda (code + schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy crypto-balances (code + schedule — no --bootstrap)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/crypto-balances/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          # Tolerate a not-yet-bootstrapped function: deploy.sh gracefully skips
          # the code update until an operator runs --bootstrap (the OIDC role
          # can't create the Lambda), so this report must NOT hard-fail the job
          # when the function does not exist yet — matching the deploy step's
          # own guard (alpha-engine-config-I2831 first-merge red-main fix).
          aws lambda get-function \
            --function-name alpha-engine-crypto-balances \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text \
            || echo "(function not bootstrapped yet — code deploy was skipped)"

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-crypto-balances.yml

  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
