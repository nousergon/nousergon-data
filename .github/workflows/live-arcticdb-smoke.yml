name: Live ArcticDB Smoke

# Catches ArcticDB schema-drift regressions that the mocked unit-test
# suite cannot see. Modeled on morning-signal's live-api-smoke pattern
# shipped 2026-05-26 for the same class of bug.
#
# Triggers ONLY on PRs touching files that affect the ArcticDB read/
# write surface or the canonical universe-library schema.
#
# Cost: one tail-row S3 read per triggered run (~$0.0001).
#
# Auth gate: assumes github-actions-arcticdb-smoke-read, an OIDC role
# whose entire grant is s3:GetObject on alpha-engine-research/arcticdb/*
# plus the prefix-scoped s3:ListBucket ArcticDB needs to resolve a
# symbol version. Forks without the OIDC trust get a clean skip rather
# than a failing CI status — the script exits 0 when no AWS creds are
# in the env.
#
# It used to assume github-actions-lambda-deploy, and that was the only
# reason the fleet's widest CI identity — ECR push, UpdateFunctionCode,
# CloudFormation stack update, iam:PassRole, ssm:SendCommand onto the
# dashboard box — trusted a `pull_request` sub at all. Every other entry
# in that role's trust is `ref:refs/heads/main`; this one was assumable
# from a branch nobody had reviewed. alpha-engine-config-I10110 (stage 2
# of I10109, ruling I9788 option b) split it out.

on:
  pull_request:
    branches: [main]
    paths:
      - "store/arctic_store.py"
      - "builders/daily_append.py"
      - "builders/backfill.py"
      - "builders/_price_cache_writeboth.py"
      - "tests/live_smoke/arcticdb_smoke.py"
      - ".github/workflows/live-arcticdb-smoke.yml"

permissions:
  id-token: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials (OIDC)
        # Fork PRs without the configured OIDC trust will fail this step
        # silently (continue-on-error) so downstream skip-on-no-creds
        # logic in arcticdb_smoke.py takes the clean-skip path.
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-arcticdb-smoke-read
          aws-region: us-east-1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch live-ArcticDB smoke
        run: python tests/live_smoke/arcticdb_smoke.py
