name: Rehearsal Path Guard

# Structural enforcement of weekly-sf-policy.md §7 (alpha-engine-config-I6688):
# a PR touching a weekly-SF-critical path must carry, in its body, one of
# §7's accepted forms — a `Rehearsal-path:` trailer naming a real §7.1
# mechanism or an existing test, a §7.3 exemption (`structural` /
# `complexity:ultra`), or a `Rehearsal-risk-acceptance:` paragraph (§7.2
# route 3). "Needs a live Saturday" alone is not a legitimate gate.
#
# Measured 2026-08-09 (I6688): `git grep "Rehearsal-path"` returned ZERO
# hits across nousergon-data/alpha-engine-config/nousergon-lib at
# origin/main — the requirement was never enforced, and hardening changes
# sat as drafts 2-4 weeks on "needs a live Saturday" while every Saturday
# ran on the un-hardened path (§7, 2026-07-25 incident).
#
# Two-job shape mirrors canary-replay.yml: `label` runs dorny/paths-filter
# to decide whether this PR touches a weekly-critical path at all (a PR
# that doesn't is unconstrained by §7 and the check passes trivially);
# `rehearsal-path-guard` runs only when it does, and calls the body-parsing logic in
# scripts/check_rehearsal_path.py (kept in a script, not inline bash, so
# tests/test_check_rehearsal_path.py can exercise every branch directly).
#
# `edited` is in the trigger types deliberately: the trailer lives in the
# PR BODY, and a body is commonly fixed up (trailer added) after the PR is
# already open — `opened`-only would make that fix invisible to the check
# until some unrelated push.
#
# The PR body is passed to the checker via the `PR_BODY` env var, never
# spliced into a `run:` shell block — `github.event.pull_request.body` is
# attacker-controlled text on `pull_request` (same rationale as
# canary-replay.yml's PR_DATA_REF/PR_SHA handling).
#
# Path list MUST stay in lockstep with scripts/check_rehearsal_path.py's
# WEEKLY_CRITICAL_GLOBS and with the weekly-critical subset of
# canary-replay.yml's own filter — pinned by
# tests/test_rehearsal_path_guard_lockstep.py.
#
# `token: ''` + explicit `base:` (alpha-engine-config-I6909): dorny/paths-filter
# defaults to the GitHub REST API on `pull_request` events, which intermittently
# failed with a TLS "self-signed certificate" error on GitHub-hosted runners (4
# of 15 runs in a 2h window, 2026-08-11, three unrelated branches — a runner/
# network flake, not caused by any PR's content). An empty token switches the
# action to local `git diff` against the supplied base SHA instead, which needs
# no outbound API call at all and so cannot hit this failure class.

# merge_group (alpha-engine-config-I11310): `rehearsal-path-guard` is a
# REQUIRED context, so it must also report on a queue entry before a merge
# queue can be enabled here (auto-merge-policy §7). A merge_group payload has
# no `pull_request` object, so on that event: the `filter` step is skipped
# and `mg_filter` diffs the entry's own `merge_group.base_sha`..`head_sha`
# through check_rehearsal_path.weekly_critical_paths_touched (the same glob
# list, pinned in lockstep with `filter`); and the guard reads the PR BODY
# live by the PR number parsed from `merge_group.head_ref`. Both fail CLOSED:
# an unreadable diff counts as weekly-critical, an unparseable head_ref or an
# unreadable body fails the check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      weekly_critical: ${{ steps.filter.outputs.weekly_critical || steps.mg_filter.outputs.weekly_critical }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            weekly_critical:
              - 'infrastructure/step_function*.json'
              - 'infrastructure/spot_*.sh'
              - 'infrastructure/run_weekly_offcycle.sh'
              - 'scripts/weekly_sf_rerun.py'
              - 'infrastructure/lambdas/weekly-freshness-spot-dispatcher/**'
              - 'infrastructure/lambdas/eval-judge-spot-dispatcher/**'
              - 'infrastructure/lambdas/weekly-preflight/**'
              - 'infrastructure/lambdas/substrate-health-gate/**'
              - 'infrastructure/lambdas/weekly-run-scope/**'
              - 'infrastructure/lambdas/collection-readiness-probe/**'
              - 'data_gate/run_manifest_predicate.py'

      - name: Weekly-critical paths in this merge-group entry
        id: mg_filter
        if: github.event_name == 'merge_group'
        env:
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -uo pipefail
          if git fetch --quiet --depth=1 origin "$MG_BASE_SHA" \
             && changed=$(git diff --name-only "$MG_BASE_SHA" "$MG_HEAD_SHA"); then
            hits=$(printf '%s\n' "$changed" | python3 -c 'import sys; sys.path.insert(0, "scripts"); from check_rehearsal_path import weekly_critical_paths_touched as w; print("\n".join(w([l for l in sys.stdin.read().splitlines() if l])))') || hits="(matcher failed)"
          else
            hits="(diff unreadable)"
          fi
          if [ -n "$hits" ]; then
            printf 'weekly-critical in this entry:\n%s\n' "$hits"
            echo "weekly_critical=true" >> "$GITHUB_OUTPUT"
          else
            echo "No weekly-critical paths in this merge-group entry."
            echo "weekly_critical=false" >> "$GITHUB_OUTPUT"
          fi

  rehearsal-path-guard:
    needs: label
    if: needs.label.outputs.weekly_critical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Check Rehearsal-path trailer / exemption (weekly-sf-policy §7)
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MG_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "merge_group" ]; then
            pr=$(printf '%s' "$MG_HEAD_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/.+/pr-([0-9]+)-[0-9a-f]+$#\1#p')
            if [ -z "$pr" ]; then
              echo "::error::Could not extract a PR number from merge_group.head_ref ('$MG_HEAD_REF'). Failing closed: the PR body cannot be read."
              exit 1
            fi
            PR_BODY=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.body // ""')
            export PR_BODY
            echo "merge_group entry for PR #${pr}: body read live."
          fi
          python3 scripts/check_rehearsal_path.py "$GITHUB_WORKSPACE"
