name: CI

permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

jobs:
  # config#2949: nousergon-data-PR936 shipped a `set -u` unbound-variable bug
  # (MAX_RUNTIME_EXPLICIT read outside every assignment path) with fully
  # green CI — the repo's shell-script guards are grep-based wiring tests;
  # nothing else here statically analyzes bash. shellcheck (SC2154 et al.)
  # catches genuine unbound/typo'd/quoting bugs, though NOT every instance of
  # this exact incident's shape (a variable assigned only inside one `case`
  # arm of an arg-parse loop, then read unconditionally afterward — shellcheck's
  # dataflow analysis is whole-scope, not branch-path-sensitive, so it doesn't
  # flag that specific pattern; verified locally against the pre-fix PR936
  # revision, which shellcheck --severity=error and even the optional
  # check-unassigned-uppercase check both pass clean on). That branch-path gap
  # is closed instead by tests/test_shell_arg_parse_default_init.py (config#2949).
  # error-severity only, so a warning-noise cleanup never gates unrelated PRs;
  # ubuntu-latest ships shellcheck preinstalled, no third-party action needed.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      # Scope is DERIVED from git, not a literal glob list
      # (alpha-engine-config-I9117). It used to be `infrastructure/*.sh` — the
      # TOP-LEVEL directory only — so the 45 `infrastructure/lambdas/*/deploy.sh`
      # and the `_shared/*.sh` helpers they source were analysed by NOTHING.
      # Those are exactly the files that carried the week-long four-red-deploys
      # outage (alpha-engine-config-I9045), and widening found four real
      # error-severity defects: three deploy.sh had an automated `source` line
      # prepended ABOVE their shebang, making the shebang inert (SC2148), and
      # `_shared/run_handler_tests.sh` had an em-dash where a shellcheck
      # directive's trailing prose needs its own `#` (SC1125).
      #
      # WHY DERIVED rather than the three globs that would have sufficed today:
      # a hand-written scope leaves the next script uncovered on the day it
      # lands, in a directory nobody remembered to add — which is the precise
      # shape of the gap being closed here. `git ls-files` cannot go stale.
      # Measured 2026-08-28: 79 tracked *.sh, clean at --severity=error.
      # error-severity only, so a warning-noise cleanup never gates unrelated PRs.
      - name: shellcheck (every tracked *.sh, error severity)
        shell: bash
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=error

  # config#4223: the 2026-07-25 weekly-SF kill was a krepis CLI contract
  # change deployed between SF phases — every ssm_log_capture caller in the
  # pipeline started hard-failing mid-execution, and restoring the invocation
  # shape took 4 re-run attempts. The module now auto-generates a correlation
  # id (absence no longer hard-fails), but a MALFORMED invocation is still a
  # hard argparse error that would re-kill the same pipeline. This job lints
  # every ssm_log_capture invocation in the step_function*.json definitions
  # against the krepis CLI contract at definition-edit time, before deploy.
  ssm-log-capture-contract-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Validate ssm_log_capture invocations in SF definitions
        run: python3 validators/ssm_log_capture_contract.py

  # config#2878: S3 returns 403 AccessDenied instead of 404 NoSuchKey for
  # GetObject on a nonexistent key when the caller lacks s3:ListBucket. Every
  # lambda iam-policy.json that grants GetObject must also grant a matching
  # prefix-scoped ListBucket statement so absent-key detection works correctly
  # (fail-loud-on-403 hardening pattern). A file with a first-line comment
  # "# skip-if-absent-key-impossible" exempts roles whose code only reads keys
  # guaranteed to exist.
  iam-getobject-listbucket-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Check all iam-policy.json for GetObject-without-ListBucket
        run: python3 infrastructure/lambdas/_shared/check_iam_getobject_listbucket.py

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      # config-I11309: 8,540+ tests in one process cost 12-13m of a 17-27m
      # cycle, and strict-up-to-date restarts every open PR's cycle on every
      # merge. `--dist loadfile` keeps each test FILE on one worker (module-
      # level state — fixtures, monkeypatched globals, tmp paths reused
      # across a file's tests — stays single-threaded per file), so this is
      # not the same hazard as `--dist load`'s free-for-all scheduling.
      # pytest-cov combines each worker's coverage data natively; verified
      # locally 3x that the combined TOTAL matches a serial run within
      # 0.1pt. `-ra` keeps failure/skip summaries; `-v`'s 8,540 interleaved
      # per-test lines added noise with parallel workers reordering output.
      - name: Run tests
        run: pytest tests/ -n auto --dist loadfile -ra --cov=. --cov-report=term-missing

      # Changelog mirror Lambdas live outside tests/ (pytest testpaths) and each
      # stubs boto3 in sys.modules, so they can't share a pytest process. Run
      # each in its own interpreter. Guards the deterministic SNS classifier
      # (classify.py) against a mislabeling regression.
      - name: Run changelog lambda tests
        run: |
          python3 infrastructure/lambdas/_shared/test_vocab.py
          python3 infrastructure/lambdas/_shared/test_classify.py
          python3 infrastructure/lambdas/changelog-incident-mirror/test_handler.py
          python3 infrastructure/lambdas/changelog-cloudwatch-mirror/test_handler.py

      # Repo-wide _shared/ guards that are not per-lambda test_handler.py files,
      # so the glob step above never picks them up. Bare unittest, no
      # pytest/boto3 needed. alpha-engine-config#3189: pins that every
      # box-launching dispatcher has terminate-on-failure coverage.
      - name: Run shared lambda guard tests
        run: |
          python3 infrastructure/lambdas/_shared/test_terminate_coverage.py

      # config#1759: the two suites above were the ONLY lambda handler tests
      # that ran pre-merge — every other infrastructure/lambdas/*/test_handler.py
      # (groom-liveness-probe, freshness-monitor, scheduled-groom-dispatcher,
      # etc.) executed for the first time inside each deploy-*.yml's deploy.sh
      # pytest gate, which fires on push to main — POST-merge. A green PR check
      # could still ship a broken handler and red main first (exactly what
      # happened to nousergon-data#630 / freshness-monitor, healed by #631).
      #
      # Fix: discover every handler suite by GLOB (not hand-list), so a new
      # lambda is covered automatically. Each suite runs in its own interpreter
      # with ONLY that lambda's own requirements.txt installed (the same file
      # deploy.sh's preflight pytest gate already uses as its deps source of
      # truth — see e.g. freshness-monitor/deploy.sh step 1b), into an isolated
      # --target dir so one lambda's deps can't leak into / collide with
      # another's stubbed-boto3-in-sys.modules test process. The changelog pair
      # above is intentionally excluded here (zero deps, already covered).
      - name: Run ALL lambda handler tests (glob-derived, per-lambda deps)
        # config#2381: this pre-merge glob and every post-merge deploy.sh gate
        # now delegate to the SAME _shared/run_handler_tests.sh, so the two can
        # never re-drift into the naive no-install form (config#2295). ci passes
        # `-r requirements.txt` (the config#1759 superset-source-of-truth model);
        # deploy scripts pass a minimal explicit dep set — both share the helper's
        # provision-then-run mechanism.
        env:
          # ssm-liveness-poller/index.py (and any future handler) calls
          # boto3.client(...) at MODULE SCOPE with no explicit region. Lambdas
          # with a deploy-*.yml get a region for free from that workflow's
          # configure-aws-credentials step (aws-region: us-east-1); lambdas
          # with none (like ssm-liveness-poller — never gated anywhere before
          # this PR) hit botocore's NoRegionError on a bare `ubuntu-latest`
          # runner with zero AWS env. No real AWS calls are made (clients are
          # mocked/monkeypatched in-test) — this only satisfies SDK client
          # construction. Matches the region used fleet-wide (REGION default
          # in every lambda's deploy.sh).
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set -uo pipefail
          shopt -s nullglob
          source infrastructure/lambdas/_shared/run_handler_tests.sh
          fail=0
          for t in infrastructure/lambdas/*/test_handler.py; do
            d="$(dirname "$t")"
            case "$d" in
              */changelog-incident-mirror|*/changelog-cloudwatch-mirror)
                continue ;;
            esac
            echo "::group::$t"
            if [ -f "$d/requirements.txt" ]; then
              run_handler_tests "$d" -r "$d/requirements.txt" || fail=1
            else
              run_handler_tests "$d" || fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail

      - name: Security audit
        run: |
          pip install pip-audit
          IGNORE_ARGS=()
          if [ -f .github/pip-audit-ignore.txt ]; then
            while IFS= read -r vuln_id; do
              IGNORE_ARGS+=(--ignore-vuln "$vuln_id")
            done < <(grep -vE '^\s*#|^\s*$' .github/pip-audit-ignore.txt)
          fi
          pip-audit "${IGNORE_ARGS[@]}"

  # Alert (Telegram) ONLY on genuine post-merge breakage of the default
  # branch. PR-branch reds (mid-fix commits, cross-repo lib-tag merge-order
  # races) stay silent. Reusable workflow + transport in nousergon-lib.
  # See alpha-engine-config#1128.
  notify-main-failure:
    needs: [test]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3 # main
    secrets: inherit

  # Rejects any dependency extra written with an underscore. pip <23.3 does not
  # normalise `_` to `-` in a REQUESTED extra while setuptools always normalises
  # the DECLARED one, so `pkg[flow_doctor]` matches nothing against
  # `Provides-Extra: flow-doctor` — and pip reports that as a WARNING on a
  # SUCCESSFUL exit. Measured 2026-08-12: pip 23.2.1 resolves 18 packages with
  # flow-doctor absent, 23.3.2/24.0/25.0 resolve 30 with it present. Amazon
  # Linux 2023 ships pip 23.2.1, which is how it reached production
  # (alpha-engine-config-I6963).
  #
  # This is a STATIC check on purpose. Every resolve job in this fleet upgrades
  # pip before resolving, so CI runs on a pip that normalises correctly and can
  # never reproduce the production resolver. A green resolve is not evidence.
  lint-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Lint dependency extras (no underscores)
        run: python3 scripts/lint_extras.py .
