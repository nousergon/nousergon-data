name: Data-collection gate (read-only)

# alpha-engine-config-I10748 deliverable P-04
# (private-docs/data_collection_plan_260914.md §4.1 "The gate command", §8.3).
# Second read added under alpha-engine-config-I10832/I10808, PR1716's own
# follow-up: PR1716 (nousergon-data#1716) shipped the `data-cutover-ready`
# sub-gate in `data_gate/read.py::GATES` but this workflow only ever invoked
# `data-phase0` — the sub-gate had a clause list and a registered name and no
# scheduled reader.
#
# WHAT THIS IS. Runs `python -m data_gate read --gate <name> --store
# s3://alpha-engine-research/data_collection` TWICE per job — once for
# `data-phase0`, once for `data-cutover-ready` — each of which conforms to
# `schemas/phase_ladder.v1.json` and writes:
#   - data_collection/gates/ladder.json          — current reading (rewritten
#     every run; the console reads THIS key — see nous-ergon-ops
#     data-collection-phase-ladder.yaml / data-collection-board.yaml)
#   - data_collection/gates/board/latest.json     — current per-clause board
#     (rewritten every run; see BOTH READS, ONE BOARD below)
#   - data_collection/gates/<gate>/{date}/gate.json — dated, never
#     overwritten (that gate's own history).
#
# BOTH READS, ONE BOARD. `data_gate.read.run()` evaluates every registered
# gate (`GATES`, currently data-phase0/data-cutover-ready/data-phase1/2/3) on
# every invocation regardless of the `--gate` argument, and builds the ladder
# and the board (`gates/board/latest.json`) from that same all-clauses list —
# the `--gate` argument only selects which single `GateResult` is returned
# for THIS invocation's exit code and its own dated history key. So the two
# reads below write byte-for-byte equivalent `ladder.json` / `board/
# latest.json` documents (module `data_gate/read.py::run` — verified by
# reading it, not assumed): same clauses, same states, same evidence: only
# `generated_utc` can differ by the few seconds between the two `python -m
# data_gate` invocations. The second write does not clobber the first's
# board with a NARROWER one — there is no narrower board to clobber, because
# neither read ever wrote a cutover-ready-only or phase0-only board. Running
# both is still correct and not redundant ceremony: each read is the only
# way to get THAT gate's own exit code (phase0 met does not imply
# cutover-ready met, or the reverse) and THAT gate's own dated history file
# under `gates/<gate>/{date}/gate.json`.
#
# `data_gate` (the clause generator + reader) and the unit descriptors under
# `registry.d/units/*.yaml` are sibling deliverables (I10748 P-01/P-02) —
# this workflow is built alongside them and will fail on
# `ModuleNotFoundError` until that module lands on `main`. That is expected
# sequencing, not a defect in this file: this workflow is a consumer of a
# contract another PR provides (see this PR's body for the merge order).
#
# THREE RULES CARRIED VERBATIM FROM THE PLAN (§4.1), for EACH read:
#   1. A gate READS; it never runs. This workflow launches no collection —
#      its role (`github-actions-data-gate-read`, nous-ergon-ops) holds no
#      write capability outside `data_collection/gates/*` and no Step
#      Functions/Scheduler/Lambda invoke authority at all.
#   2. A clause is MET, UNMET or UNMEASURABLE, and UNMEASURABLE is never MET.
#   3. The gate's job succeeds when the MEASUREMENT succeeds, whatever the
#      verdict. The verdict already has a durable surface — this same run's
#      own writes to `gates/ladder.json` / `gates/board/latest.json` /
#      `gates/<gate>/{date}/gate.json` — and a page path,
#      `data.ladder_fresh`'s 26h staleness ceiling. A run that never
#      completes the measurement (checkout, OIDC, install, an exception
#      inside `data_gate`) is the only thing this job's own conclusion
#      needs to report — see CORRECTED alpha-engine-config-I10906 below.
#
#      CORRECTED alpha-engine-config-I10906 (2026-09-16): this workflow used
#      to make the job's own conclusion carry the gate VERDICT — `python -m
#      data_gate read` exited 1 on any UNMET reading and a "Fail the job on
#      a non-MET reading" step turned that into the job's conclusion, on the
#      theory that a red run here is the board telling the truth (rule 3,
#      as it read before this correction). That collided with fleet
#      workflow health: `scheduled-workflow-health.yml` grades this
#      workflow `failing` on every run for as long as phase 0 stays
#      red-by-design (weeks), files a re-filing issue that can never close
#      (`alpha-engine-config-I10884`), and — worse — makes a GENUINE reader
#      break (auth, import, a bad write) indistinguishable from the
#      expected finding in the run list. `data_gate/__main__.py`'s own
#      exit-code contract already separates "the gate says no" (1) from "we
#      could not ask" (2); this workflow now relies on that separation
#      instead of re-deriving it. `python -m data_gate read` is invoked here
#      WITHOUT `--fail-on-unmet`, so it exits 0 on any successful
#      measurement (MET or UNMET) and only exits non-zero (2) when the
#      measurement itself failed — which is exactly what should fail this
#      job. See `--fail-on-unmet` below for the human-invoked exception.
#
#      This also retires the `WORKFLOW_HEALTH_SEMANTICS: finding-surface`
#      declaration this workflow used to carry (alpha-engine-config-I9169):
#      it existed only to tell `scheduled-workflow-health.yml` not to page
#      on an intentional non-MET failure. There is no longer an intentional
#      non-MET failure to declare — a failed run here is now always a real
#      break, so this workflow is graded exactly like any other scheduled
#      job, with no special-casing to maintain.
#
# `--fail-on-unmet`, OPT-IN, NEVER ON THE SCHEDULED PATH. A human who wants
# the process exit code to carry the verdict — a manual `workflow_dispatch`
# check, or a future PR-time invocation — passes `fail_on_unmet: true` on
# dispatch (below), which appends `--fail-on-unmet` to both reads and
# restores the old "exits 1 on UNMET" behavior for that one invocation. The
# two cron triggers and the push trigger never set it. A test in this repo
# (`tests/test_data_gate_workflow_exit_code.py`) parses this file and fails
# if `--fail-on-unmet` is ever hard-coded into a `schedule`- or `push`-
# reachable step, so the coupling this issue fixed cannot come back
# silently.
#
# CADENCE. Daily 23:30 UTC — after the EOD spine's 18:15 ET / ~22:15-23:15
# UTC deadline (plan §2 row 1) so the daily reading reflects a completed
# cycle — plus Saturday 18:00 UTC for the weekly family's Sat 13:00 ET
# deadline, on push to the clause/descriptor sources so a topology change is
# re-read immediately, and on-demand.
#
# WHICH GATES. `data-phase0` (phase 0 is what this repo is building toward,
# per the plan's phase table) and `data-cutover-ready` (PR1716's sub-gate of
# phase 1, `registry.d/phases.yaml`'s `sub_gates` — graded independently of
# the phase0/1/2/3 ceiling ladder). The phase0 gate name advances to
# `data-phase1`/`2`/`3` as later PRs land phase content; this workflow's two
# `--gate` arguments are the single source those PRs update here, not
# duplicated per trigger.

on:
  schedule:
    - cron: '30 23 * * *'
    - cron: '0 18 * * 6'
  push:
    branches: [main]
    paths:
      - 'data_gate/**'
      - 'registry.d/**'
      - '.github/workflows/data-gate.yml'
  workflow_dispatch:
    inputs:
      fail_on_unmet:
        description: >-
          Exit 1 (fail this run) on an UNMET gate, instead of the scheduled
          default of exiting 0 on any successful measurement. For a human
          who wants the process exit code to carry the verdict. Never set
          this on the cron/push triggers — see the I10906 correction above.
        type: boolean
        default: false

concurrency:
  group: data-gate-read-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  # Repository VARIABLES, not literals: this repo is public and its run logs
  # are public (alpha-engine-config-I10973). GitHub masks SECRETS, not
  # repository variables — the `::add-mask::` step below is what keeps the
  # account id out of the printed ARN.
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  GATE_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-data-gate-read
  STORE_URI: ${{ vars.DATA_STORE_URI }}

jobs:
  read-gate:
    name: data-gate-read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # alpha-engine-config-I10823: the `consumers` column resolves each declared
    # reader path on its repository's default branch through the GitHub
    # contents API, with this run's own short-lived token (`contents: read`
    # reads any public repository; no PAT). A dedicated variable name so a
    # hermetic test run never picks one up by accident.
    env:
      DATA_GATE_GITHUB_TOKEN: ${{ github.token }}
      # Empty string on schedule/push (the input does not exist on those
      # triggers); `true`/`false` on workflow_dispatch. Only the literal
      # string `true` appends the flag below.
      FAIL_ON_UNMET_FLAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.fail_on_unmet == true) && '--fail-on-unmet' || '' }}
    steps:
      # Every configuration input this job cannot run without, checked in one
      # place with the exact command that fixes each. Without it an unset
      # AWS_ACCOUNT_ID produces `arn:aws:iam:::role/...` and an opaque
      # `AssumeRoleWithWebIdentity` failure (alpha-engine-config-I10973).
      - name: Repository variables are set
        run: |
          missing=0
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; missing=1; fi
          if [ -z "$STORE_URI" ]; then echo "::error::repository variable DATA_STORE_URI is not set - set it with: gh variable set DATA_STORE_URI --repo nousergon/nousergon-data --body '<s3-uri-of-the-data-collection-store>'"; missing=1; fi
          exit "$missing"

      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # This repository is public and its run logs are public; GitHub masks
      # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.GATE_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      # No `continue-on-error` here on purpose (removed under I10906): the
      # job's own conclusion should now BE the reader's own success/failure,
      # nothing more layered on top. Without `--fail-on-unmet` (the
      # scheduled/push case — $FAIL_ON_UNMET_FLAG is empty), `python -m
      # data_gate read` exits 0 on MET or UNMET and only exits non-zero (2)
      # when the measurement itself failed, so this step — and therefore
      # this job — fails only on a genuine reader break.
      - name: Read the data-phase0 gate
        id: gate_read
        run: |
          python -m data_gate read --gate data-phase0 \
            --store "$STORE_URI" \
            $FAIL_ON_UNMET_FLAG

      # Second invocation, same contract, `data-cutover-ready`'s own exit
      # code. See "BOTH READS, ONE BOARD" at the top of this file for why
      # running it a second time writes an equivalent, not a conflicting,
      # `ladder.json`/`board/latest.json`.
      - name: Read the data-cutover-ready gate
        id: gate_read_cutover
        run: |
          python -m data_gate read --gate data-cutover-ready \
            --store "$STORE_URI" \
            $FAIL_ON_UNMET_FLAG

  # ── FAILURE ALERTING ─────────────────────────────────────────────────────
  # Simplified under I10906: with the verdict no longer coupled to the job's
  # exit code, `failure()` on this job now means exactly one thing — the
  # measurement itself did not complete (checkout, OIDC, install, or a
  # `data_gate` exit-2) — so there is no exit-code arithmetic left to do
  # here. Immediate paging to Fleet CI Watch on a `main`-branch failure;
  # `scheduled-workflow-health.yml`'s periodic grading is the backstop for a
  # trigger this doesn't cover (e.g. a `workflow_dispatch` failure).
  notify-main-failure:
    needs: [read-gate]
    if: failure() && github.ref == 'refs/heads/main'
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
