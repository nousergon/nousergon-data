name: Deploy preflight-sweep-dispatcher

# Auto-deploy the alpha-engine-preflight-sweep-dispatcher Lambda CODE on
# merge to main. Mirrors deploy-canary-replay-dispatcher.yml — same gap,
# same fix: a merged code fix must not sit inert until someone remembers to
# run deploy.sh by hand.
#
# Separation of concerns: this deploys CODE only (deploy.sh's flagless run IS
# code-only; --bootstrap — role creation, function creation, the
# events.amazonaws.com invoke permission — stays operator-only). The
# github-actions-lambda-deploy OIDC role deliberately has no iam:CreateRole /
# iam:PutRolePolicy (fleet-wide policy; see nous-ergon-ops/infrastructure/iam/README.md) —
# IAM/profile changes still require an operator `deploy.sh --bootstrap` /
# `--apply-iam`.
#
# NOTE (see infrastructure/lambdas/preflight-sweep-dispatcher/deploy.sh
# header): unlike every sibling dispatcher, this Lambda's EventBridge
# schedule is NOT created by deploy.sh at all — it is CloudFormation-owned
# (PreflightSweepDailyTrigger in infrastructure/cloudformation/
# alpha-engine-orchestration.yaml) and restamped on every merge by
# deploy-infrastructure.yml. This workflow deploys the Lambda CODE only; it
# does not touch the schedule.
#
# IAM: no new grant needed — LambdaUpdate already covers
# arn:...:function:alpha-engine-* (nous-ergon-ops/infrastructure/iam/github-actions-lambda-
# deploy.json), which includes this function.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/preflight-sweep-dispatcher/**'
      - '.github/workflows/deploy-preflight-sweep-dispatcher.yml'
  workflow_dispatch:

concurrency:
  group: deploy-preflight-sweep-dispatcher-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy preflight-sweep-dispatcher Lambda (code-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy preflight-sweep-dispatcher (code-only — no --bootstrap)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/preflight-sweep-dispatcher/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-preflight-sweep-dispatcher \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-preflight-sweep-dispatcher.yml

  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
