name: Data-collection monthly cost metric

# Schedules `data_gate.producers.cost_monthly` (alpha-engine-config-I10788):
# the phase-1 exit clause `data.phase1.cost_baseline_measured` and the
# phase-3 objective `data.cost.monthly` both read `metrics/cost/monthly/
# latest.json`, and nothing writes that key today.
#
# ── A SEPARATE workflow from phase-exit-metrics.yml ─────────────────────
#
# `phase-exit-metrics.yml`'s own header gives the reason: one schedule set
# per workflow, and a scheduled workflow needs its own absence detector a
# sibling job's failure could otherwise mask.
#
# ── Never Cost Explorer — the CUR export, and nothing else ──────────────
#
# `ce:GetCostAndUsage` bills $0.01/request; a retry loop against it billed
# $441.67 in four days (measured 2026-09-09). This producer reads the AWS
# Cost and Usage Report / Data Export from S3 — a free GET on an
# already-computed artifact, however often this schedule runs.
#
# ── THE CUR EXPORT DOES NOT EXIST YET (as of 2026-09-21) ─────────────────
#
# `aws cur describe-report-definitions` and `aws bcm-data-exports list-
# exports` both return empty in this account. Provisioning one needs an S3
# bucket plus `bcm-data-exports:CreateExport`, both classified as shared-
# resource mutations an agent session cannot perform (probed and refused by
# the local harness guardrail — see alpha-engine-config-I10788's follow-up
# issue for the exact commands). Until an operator runs them and sets the
# `CUR_EXPORT_BUCKET` / `CUR_EXPORT_NAME` repository variables below, this
# job fails loud on the producer's own explicit RuntimeError, by design —
# the failure IS the detector (pull-request-policy.md §4.2 form 3 shape),
# never silenced with continue-on-error.
#
# ── Tag key/value: an assumption, not a ruling ───────────────────────────
#
# `component=data-collection` follows the binding plan's literal text
# (data_collection_plan_260914.md §2 objective 8). alpha-engine-config-
# I10905 (gate:decision, OPEN as of 2026-09-21) asks whether `component` or
# `system` should be the fleet's ONE cost-attribution key; this workflow
# does not resolve it. `--tag-key`/`--tag-value` are the one-flag change if
# I10905 rules otherwise.
#
# ── IAM: reuses github-actions-data-collection-phase-exit-metrics ───────
#
# One added inline-policy statement (nous-ergon-ops infrastructure/iam/
# github-actions-data-collection-phase-exit-metrics/phase-exit-metrics.json)
# grants read on the CUR export prefix and write on this producer's own
# metric/run-record prefixes — applied on merge by nous-ergon-ops's
# iam-apply-on-merge.yml, since this is an inline-policy edit to an EXISTING
# live role, not a new role or a trust-policy change. No operator step.

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: cost-monthly-metrics
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PHASE_EXIT_ROLE_ARN: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-data-collection-phase-exit-metrics

jobs:
  cost_monthly:
    name: cost_monthly metric (4-week baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write   # OIDC only; no long-lived AWS keys in this repository
    steps:
      - name: Repository variables are set
        run: |
          if [ -z "$AWS_ACCOUNT_ID" ]; then echo "::error::repository variable AWS_ACCOUNT_ID is not set - set it with: gh variable set AWS_ACCOUNT_ID --repo nousergon/nousergon-data --body '<12-digit-account-id>'"; exit 1; fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ env.PHASE_EXIT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r requirements.txt

      - name: Confirm the identity this job actually assumed
        run: |
          assumed="$(aws sts get-caller-identity --query Arn --output text)"
          expected="${PHASE_EXIT_ROLE_ARN##*/}"
          case "${assumed}" in *":assumed-role/${expected}/"*) echo "identity: ${assumed}" ;; *) echo "::error::this job assumed ${assumed}, not ${expected}."; exit 1 ;; esac

      - name: Run cost_monthly producer
        run: >
          python -m data_gate.producers.cost_monthly
          --days 28
          --cur-bucket "${{ vars.CUR_EXPORT_BUCKET }}"
          --cur-export-name "${{ vars.CUR_EXPORT_NAME }}"

  # Required of every scheduled workflow in this repo by
  # tests/test_scheduled_workflow_reachability.py, by job NAME, with `needs:`
  # naming every other job and an `if` gated to the default branch.
  notify-main-failure:
    needs: [cost_monthly]
    if: failure() && github.ref == 'refs/heads/main'
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
