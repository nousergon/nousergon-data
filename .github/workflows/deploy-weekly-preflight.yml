name: Deploy weekly-preflight

# Auto-deploy the alpha-engine-weekly-preflight Lambda on merge to main.
#
# Why this exists: every other SF-invoked Lambda in this repo has its own
# deploy-*.yml (freshness-monitor, data-spot-dispatcher, etc.) so a change
# under the lambda's directory actually goes live. Without one, the
# WeeklyPreflight gate (I4494) would be codified in the Saturday SF but
# operator-deployed only — the config#1464 codified-but-not-live drift class
# (deploy-infrastructure.yml deploys the SF, not the lambdas).
#
# Separation of concerns: this deploys the function CODE (deploy.sh default
# path = update-function-code + publish-version + 'live' alias). First-time
# creation is `deploy.sh --bootstrap --apply-iam`, which needs IAM role
# creation (nous-ergon-ops owns IAM now — see the deploy.sh notes); that
# bootstrap is the operator step that must happen before the SF change merges
# (the sf-arn-drift-check Lambda-existence guard requires the function live).
#
# IAM: the github-actions-lambda-deploy role's LambdaUpdate grant covers
# arn:aws:lambda:...:function:alpha-engine-* (including PublishVersion,
# CreateAlias, UpdateAlias) so this job needs no policy change.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/weekly-preflight/**'
      - 'sf_preflight.py'
      - '.github/workflows/deploy-weekly-preflight.yml'
  workflow_dispatch:

concurrency:
  group: deploy-weekly-preflight-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy weekly-preflight Lambda
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy weekly-preflight
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/weekly-preflight/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-alias \
            --function-name alpha-engine-weekly-preflight \
            --name live \
            --query 'FunctionVersion' \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-weekly-preflight.yml

  # Alert (Telegram) on genuine post-merge failure on the default branch.
  # Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
