name: Merge-group required-check guard

# Validates that every required status check has a workflow with
# merge_group: {types: [checks_requested]} in its on: block.
# Without this, the merge queue permanently deadlocks — the required
# context never reports on merge_group events.
#
# REQUIREABLE (alpha-engine-config-I11310): auto-merge-policy §7 says no
# repo gets a merge queue before this guard is a REQUIRED check, as it is on
# alpha-engine-config (context `guard / merge-group required-check guard`).
# A required context must report on EVERY pull_request and on every
# merge_group entry, so the `pull_request` trigger is unfiltered (a `paths:`
# filter would leave non-workflow PRs blocked on a context that never posts)
# and `merge_group` is declared. Making it required is a ruleset change for
# an admin; until then it stays advisory.
#
# Logic lives in the fleet chokepoint:
#   nousergon-lib merge-group-required-check-guard.yml
# Rollout: config-I3682.

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  guard:
    uses: nousergon/nousergon-lib/.github/workflows/merge-group-required-check-guard.yml@da7cd5f45eebbe94bd2524a5fa17a3db917ed961 # main
