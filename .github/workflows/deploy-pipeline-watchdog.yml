name: Deploy pipeline-watchdog

# Auto-deploy the alpha-engine-pipeline-watchdog Lambda CODE on merge to main.
#
# Why this exists (alpha-engine-config#5606): nousergon-data#1148 fixed a
# DISARMED watchdog — its Saturday check counted executions on
# ne-weekly-freshness-pipeline with no pipeline_role filter, so the ~5 daily
# exercise runs (alpha-engine-config#5489) satisfied its 7-day window
# unconditionally and it could never alert again. That fix merged and did NOT
# go live: this Lambda had no deploy workflow, `deploy.yml` covers only the
# Phase-2 image paths, and its own deploy.sh header says "operator-deployed
# only". A merged fix to a detector that never reaches production leaves the
# detector broken while the tracker says it is fixed — the exact shape
# deploy-freshness-monitor.yml was created to close on 2026-06-26 ("a
# registry/lib fix sat inert").
#
# Mirrors deploy-freshness-monitor.yml deliberately rather than inventing a
# second shape. Code only: deploy.sh with no flags is its update-code path.
# --bootstrap (SNS topic, EventBridge rule, IAM) stays operator-run, so this
# workflow cannot create or rewire infrastructure — only ship code to a
# function that already exists.
#
# IAM: no change needed. github-actions-lambda-deploy's LambdaUpdate statement
# already grants GetFunction / GetFunctionConfiguration / UpdateFunctionCode /
# UpdateFunctionConfiguration on arn:aws:lambda:us-east-1:711398986525:
# function:alpha-engine-*, which covers alpha-engine-pipeline-watchdog. Those
# four are every AWS call the no-flag deploy.sh path makes (verified against
# nous-ergon-ops/infrastructure/iam/github-actions-lambda-deploy/ on
# 2026-07-29).

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/pipeline-watchdog/**'
      - '.github/workflows/deploy-pipeline-watchdog.yml'
      # deploy.sh packages this file flat into the zip and index.py imports
      # its slot derivation (config#6738). Without it here, a fix to the
      # deadman's classification logic would merge and never reach the
      # Lambda — the "merged fix that never went live" shape this whole
      # workflow was created to close, one level down.
      - 'scripts/weekly_sf_silence_deadman.py'
  workflow_dispatch:

concurrency:
  group: deploy-pipeline-watchdog-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy pipeline-watchdog Lambda (code-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data
          # 2 commits so the IAM-parity step below can diff this merge against
          # its parent. Nothing else here needs history.
          fetch-depth: 2

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy pipeline-watchdog (code-only)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/pipeline-watchdog/deploy.sh

      # The merge emits the exact operator command whenever it ships code whose
      # IAM this workflow is NOT allowed to apply (config#6738,
      # pull-request-policy §4.2 form 3). github-actions-lambda-deploy has no
      # iam:PutRolePolicy by design — the single-writer rule adopted after 4
      # IAM-clobber incidents (nous-ergon-ops/infrastructure/iam/README.md) —
      # so a changed iam-policy.json ships as CODE ONLY and the grant lags.
      # Deliberately does not fail the job: the code deploy really did succeed,
      # and a one-shot red is not a standing detector. The two standing
      # detectors are check-drift.py (every PR + daily 09:35 UTC) and the
      # Lambda's own daily DEGRADED page, which names this same command.
      - name: Emit operator IAM-apply command if iam-policy.json changed
        if: always()
        working-directory: alpha-engine-data
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD -- infrastructure/lambdas/pipeline-watchdog/iam-policy.json || true)
          if [ -z "${CHANGED}" ]; then echo "iam-policy.json unchanged in this merge — no operator step."; exit 0; fi
          CMD="AWS_PROFILE=ne-admin bash infrastructure/lambdas/pipeline-watchdog/deploy.sh --apply-iam"
          echo "::warning title=Operator IAM apply required::${CMD}"
          { echo "### Operator step required"; echo ""; echo "\`infrastructure/lambdas/pipeline-watchdog/iam-policy.json\` changed in this merge, and this workflow's OIDC role cannot apply IAM (single-writer rule). Run from a checkout of \`nousergon-data\`:"; echo ""; echo '```'; echo "${CMD}"; echo '```'; echo ""; echo "Until it runs: \`nous-ergon-ops/infrastructure/iam/check-drift.py --lambdas-root ../nousergon-data/infrastructure/lambdas\` stays red (daily 09:35 UTC), and the weekly-silence deadman pages \`DEGRADED: cannot read /alpha-engine/weekly-sf/exercise-cadence\` on every firing."; } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-pipeline-watchdog \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-pipeline-watchdog.yml

  # Alert (Telegram) on genuine post-merge failure on the default branch.
  # Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
