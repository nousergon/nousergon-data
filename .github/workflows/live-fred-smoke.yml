name: Live FRED Smoke

# Catches FRED REST API payload-shape regressions that the mocked
# unit-test suite cannot see. Modeled on morning-signal's live-api-smoke
# pattern shipped 2026-05-26 for the same class of bug.
#
# Triggers on pushes to main (and by hand) touching files that affect the FRED payload
# shape or the consumers that parse its response.
#
# Cost: one observations call (free tier) per triggered run.
#
# Key: read from SSM at runtime (`/alpha-engine/FRED_API_KEY`) under
# `github-actions-vendor-key-read`, whose trust admits only this workflow on
# main. All secrets live in SSM (Brian, 2026-10-05). Until then this workflow
# read a `FRED_API_KEY` repo secret that never existed, so every run skipped and
# still showed green (alpha-engine-config-I12023). It runs after merge rather
# than on the PR because a role holding a live key must not be assumable from
# an unreviewed branch; a failure is red main CI. The key step fails loud when
# the parameter is unreadable, so a skip can no longer pass for a check.

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
    paths:
      - "collectors/fred_history.py"
      - "collectors/daily_closes.py"
      - "tests/live_smoke/fred_smoke.py"
      - ".github/workflows/live-fred-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # This repository is public and its run logs are public; GitHub masks
      # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-vendor-key-read
          aws-region: us-east-1

      - name: Read the FRED key from SSM (masked)
        run: |
          value="$(aws ssm get-parameter --name /alpha-engine/FRED_API_KEY --with-decryption --query Parameter.Value --output text)"
          if [ -z "$value" ] || [ "$value" = "None" ]; then
            echo "::error::/alpha-engine/FRED_API_KEY is empty or unreadable"
            exit 1
          fi
          echo "::add-mask::$value"
          echo "FRED_API_KEY=$value" >> "$GITHUB_ENV"

      - name: Dispatch live-FRED smoke
        run: python tests/live_smoke/fred_smoke.py
