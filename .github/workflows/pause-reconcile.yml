name: Pause Reconcile

# alpha-engine-config-I7118. Three registers each claim whether a scheduled
# trigger is off, and until this workflow nothing compared them:
#
#   1. infrastructure/automation_pause.json — Brian's rulings.
#   2. The fleet observability registry's `lifecycle` declarations, read from
#      s3://alpha-engine-research/ops/registry/observability.d/ — the copy
#      nous-ergon-ops/.github/workflows/observability-registry-publish.yml syncs
#      on every merge that changes it, and the same copy the console reads.
#   3. Live AWS — every EventBridge rule and Scheduler schedule in the account.
#
# sf-arn-drift-check.yml's `automation_pause.py --check` step already grades (1)
# against (3), but only for the names (1) happens to list: its coverage is
# HAND-LISTED, which is observability-policy.md §2.2's defect one level up from
# the one the manifest fixes. This enumerates the account instead, so a trigger
# nobody named is a finding by construction. It also grades (2) against (1),
# which nothing did at all — a registry row saying `lifecycle: disabled` because
# a manifest entry said so is a hand-copied assertion about a file in another
# repository, and a row saying DISABLED renders green-adjacent, is excluded from
# staleness_honesty's violation set and is exempt from ABSENT candidacy. A
# component running again behind one is silent in every surface, which is worse
# than the UNREPORTED it replaced, because UNREPORTED is loud.
#
# WHY ITS OWN WORKFLOW RATHER THAN A STEP IN sf-arn-drift-check.yml. It publishes
# its own console row, so it is its own COMPONENT, and a component's identity on
# the `repos` substrate is derived from the workflow file that runs it
# (`observability_registry.py::discover`). As a step it was reported ABSENT —
# the row existed, the discoverer found only `nousergon-data-sf-arn-drift-check`,
# and the two could not join. Sharing a workflow would also make this check's
# failure indistinguishable from any other step's on that workflow's row.
#
# NOT a pull_request check, for the reason sf-arn-drift-check.yml states at
# length: every comparison here is CODIFIED-or-DECLARED vs LIVE, which says
# nothing about a PR's diff and would put a red X on PRs that did not cause it
# and cannot clear it. Graded post-merge and daily out of band.
#
# It is a GitHub Actions cron by design: outside the AWS pause entirely, so the
# observer cannot be disarmed by the ruling it observes (overseer-policy.md
# invariant 1 — the watcher sits outside its subject's dependency cone).
#
# DETECT-ONLY, structurally. tests/test_pause_reconcile.py asserts the module
# contains no mutating verb. Editing a lifecycle declaration because a manifest
# entry moved would INFER a decision from a file diff, which
# observability-policy.md §8.3 forbids.
#
# TWO JOBS, AND THAT IS THE POINT (alpha-engine-config-I7547). A detect-only job
# exits non-zero on every real finding, and GitHub renders "the detector broke"
# and "the detector works and found five things" as the same word: `failure`.
# Four consecutive such runs were four CORRECT detections and were read as one
# broken job, which is why a champion/challenger arm stayed silently missing for
# five days. The exit code is not the problem and is deliberately unchanged —
# the rendering was. So:
#
#   * `reconcile` fails ONLY when the reconciler could not run (exit 2: AWS
#     denied, the published registry empty, a register unreadable). That is a
#     broken job, and it is the only thing that turns this job red.
#   * `verdict` fails when there are findings, and its job NAME is the
#     reconciler's own headline — "DRIFT — 5 finding(s) across 72 live
#     trigger(s): running-while-declared-off, …". The run page states the count
#     and the kinds in the job list, with no log opened.
#
# The run still fails on drift, because the exit code is the signal. What
# changed is that a reader can now tell WHICH red it is at a glance, on three
# surfaces that do not require a log: the failing job's name, the `::error::`
# annotation the tool prints, and the rendered step summary. The console row is
# the fourth and is the one the fleet reads — `attention` for drift, and now
# `error` rather than SILENCE for a breakage.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/automation_pause.json'
      - 'infrastructure/automation_pause.py'
      - 'infrastructure/pause_reconcile.py'
      - '.github/workflows/pause-reconcile.yml'
  schedule:
    - cron: '50 9 * * *'   # daily, after the 09:30 SF-ARN sweep and the 09:35 IAM one
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

# WORKFLOW HEALTH SEMANTICS (alpha-engine-config-I9169, I9553, I9681).
# Read by alpha-engine-config's scripts/check_scheduled_workflow_health.py out
# of THIS file, so the declaration cannot outlive the steps it describes. This
# workflow's own header comment above already states the contract at length
# ("TWO JOBS, AND THAT IS THE POINT") — the exit code is deliberately
# unchanged on real drift, only the rendering. `scheduled-workflow-health`
# graded that design on plain execution health and filed
# alpha-engine-config-I9681 (0/12 clean over 12 runs): every one of those runs
# either failed in the `reconcile` job itself (exit 2, the real defect closed
# below) or in the single declared step here (exit 1, findings). Renaming that
# step without updating this list is caught by `--validate-declarations`.
env:
  WORKFLOW_HEALTH_SEMANTICS: finding-surface
  WORKFLOW_HEALTH_FINDING_STEPS: |
    Fail on drift, pass when every trigger is declared
  WORKFLOW_HEALTH_FINDING_ISSUE: alpha-engine-config-I7118
  WORKFLOW_HEALTH_FINDING_REASON: >-
    The `verdict` job's one step fails whenever the reconciler script run by
    the `reconcile` job above reports drift between automation_pause.json,
    the observability registry and live AWS - the non-zero exit IS the
    drift finding, by design (see this file's header comment). The
    `reconcile` job failing on its OWN step is a different thing - the
    reconciler could not run at all (AWS denied, a register unreadable) -
    and is graded on execution health as before, un-muted.

jobs:
  reconcile:
    name: compare the three registers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      verdict: ${{ steps.check.outputs.verdict }}
      findings: ${{ steps.check.outputs.findings }}
      headline: ${{ steps.check.outputs.headline }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'

      # --publish writes the console row through the canonical envelope builder
      # rather than a second hand-rolled JSON shape (shared-code-policy: one
      # shape, every call site). Same pin as requirements.txt, for the reason
      # deploy-infrastructure.yml states.
      - name: Install nousergon-lib (envelope builder for the console row)
        run: pip install "nousergon-lib @ git+https://github.com/nousergon/nousergon-lib@v0.124.154"

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-iam-drift-check
          aws-region: us-east-1

      # No `if:` — the invariant is about live state, so it is graded on every
      # trigger this workflow has. tests/test_pause_reconcile.py::
      # test_ci_runs_the_reconcile pins that, the same reachability regression
      # test_ci_runs_the_pause_check exists to prevent.
      #
      # --publish is best-effort by construction (fleet_check_result.emit never
      # raises): a check must not go red because its telemetry did. The verdict
      # is the exit code, and it is unaffected either way.
      #
      # ONE invocation writes all four surfaces — the console row, the rendered
      # run summary, the `::error::`/`::notice::` annotation and the job
      # outputs. The previous version ran the whole check a SECOND time to fill
      # the step summary, which doubled a ~100-call enumeration of the account
      # and let the summary disagree with the verdict printed above it whenever
      # live state moved between the two runs. It does: a runtime-minted
      # one-shot Scheduler schedule appeared in one and not the other on
      # 2026-08-17, which is what surfaced this.
      #
      # Exit 2 (could not run) fails this job; exit 1 (found drift) does not,
      # and fails the `verdict` job below instead — see the header.
      - name: Pause manifest vs observability registry vs live AWS
        id: check
        run: |
          code=0
          python3 infrastructure/pause_reconcile.py --check --publish --markdown "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" || code=$?
          echo "reconciler exit code: $code"
          if [ "$code" -ge 2 ]; then
            echo "The reconciler could NOT run. This is a broken detector, not a clean fleet."
            exit 1
          fi
          exit 0

  # The job whose NAME is the verdict. `needs` is one of the contexts
  # `jobs.<id>.name` accepts, which is what puts the finding count on the run
  # page without a log open. Skipped when `reconcile` failed, so a breakage
  # never masquerades as drift.
  verdict:
    name: ${{ needs.reconcile.outputs.headline }}
    needs: reconcile
    if: always() && needs.reconcile.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Via env, never interpolated into the script body: these values are this
      # repo's own tool output rather than user input, and the habit of
      # inlining `${{ }}` into `run:` is the one that eventually meets input
      # that is not.
      - name: Fail on drift, pass when every trigger is declared
        env:
          VERDICT: ${{ needs.reconcile.outputs.verdict }}
          FINDINGS: ${{ needs.reconcile.outputs.findings }}
          HEADLINE: ${{ needs.reconcile.outputs.headline }}
        run: |
          echo "$HEADLINE"
          if [ "$VERDICT" != "clear" ]; then
            echo "::error title=pause reconcile: $FINDINGS finding(s)::$HEADLINE"
            echo "Detect-only by design — nothing here is auto-remediated. Declare the"
            echo "component's real state; never re-enable or disable a trigger to clear this."
            exit 1
          fi

  # ── FAILURE ALERTING (alpha-engine-config-I9121) ─────────────────────────
  # A failing SCHEDULED workflow posts no PR check, calls no reusable notifier
  # and dispatches no agent, so it is indistinguishable from one that ran
  # clean. Measured 2026-08-28: NONE of this repo's five scheduled workflows
  # wired an alert path, and `pause-check-alert.yml` — a workflow whose entire
  # purpose is to page on pause drift — had failed 33 of 33 runs with nothing
  # anywhere saying so. The reusable notifier 31 other workflows in this repo
  # already use is the fleet's answer (config#1128, deduped through Fleet CI
  # Watch per config#2855); it is not called on a PR because the ref guard
  # below only passes on the default branch, which is where a scheduled run
  # always sits.
  notify-main-failure:
    needs: [reconcile, verdict]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
