name: Deploy data-collection stack

# Merge == live for the nousergon-data-collection CloudFormation stack
# (alpha-engine-config-I10739; alpha-engine-config architecture.d/146).
#
#   lint        no credentials; runs on every PR touching the stack.
#   deploy      every merge touching the stack applies it and then proves the
#               live stack carries this commit's template + definition digests
#               and each schedule its declared state.
#   check-live  weekly, the same comparison with no apply: a stack edited in the
#               console, deleted, or left behind by a failed apply is red on a
#               schedule instead of discovered (the merged-but-unapplied class).
#
# A SEPARATE workflow and identity from deploy-infrastructure.yml: data
# collection must not share a deploy path with alpha-engine-orchestration,
# which Crucible v2 phase 4 tears down. github-actions-data-collection-stack-
# deploy's trust pins this repo, refs/heads/main and THIS workflow file; it is
# codified in nous-ergon-ops infrastructure/iam/ and holds no IAM write.

on:
  push:
    branches: [main]
    # Kept in lockstep with pull_request.paths by
    # tests/test_data_collection_stack.py::test_workflow_path_filters_match.
    paths:
      - 'infrastructure/cloudformation/nousergon-data-collection.yaml'
      - 'infrastructure/step-functions/data-collection.asl.json'
      - 'infrastructure/data_collection_stack.py'
      - 'infrastructure/deploy-data-collection-stack.sh'
      - 'infrastructure/automation_pause.json'
      - 'infrastructure/lambdas/data-spot-dispatcher/index.py'
      - '.github/workflows/deploy-data-collection-stack.yml'
  pull_request:
    paths:
      - 'infrastructure/cloudformation/nousergon-data-collection.yaml'
      - 'infrastructure/step-functions/data-collection.asl.json'
      - 'infrastructure/data_collection_stack.py'
      - 'infrastructure/deploy-data-collection-stack.sh'
      - 'infrastructure/automation_pause.json'
      - 'infrastructure/lambdas/data-spot-dispatcher/index.py'
      - '.github/workflows/deploy-data-collection-stack.yml'
  schedule:
    # Sunday 22:30 UTC: after the Saturday collection, before the week starts.
    - cron: '30 22 * * 0'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-data-collection-stack
  cancel-in-progress: false

jobs:
  lint:
    name: Lint data-collection stack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install lint dependencies
        run: python -m pip install --quiet 'cfn-lint==1.56.0' 'pyyaml>=6'
      - name: Lint
        run: bash infrastructure/deploy-data-collection-stack.sh --lint

  deploy:
    name: Apply data-collection stack
    needs: [lint]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'cfn-lint==1.56.0' 'pyyaml>=6' 'boto3>=1.34'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-data-collection-stack-deploy
          aws-region: us-east-1
      - name: Deploy and verify
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash infrastructure/deploy-data-collection-stack.sh

  check-live:
    name: Live stack matches main
    needs: [lint]
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet 'pyyaml>=6' 'boto3>=1.34'
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-data-collection-stack-deploy
          aws-region: us-east-1
      - name: Check live
        run: python3 infrastructure/data_collection_stack.py check-live

  notify-main-failure:
    needs: [lint, deploy, check-live]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
