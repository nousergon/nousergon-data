name: Deploy collection-readiness-probe

# Auto-deploy the alpha-engine-collection-readiness-probe Lambda CODE on
# merge to main (alpha-engine-config-I11264 deliverable 1).
#
# Mirrors deploy-preopen-deploy-readiness-probe.yml: code only. deploy.sh with
# no flags is its update-code path — the BOOTSTRAP block (IAM role/policy,
# Lambda create) is gated behind --bootstrap/--apply-iam and is NEVER invoked
# here, so this workflow cannot create or rewire infrastructure, only ship code
# to a function that already exists.
#
# The zip PACKAGES the shared run-manifest predicate and the unit descriptors
# it grades, so those paths are on the filter too: a descriptor edit must reach
# this function on the merge button alone, or it goes on grading the previous
# descriptor set with nothing red (same reasoning as
# deploy-data-spot-dispatcher.yml, alpha-engine-config-I10787).
#
# IAM: no change needed. github-actions-lambda-deploy's LambdaUpdate
# statement already grants GetFunction / GetFunctionConfiguration /
# UpdateFunctionCode / UpdateFunctionConfiguration on
# arn:aws:lambda:us-east-1:711398986525:function:alpha-engine-*, which
# covers alpha-engine-collection-readiness-probe.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/collection-readiness-probe/**'
      - '.github/workflows/deploy-collection-readiness-probe.yml'
      - 'registry.d/units/**'
      - 'data_gate/descriptors.py'
      - 'data_gate/__init__.py'
      - 'data_gate/run_manifest_predicate.py'
  workflow_dispatch:

concurrency:
  group: deploy-collection-readiness-probe-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy collection-readiness-probe Lambda (code-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: alpha-engine-data

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy collection-readiness-probe (code-only)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/collection-readiness-probe/deploy.sh

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-collection-readiness-probe \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-collection-readiness-probe.yml

  # Alert (Telegram) on genuine post-merge failure on the default branch.
  # Reusable workflow + transport in nousergon-lib. config#1128.
  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
