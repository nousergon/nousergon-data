name: Pause Check Alert

# alpha-engine-config-I8110 deliverable 1. automation_pause.py --check
# already runs daily in sf-arn-drift-check.yml, but that workflow's only
# reader on a finding is a GitHub Actions red X plus whatever downstream
# groom triages it — and the groom has been paused since 2026-08-12
# (alpha-engine-config-I6984). The 2026-08-21 drift (four
# alpha-engine-alert-drain-*utc schedules re-enabled, their four watch-plane
# alarms left muted) sat live for 1h20m and was found by hand; --check would
# have caught it same-cycle had anything besides the paused groom been
# reading its output. "A guard whose only reader is paused is not a guard."
#
# This workflow IS that reader. It is deliberately its OWN workflow rather
# than a step added to sf-arn-drift-check.yml, for the same reason
# pause-reconcile.yml is its own workflow rather than a step there: sharing a
# job would make this check's alert path indistinguishable from any other
# step's failure on that job, and its cadence needs to be independent of
# sf-arn-drift-check.yml's (daily, tied to the IAM-drift sweep it rides
# alongside).
#
# CADENCE IS HOURS, NOT DAYS — the whole point of this issue. Six times a
# day (every 4 hours) bounds the worst-case time-to-page at 4h, well inside
# "would have caught the 2026-08-21 drift the same day" and cheap: each run
# is a handful of read-only DescribeRule/GetSchedule/DescribeAlarms calls
# against one account, the same calls sf-arn-drift-check.yml already makes
# once a day.
#
# DELIVERY, NOT JUST DETECTION. `--alert-on-fail` fans a finding out through
# krepis.alerts at severity=error (SEVERITY_PHONE_PUSH) — the only severity
# this caller can rely on reaching Brian by phone push with no groom, sweep,
# or console reader in the loop (alpha-engine-config-I7857: every severity
# is delivered to the channel, but only error/critical also buzz the phone,
# and with the groom paused nothing is reading the channel text). This is
# ADDITIVE to sf-arn-drift-check.yml's existing --check step, which stays as
# the CI-visible, PR-adjacent signal; this workflow is the paging path that
# does not depend on anyone looking at Actions.
#
# NOT the enforcement half. This workflow only ever runs `--check
# --alert-on-fail` — it never calls `--enforce`, on triggers or on alarms.
# The scheduled `--enforce --alarms-only` reconciliation already exists and
# already runs independently of the groom, unconditionally on every trigger
# of sf-arn-drift-check.yml including its own daily cron (deliverable 2 —
# see that workflow's "Paused-component alarm actions reconciled with the
# manifest (live)" step, added alpha-engine-config-I7174/I7023). This
# workflow adds nothing there; it exists solely to make sure a --check
# finding is never silent again.
#
# NOT a pull_request check, for the reason sf-arn-drift-check.yml and
# pause-reconcile.yml both state at length: every comparison here is
# CODIFIED-manifest vs LIVE AWS, which says nothing about a PR's diff and
# would put a red X on PRs that did not cause it and cannot clear it.

on:
  schedule:
    - cron: '15 */4 * * *'   # every 4 hours, offset from the :30/:50 daily sweeps
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

# WORKFLOW HEALTH SEMANTICS (alpha-engine-config-I9169).
# Read by alpha-engine-config's scripts/check_scheduled_workflow_health.py out
# of THIS file, so the declaration cannot outlive the steps it describes. A
# non-zero exit at a declared finding step is graded `reporting_findings`
# (visible, not counted unhealthy, and no "this control has never once
# succeeded" issue filed against it); a failure ANYWHERE else - checkout, an
# OIDC role that no longer exists, a dependency install - and a run that never
# started at all are graded exactly as before. Renaming a step below without
# updating this list is caught by `--validate-declarations`.
env:
  WORKFLOW_HEALTH_SEMANTICS: finding-surface
  WORKFLOW_HEALTH_FINDING_STEPS: |
    Scheduled-automation pause still holds (live) — page on drift
  WORKFLOW_HEALTH_FINDING_ISSUE: alpha-engine-config-I6703
  WORKFLOW_HEALTH_FINDING_REASON: >-
    Exits 1 when a trigger listed in automation_pause.json is live
    ENABLED again - the non-zero exit IS the pause-drift finding, and
    paging on it is the step's declared job.

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Mask the account id in this public log
        run: echo "::add-mask::${{ vars.AWS_ACCOUNT_ID }}"
        # This repository is public and its run logs are public; GitHub masks
        # SECRETS, not repository VARIABLES (alpha-engine-config-I10973).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-iam-drift-check
          aws-region: us-east-1

      # krepis is required only by --alert-on-fail (imported lazily inside
      # automation_pause.py::alert_on_findings so the bare --check step in
      # sf-arn-drift-check.yml keeps needing nothing beyond the stdlib). Same
      # pin floor and same install pattern as deploy.yml's canary-rollback
      # alert step ("Install krepis for deploy.sh alerts call") — read-only
      # here too, no extras needed (alerts uses boto3/SNS, preinstalled on
      # ubuntu-latest).
      - name: Set up Python for the alert-publish path
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install krepis for automation_pause.py --alert-on-fail
        run: pip install "krepis>=0.6.0"

      # No `if:` — the invariant is about live AWS state and it must be
      # reachable on every trigger this workflow has, the same reachability
      # property tests/test_automation_pause.py::test_ci_runs_the_pause_check
      # already pins for the daily step. This job's whole reason to exist is
      # to page when --check fails, so a gated step here would silently
      # reintroduce the exact defect this issue closes.
      - name: Scheduled-automation pause still holds (live) — page on drift
        # TELEGRAM IS A LIVE GHA TRANSPORT AND MUST BE WIRED EXPLICITLY
        # (alpha-engine-config-I9209). krepis.telegram resolves both values
        # through `get_secret`, which reads SSM first and the environment
        # second. On the laptop and on EC2 the SSM read succeeds, so Telegram
        # "just works" there; a GHA runner assuming this OIDC role holds no
        # ssm:GetParameter on /alpha-engine/telegram/*, so the SSM leg fails
        # and the env leg was never populated — which is why 8 consecutive
        # runs logged `TELEGRAM_BOT_TOKEN=MISSING TELEGRAM_CHAT_ID=MISSING`
        # while SNS and EventBridge were separately IAM-denied. Both names are
        # ORGANISATION-WIDE Actions secrets with ALL-repository visibility
        # (measured 2026-08-31 via `gh secret list --org nousergon`), so
        # nothing needed provisioning — only this mapping. It matters
        # disproportionately: severity="error" is pinned in
        # automation_pause.py::alert_on_findings precisely because
        # error/critical are the severities krepis phone-pushes over Telegram
        # (krepis.alerts.SEVERITY_PHONE_PUSH), so without these two lines the
        # workflow's whole stated purpose — page Brian with no groom, sweep or
        # console reader in the loop — is carried by no transport at all.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 infrastructure/automation_pause.py --check --alert-on-fail

  # ── FAILURE ALERTING (alpha-engine-config-I9121) ─────────────────────────
  # A failing SCHEDULED workflow posts no PR check, calls no reusable notifier
  # and dispatches no agent, so it is indistinguishable from one that ran
  # clean. Measured 2026-08-28: NONE of this repo's five scheduled workflows
  # wired an alert path, and `pause-check-alert.yml` — a workflow whose entire
  # purpose is to page on pause drift — had failed 33 of 33 runs with nothing
  # anywhere saying so. The reusable notifier 31 other workflows in this repo
  # already use is the fleet's answer (config#1128, deduped through Fleet CI
  # Watch per config#2855); it is not called on a PR because the ref guard
  # below only passes on the default branch, which is where a scheduled run
  # always sits.
  notify-main-failure:
    needs: [check-and-alert]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@5a434a599a4fba3e6201db43d6453c3ecffbba29 # main
    secrets: inherit
