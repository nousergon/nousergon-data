[build-system]
requires = ["setuptools"]

[project]
name = "alpha-engine-data"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_alarm_scan: opt out of the autouse CloudWatch stub in tests/test_automation_pause.py — for the one test whose subject IS the live-alarm scan",
  "live_ca_scan_hook: opt out of the autouse stub of corporate_actions.scan_manifest.morning_scan in tests/conftest.py — for the scan manifest's own tests",
  "v2_switch: keep the pipeline-watchdog's real Crucible v2 switch declarations (retired EOD SF check, paused weekly cron) instead of the autouse v1-cycle stub — alpha-engine-config-I13255",
  "real_trigger_scan: opt out of the autouse live-trigger-enumeration stub in tests/test_automation_pause.py — for tests whose subject IS _live_triggers() itself",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]

[tool.coverage.report]
# Ratchet floor — placeholder. Full suite could not be measured on this ARM runner
# (arcticdb has no ARM Linux wheel). Raise to the actual measured value once CI
# has run on an x86_64 runner and confirmed the real coverage level.
fail_under = 0

[tool.basedpyright]
# Strict typing gate (fleet strict-typing rollout, alpha-engine-config-I12607).
# CI runs it as a BLOCKING step in the existing test job.
#
# `.basedpyright/baseline.json` records the errors that existed when the gate was
# switched on. basedpyright ignores exactly those and fails on any NEW error, so
# every new or changed line is held to strict from day one. The baseline shrinks
# as old errors are fixed; CI refuses a PR that grows any rule's count. Never
# regenerate it (`--writebaseline`) to get a PR green: fix the code, or suppress
# one line with `# pyright: ignore[<rule>]` and say why.
include = ["builders", "collectors", "contracts", "corporate_actions", "data", "data_gate", "data_quality", "features", "infrastructure", "migrations", "rag", "scripts", "shadow", "sources", "store", "validators", "dates.py", "emailer.py", "polygon_client.py", "preflight.py", "run_units.py", "sf_preflight.py", "sf_preflight_on_spot.py", "universe_scope.py", "weekly_collector.py"]
# Analysed at the declared floor, where version-specific syntax regressions bite.
exclude = ["**/test_*.py", "**/tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
# Strict mode does not flag an explicit `Any`; this does. A needed `Any` (an
# untyped SDK object, raw JSON) gets a line-level ignore with a reason.
reportExplicitAny = "error"
# A bare `# type: ignore` silences every rule on the line; only rule-scoped
# `# pyright: ignore[rule]` comments are honoured.
enableTypeIgnoreComments = false
reportIgnoreCommentWithoutRule = "error"
reportUnnecessaryTypeIgnoreComment = "error"
