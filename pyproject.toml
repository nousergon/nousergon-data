[build-system]
requires = ["setuptools"]

[project]
name = "alpha-engine-data"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "real_alarm_scan: opt out of the autouse CloudWatch stub in tests/test_automation_pause.py — for the one test whose subject IS the live-alarm scan",
  "live_ca_scan_hook: opt out of the autouse stub of corporate_actions.scan_manifest.morning_scan in tests/conftest.py — for the scan manifest's own tests",
  "real_trigger_scan: opt out of the autouse live-trigger-enumeration stub in tests/test_automation_pause.py — for tests whose subject IS _live_triggers() itself",
]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]

[tool.coverage.report]
# Ratchet floor — placeholder. Full suite could not be measured on this ARM runner
# (arcticdb has no ARM Linux wheel). Raise to the actual measured value once CI
# has run on an x86_64 runner and confirmed the real coverage level.
fail_under = 0
