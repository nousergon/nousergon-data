# Paths excluded from the scan entirely, each with the reason it is not a
# producer of a published data key.
excluded_paths:
  - glob: "**/test_*.py"
    reason: Test scaffolding, not a producer.
  - glob: "**/*_test.py"
    reason: Test scaffolding, not a producer.
  - glob: "**/conftest.py"
    reason: Test scaffolding, not a producer.
  - glob: "scripts/check_rehearsal_path.py"
    reason: Rehearsal tooling for the SF path; writes an ops artifact, not a data key.
  - glob: "scripts/fault_injection_run.py"
    reason: Commissioning tooling. It writes fault records, which are the gate's INPUT.
  - glob: "scripts/lint_extras.py"
    reason: A lint helper.
  - glob: "scripts/sf_rerun_common.py"
    reason: Step Functions rerun tooling — the ops plane, not a data producer.
  - glob: "scripts/weekday_sf_rerun.py"
    reason: Step Functions rerun tooling — the ops plane.
  - glob: "scripts/weekly_sf_rerun.py"
    reason: Step Functions rerun tooling — the ops plane.
  - glob: "scripts/weekly_sf_recovery_metric.py"
    reason: An ops metric about the pipeline, not a published data key.
  - glob: "scripts/weekly_sf_silence_deadman.py"
    reason: A deadman for the pipeline — the ops plane.

# Descriptors whose `code_path` names no in-repo Python file, so the REVERSE
# direction (descriptor -> write site) cannot be checked by an AST scan. Named
# rather than skipped: the clause detail says which units it could not check in
# that direction, so partial coverage is reported instead of assumed complete.
no_python_write_site:
  - unit: D16
    reason: Its entry point is rag/pipelines/run_weekly_ingestion.sh, a shell script.
  - unit: D47
    reason: >-
      Component 2. Its producer lives in the `crucible` repository and this scan
      has no visibility into it; its clauses are graded on the crucible board.
