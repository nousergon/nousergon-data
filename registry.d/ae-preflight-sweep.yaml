# Console descriptor for the all-stage weekly-SF preflight sweep.
#
# console-policy §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where the facts ALREADY live.
# Nothing about the console changes to render this component — no adapter, no
# template, no config entry keyed on its name.
#
# The per-STAGE rows are not declared here on purpose. They are check-result
# envelopes at ops/checks/ae-preflight-stage-<Stage>/latest.json, read by the
# existing `checks-envelope` adapter, which derives each row's freshness from
# the envelope's own ran_at against its cadence_minutes. Enumerating stages in
# this file would put a hand-maintained list between the pipeline and its own
# console rows, and that list would drift exactly the way every hand-maintained
# monitored-things list drifts — invisibly, in the direction of looking
# complete. The stage set is derived from infrastructure/step_function.json on
# every run instead, so a stage added to the pipeline appears on the console by
# itself and a stage with no verdict is counted as UNOBSERVED by the roll-up
# below rather than omitted from the denominator.
component_id: ae-preflight-sweep
owning_repo: nousergon-data
# `eventbridge`, not `eventbridge+ec2-spot`. `substrate` is a CLOSED set in
# `nous-ergon-ops/scripts/observability_registry.py` (a substrate with no
# representation there is a blind spot by construction), and the value must
# agree with `origin` — alpha-engine-config-I7061 is 25 rows that said `lambda`
# while their origin named an EventBridge rule, so the console asked the
# AWS/Lambda question about a schedule and correctly found nothing. This row's
# origin IS the daily rule; the spot box it provisions is the thing triggered,
# not the trigger.
substrate: eventbridge
origin: aws:events:alpha-engine-preflight-sweep-daily
owner: brian
lifecycle: deprecated
lifecycle_reason: >-
  Deprecated 2026-10-31 (alpha-engine-config-I12842 / -I12908). The sweep
  derives its stage list from infrastructure/step_function.json, the v1 weekly
  Step Function ne-weekly-freshness-pipeline, whose only trigger
  `alpha-engine-saturday` is DISABLED by Brian's 2026-10-28 ruling; the Crucible
  v2 weekly replaced it. It still runs daily, so `deprecated` (still produces,
  decision taken), not `disabled`: its rollup is ATTENTION by design while any
  acknowledged no_dry_path / dedicated-box gap exists, which made it a standing
  DEGRADED row for a pipeline nothing fires. Retire it, or repoint it at the v2
  weekly, with the v1 decommission (alpha-engine-config-I10655).
lifecycle_owner: brian
lifecycle_reexam: 2026-11-30

# ── Registry claims (observability-policy.md §2.2) ──────────────────────────
# This file is now gathered into the fleet observability registry by
# `nous-ergon-ops/scripts/gather_repo_descriptors.py` and held to the SAME
# schema as a row in `governance/observability.d/`
# (alpha-engine-config-I7490). That is the point rather than a tax: §2.6 says
# the descriptor IS the declaration for its component, so a descriptor exempt
# from the required-field rule would be a way to publish a row that reads as
# declared and is not. One file, one declaration, one standard.
#
# Every `unknown` below carries a reason, per §2.2's rule that a blank required
# field is worse than no row. Two of them were SEARCHED FOR and not found
# rather than left unexamined, and the reason says which — a claim recorded as
# a guess is a wrong answer that reads as measured.
authority_tier: observe-and-report

signals:
  # Emitted: the run report and the per-stage check envelopes both carry
  # `ran_at`, and the dispatcher's own invocation is an EventBridge target.
  execution: emitted
  # Emitted: `stages_declared` / `_passed` / `_failed` / `_unmeasured` /
  # `_unobserved` are the sweep's own coverage numbers, published even at zero.
  data: emitted
  # Emitted: `outcome`, plus `unsweepable_streak_state`.
  outcome: emitted
  cost:
    status: unknown
    reason: >-
      The sweep provisions a spot box per run and no cost figure is written to
      any artifact this row names. Not audited — stated as a work item rather
      than claimed absent, because nothing here has looked at Cost Explorer
      tagging for the launcher.
  resource:
    status: unknown
    reason: >-
      Not audited. The launcher box emits no memory/CPU record into
      `_preflight_sweep/latest.json` or the check envelope, and whether the
      spot instance publishes CloudWatch agent metrics has not been checked.

log_location: >-
  s3://alpha-engine-research/_ssm_logs/preflight-sweep/{YYYY-MM-DD}/{run_id}.log
  (written by infrastructure/preflight_sweep.sh, which tees /var/log/
  preflight-sweep-${RUN_ID}.log to S3), plus the
  alpha-engine-preflight-sweep-dispatcher Lambda's CloudWatch log group for the
  provisioning half.

alert_channel: unknown
alert_channel_reason: >-
  Searched and not found rather than unexamined: no SES, Telegram or notifier
  call exists in infrastructure/preflight_sweep.sh, infrastructure/
  preflight_sweep.py or the preflight-sweep-dispatcher handler as of
  2026-08-17. The sweep publishes verdicts and nothing routes them, so its
  console rows are currently its ONLY reader. Recorded as unknown rather than
  `n/a` because a daily coverage sweep with no alert path is a gap to close,
  not a design.

severity_source: unknown
severity_source_reason: >-
  Follows from alert_channel: with no routing there is no severity mapping to
  declare. The status vocabulary the envelopes use is pinned by
  alpha-engine-config-PR7488, which is a console contract, not a severity
  taxonomy.

console_surface: >-
  console:/component/ae-preflight-sweep — the roll-up row from this descriptor,
  plus one `ae-preflight-stage-<Stage>` check-envelope row per derived stage
  (see the design note above on why the stage set is not enumerated here).

retention: unknown
retention_reason: >-
  Not audited. `_preflight_sweep/latest.json` is last-write-wins with no
  declared history, `_ssm_logs/preflight-sweep/` is date-partitioned under no
  lifecycle rule this row has verified, and the bucket-level policy on
  alpha-engine-research has not been read for these prefixes.

# Executions: the dispatcher Lambda that provisions the launcher box and sends
# the sweep command. Did it run, did it finish, did it miss.
runs:
  driver: object-store
  key: "s3://alpha-engine-research/_preflight_sweep/latest.json"
  cadence_minutes: 1440

# The sweep's own numbers, read from the structured run report it already
# writes — addressed by FIELD NAME, never by a pattern over prose.
metrics:
  driver: document-fields
  documents:
    - key: "s3://alpha-engine-research/_preflight_sweep/latest.json"
      fields:
        outcome: {render: text}
        measured: {render: text}
        unmeasured_reason: {render: text}
        stages_declared: {unit: count, render: count}
        stages_passed: {unit: count, render: count}
        stages_failed: {unit: count, baseline: 0, render: count}
        stages_unmeasured: {unit: count, baseline: 0, render: count}
        stages_unsweepable: {unit: count, baseline: 0, render: count}
        # The two kinds of unsweepable, rendered apart. A coverage defect means
        # a stage that SHOULD be monitored is not; an upstream-pending stage is
        # simply not measurable until its producer has run for real, which is
        # the ordinary state on the ~6 non-Saturday days of any week. Collapsing
        # them is what made the sweep's first run email "2 failed" (config#7323).
        stages_unsweepable_coverage_defect: {unit: count, baseline: 0, render: count}
        stages_unsweepable_upstream_pending: {unit: count, render: count}
        # Published at zero as well: a stage the pipeline declares and the
        # sweep never exercises is a coverage gap whose absence from the surface
        # is indistinguishable from health (config#7324).
        stages_no_dry_path: {unit: count, render: count}
        stages_not_attempted: {unit: count, baseline: 0, render: count}
        unsweepable_streak_state: {render: text}
        definition_sha: {render: text}
    - key: "s3://alpha-engine-research/ops/checks/ae-preflight-sweep/latest.json"
      fields:
        stages_expected: {unit: count, render: count}
        stages_reported: {unit: count, render: count}
        # The transparency number for this component: stages the pipeline
        # declares that produced no verdict at all. Published even at zero —
        # a coverage figure that only appears when non-zero cannot be told
        # apart from health when it is absent.
        stages_unobserved: {unit: count, baseline: 0, render: count}
        # Findings, split by whether they mean the sweep's own denominator is
        # WRONG (blocking) or that a declared gap exists (named, acknowledged).
        coverage_findings_blocking: {unit: count, baseline: 0, render: count}
        # Named, never counted: which stages have no dry path, and which are
        # waiting on a same-day upstream this run.
        no_dry_path_stages: {render: text}
        upstream_pending_stages: {render: text}
        declared_cadence: {render: text}
  cadence_minutes: 1440

produces:
  - "_preflight_sweep/latest.json"
  - "_preflight_sweep/last_clean.json"
  - "_preflight_sweep/unsweepable_streaks.json"
  - "ops/checks/ae-preflight-sweep/latest.json"

# The direction that matters: who breaks if this is stale. The sweep reads the
# live SF definition to derive its own denominator, so a definition change it
# cannot parse is a sweep that measures the wrong pipeline.
consumes:
  - "nousergon-data:infrastructure/step_function.json"
  - "nousergon-data:infrastructure/preflight_sweep_manifest.json"
  - "nousergon-data:infrastructure/preflight_sweep_cadence.json"
