# Unit descriptor — data collector unit D16 (RAG weekly ingestion).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D16
component_id: "data-collector-d16-rag-weekly-ingestion"
owning_repo: "nousergon-data"
title: RAG weekly ingestion
component: 1
lifecycle: "in-service"
owner: brian
code_path: rag/pipelines/run_weekly_ingestion.sh
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:RAGIngestion"
  successor: >-
    nousergon-data-collection/data-collection-weekly, dispatcher workload
    `rag-weekly-ingestion` (alpha-engine-config-I10753). DISABLED until the
    phase-4 cutover PR; SAME script (`bash
    rag/pipelines/run_weekly_ingestion.sh`, all 10 steps unchanged) the v1
    RAGIngestion state ran. Also covers D46 (step 6, Form 4) — D46 has no
    separate dispatcher key.
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "rag/manifest/{date}.json"
  - rag/manifest/latest.json
  - rag/filing_changes/
  - "health/rag_ingestion_progress/{date}.json"
consumers:
  - "crucible-dashboard:loaders/s3_loader.py"
  - "crucible-research:agents/sector_teams/rag_retrieval_tools.py"
contract:
  schema: "contracts/rag_manifest.schema.json"
  producer_test: tests/test_rag_manifest_contract.py
  consumer_pins:
    - "crucible-dashboard:tests/contracts/rag_manifest.schema.json"
  # P-07 (alpha-engine-config-I10873, I10934): disambiguates R7's split of
  # this unit's writes — `rag/watermarks/*` and `rag/corpus_freshness/latest.json`
  # are dropped (zero external readers, see `notes` below); the SURVIVING
  # published key with a real consumer is `rag/manifest/{date,latest}.json`
  # (rag/pipelines/emit_manifest.py::build_manifest), read by
  # crucible-dashboard loaders/s3_loader.py::load_rag_manifest — verified
  # 2026-09-16 (the module's own docstring: "the presentation layer ...
  # never queries pgvector directly"). Producer side built the I10873 PR: a
  # versioned schema for the manifest shape + a producer test against the
  # REAL `build_manifest()` output (pgvector `execute_query` mocked
  # deterministic, no live DB) plus a hand-built fixture. The I10934
  # companion PR (crucible-dashboard) pins
  # `tests/contracts/rag_manifest.schema.json` (copy of this file) + a
  # contract test round-tripping a schema-conformant fixture through the
  # REAL `load_rag_manifest` reader and the pin is declared above.
registry_rows:
  - rag_corpus_freshness
run_manifest_prefix: data_collection/runs/D16
detectors:
  - kind: "cloudwatch-alarm"
    via: "no-heartbeat"
    state: UNVERIFIED
    note: the alarm exists; its EXECUTION is not verified. P3 commissioning.
freshness:
  family: weekly
  deadline: "Sat 13:00 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: declared filing sources
  floor: 0.9
  status: proposed
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: partial
    note: >-
        `set -euo pipefail` aborts the script on step failure, but the progress PUT is `||
        echo WARN` (run_weekly_ingestion.sh:119-122)
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: UNVERIFIED
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    alpha-engine-config-I10753: standalone workload `rag-weekly-ingestion` added
    (nousergon-data-PR1714, MERGED 2026-09-15 — corrected 2026-09-17 from
    "pending merge", which had outlived the merge and read as outstanding
    work). Measured span across two full v1
    executions (2026-08-04, 2026-08-07): ~20-23 min, well inside the
    dispatcher's 7200s per-workload ceiling. R7: `rag/watermarks` and
    `rag/corpus_freshness` have zero external readers and are DROPPED from this
    unit's declared `writes` above — but the underlying script is left
    UNCHANGED (out of this unit's owned files; run_weekly_ingestion.sh is
    nousergon-data RAG-pipeline code, not the dispatcher/CFN/descriptor
    surface I10753 scopes). `rag/watermarks/v1/{source}.json` is NOT a
    zero-consumer output artifact in the audit's sense — it is operational
    state the SEC/8-K/earnings/theses ingest steps read to fetch only the gap
    since the last confirmed ingest (rag/pipelines/_watermarks.py); dropping
    the write would force a full-window refetch every Saturday. Only
    `rag/corpus_freshness/latest.json` (assert_corpus_freshness.py, step 5,
    an assertion output with no operational read-back) is a true dead write;
    it continues as an accepted residual (write-but-unmonitored) until a
    follow-up trims step 5's publish, tracked separately.
