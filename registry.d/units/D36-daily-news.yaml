# Unit descriptor — data collector unit D36 (daily-news).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D36
component_id: "data-collector-d36-daily-news"
owning_repo: "nousergon-data"
title: "daily-news"
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/daily_news.py:174"
trigger:
  kind: "systemd-timer"
  owner: dashboard box
  successor: unchanged by v2 phase 4
  runs_on: "ec2-on-demand"
  detail: "daily-news.timer, 04:00 America/Los_Angeles"
  # alpha-engine-config-I10871/I10870: machine-readable cadence for
  # data_gate/cadence.py::unit_cadence — the AWS cron/named-day/weekdays
  # shapes it parses only cover scheduled-once-a-week/weekday forms, not a
  # daily systemd timer, so this is declared as `continuous` the same way
  # news_digest_daily's own ARTIFACT_REGISTRY row already models the SAME
  # timer (cadence: continuous, interval_minutes: 1440). Verified against
  # infrastructure/systemd/daily-news.timer on origin/main:
  # `OnCalendar=*-*-* 04:00:00 America/Los_Angeles`, `Persistent=true` — every
  # calendar day, not weekday-gated.
  cadence_minutes: 1440
writes:
  # alpha-engine-config-I10870: corrected from the bare prefixes
  # "data/news_aggregates_daily/" / "data/news_articles_daily/" to the
  # literal keys nousergon_lib.eval_artifacts.eval_latest_key() actually
  # writes (data/derived/news_aggregates.py::aggregate_and_write,
  # data/derived/news_articles.py::articles_build_and_write) — these are the
  # PRIMARY artifacts the ARTIFACT_REGISTRY daily_news / daily_news_articles
  # rows already cover; the bare-prefix spelling never matched either row's
  # s3_key_template. The per-run dated parquet under each prefix
  # (eval_artifact_key, variable {run_id}) is not separately registered —
  # same eval-artifact pattern as every other producer using this module.
  - data/news_aggregates_daily/latest.json
  - data/news_articles_daily/latest.json
  - data/news_digest_daily/latest.json
consumers:
  - "morning-signal:src/morning_signal/news_context.py"
  - "crucible-dashboard:views/Daily_News.py"
  - "crucible-research:thinktank/context.py"
contract:
  schema:
    - "contracts/news_digest_daily.schema.json"
    - "contracts/news_article_row.schema.json"
    - "contracts/news_aggregate_row.schema.json"
  # LIST value (three distinct published keys, three schemas) — data_gate/evidence.py
  # only reads a scalar today (the D37 defect noted in PR1747/a63bbb0b); the sibling
  # fixing _declared_schema_files in the data_gate track should extend it to lists.
  producer_test: tests/test_news_daily_contract.py
  consumer_pins:
    - "morning-signal:tests/contracts/news_digest_daily.schema.json (HARD requirement, load_news_context raises when absent/stale/empty)"
    - "crucible-dashboard:tests/contracts/news_article_row.schema.json"
  # P-07 (alpha-engine-config#10870): news_aggregate_row has no consumer pin here —
  # its live consumer (crucible-research thinktank/context.py) is v1, retiring under
  # phase 4, and out of scope for this PR; the producer schema is still built per
  # plan §3 (a surviving consumer exists regardless of tier).
registry_rows:
  - daily_news
  - daily_news_articles
  - news_digest_daily
run_manifest_prefix: data_collection/runs/D36
detectors:
  - kind: "box-timer-health"
    via: "per-timer exit/streak every 10 min"
    state: PRESENT
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: "daily-news"
  deadline: "06:00 America/Los_Angeles"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: declared news sources
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: present
    note: "--require-digest (scripts/run_daily_news_standalone.sh:125)"
  cardinality:
    state: broken_by_design
    note: >-
        GDELT/Polygon bail budgets write a PARTIAL digest reported as a normal run. P2
        reports a partial as `failed` or as a declared partial.
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: risk
    note: >-
        RAG ingest is fail-soft inside daily_news.py and the log upload is `|| true`
        (run_daily_news_standalone.sh:27)
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: ABSENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: "Run record ABSENT: journald plus an `|| true` log upload is not a record. P-06."
