# Unit descriptor — data collector unit D38 (crypto-balances).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D38
component_id: "data-collector-d38-crypto-balances"
owning_repo: "nousergon-data"
title: "crypto-balances"
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/crypto_balances.py:270; infrastructure/lambdas/crypto-balances/index.py:40"
trigger:
  kind: "eventbridge-scheduler"
  owner: "alpha-engine-crypto-balances-15min"
  successor: unchanged by v2 phase 4
  # alpha-engine-config-I11812 (R2 (a), re-enable decision PR, 2026-10-02):
  # once per trading day, after the close, instead of every 15 minutes (R2's
  # proposed cadence). UTC, because the entry carries no timezone. The entry
  # keeps its historical name `-15min`; renaming it is a delete + create that
  # buys nothing but the label.
  schedule: "cron(30 22 ? * MON-FRI *)"
  runs_on: lambda
writes:
  - crypto/holdings.json
consumers:
  - "metron:api/services/crypto.py"
contract:
  schema: "contracts/crypto_holdings.schema.json"
  producer_test: tests/test_crypto_holdings_contract.py
  consumer_pins:
    - repo: "metron"
      path: "tests/contracts/crypto_holdings.schema.json"
      pins: "body_schema"
      producer: "contracts/crypto_holdings.schema.json"
      read_site: "api/services/crypto.py::for_portfolio"
  # P-07 (alpha-engine-config#10870): D38 is PAUSED (alpha-engine-config-I10748),
  # but Metron api/services/crypto.py::for_portfolio still reads crypto/holdings.json
  # (data_spine.CRYPTO_HOLDINGS_KEY) unconditionally — a surviving consumer per
  # plan §3 regardless of run cadence. Pinned copy + reader-exercising test in
  # metron tests/test_p07_contracts.py (alpha-engine-config-PR-pending, mirrors
  # the existing metron_* schema family there).
registry_rows:
  - crypto_holdings (SUPPRESSED)
run_manifest_prefix: data_collection/runs/D38
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: BROKEN
    note: >-
        a 38-day-stale artifact served by Metron with freshness SUPPRESSED. Suppression is
        what makes this silent rather than merely broken.
freshness:
  family: crypto
  deadline: "23:00 UTC on trading days (R2 (a), alpha-engine-config-I11812)"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: null
  floor: null
  status: not_applicable
  na_code: "N/A-NOT-IMPL"
  note: >-
      no completeness floor is declared yet. Each run manifest records the
      balances written (`rows_out`) and the per-address fetch failures
      (`address_fetch_failed` rejects) against the published wallet list
guards:
  empty_fresh:
    state: partial
    code:
      - "infrastructure/lambdas/crypto-balances/index.py::_record_run"
    records_as: data_empty_fresh
    note: >-
        SKIP path only: infrastructure/lambdas/crypto-balances/index.py::_record_run files
        guard `data_empty_fresh` `empty_fresh` when collect() returns status=skipped and the
        holdings key is not refreshed. On the ok path the key is recorded with
        rows_out=n_balances but a zero-balance write is not graded — the remaining half. Not in
        service until commissioned by an induced fault (P-19, alpha-engine-config-I10786).
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: present
    code:
      - "run_units.py::record_empty_production"
    records_as: data_success_without_output
    note: >-
        run_units.py::record_empty_production runs on every completed run that recorded no
        output and no rows: the manifest is filed `failed` (EmptyProduction) with guard
        `data_success_without_output` verdict `empty_fresh`, unless the descriptor declares
        `empty_is_valid` (then `not_applicable` with its closed-list reason). Never `ok`. The
        process exit code is unchanged; the record is the consequence. Reached through
        run_units.py::recorded_entry (its `_checked` wrapper), which this unit's entry point
        calls with its unit id. Not in service until commissioned by an induced fault (P-19,
        alpha-engine-config-I10786).
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: BROKEN
    run_record: UNVERIFIED
    detector: BROKEN
    console_entity: PRESENT
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    Ruling R2. P-23 is the interim: Metron renders the as-of and STALE rather than serving
    a 38-day-old number as current.

    alpha-engine-config-I11812 (2026-10-02) takes R2's (a) branch: re-enable at a daily
    cadence, because the crypto view is still a live consumer. Metron `main` serves
    `GET /portfolios/{id}/crypto` (`api/routers/portfolios.py` -> `crypto.for_portfolio`,
    which also records a snapshot per read) and `web/app/portfolios/[id]/crypto/page.tsx`;
    two wallet addresses are registered (`metron/crypto/wallet_addresses.json`); and the
    view received P-23 and its P-07 consumer pin in September, after the pause.
    `crypto/holdings.json` is meanwhile 56 days stale (LastModified 2026-08-07T16:17Z). The
    live Lambda's code dates from 2026-06-29, before the run-manifest work, so the same
    change ships its code on merge (`.github/workflows/deploy-crypto-balances.yml`), which
    also re-asserts the schedule's expression and state from `automation_pause.json`.
    Still open after it: unsuppressing the `crypto_holdings` row in alpha-engine-config
    `ARTIFACT_REGISTRY.yaml` with the daily cadence (a config-repo change).
