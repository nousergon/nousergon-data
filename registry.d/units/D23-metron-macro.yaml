# Unit descriptor — data collector unit D23 (metron macro).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D23
component_id: "data-collector-d23-metron-macro"
owning_repo: "nousergon-data"
title: metron macro
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/metron_market_data.py:1175"
trigger:
  kind: "step-functions"
  # Since the decoupled data cutover (alpha-engine-config-I11269; first
  # standalone EOD run 2026-09-29) this unit runs in the standalone stack's EOD
  # machine, started at 18:15 ET by the Scheduler entry below
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::EodSchedule).
  # ne-postclose-trading-pipeline (16:00 ET) no longer runs it: its data stages
  # were removed by that same change.
  owner: "ne-data-collection-eod"
  started_by: "eventbridge-scheduler:nousergon-data-collection/data-collection-eod"
  successor: "ne-data-collection-eod (nousergon-data-PR1701), ENABLED at the decoupled cutover (alpha-engine-config-I11269); v1 was ne-postclose-trading-pipeline"
  schedule: "weekdays 18:15 America/New_York"
  runs_on: "ec2-spot"
writes:
  - market_data/macro/latest.json
consumers:
  - "metron:portfolio_analytics/macro/spine_source.py"
contract:
  schema: contracts/metron_macro.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins:
    - repo: "metron"
      path: "tests/contracts/metron_macro.schema.json"
      pins: "body_schema"
      producer: "contracts/metron_macro.schema.json"
      read_site: "portfolio_analytics/macro/spine_source.py::spine_macro_events"
registry_rows:
  - metron_macro
run_manifest_prefix: data_collection/runs/D23
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: "eod-spine"
  # The family's worst-case write bound, by the same rule the weekly family
  # uses (fire + declared runtime ceiling, plan §2 row 1): the 18:15 ET fire
  # plus each verify_unit writer's SSM-online budget and declared cap,
  # 18:15 + 95 + 65 = 20:55 ET (tests/test_data_collection_stack.py::
  # test_the_eod_ordering_chain_is_derived_from_the_template). It read 18:15
  # while the schedule was 16:45; once the fire moved to 18:15 that value
  # equalled the fire time and could never be met. Still `proposed`.
  deadline: "20:55 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: declared macro series list
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: not_applicable
    na_code: "N/A-MISSING-INPUT"
    note: not priced against the equity universe; see D04
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
