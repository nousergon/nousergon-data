# Unit descriptor — data collector unit D10 (fundamentals).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D10
component_id: "data-collector-d10-fundamentals"
owning_repo: "nousergon-data"
title: fundamentals
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/fundamentals.py:526"
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:DataPhase1"
  successor: "ne-data-collection-weekly (nousergon-data-PR1701, DISABLED)"
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "archive/fundamentals/{date}.json"
consumers:
  - "crucible-research:agents/sector_teams/quant_tools.py"
  - "crucible-dashboard:health_checker.py"
contract:
  schema: "contracts/fundamentals_snapshot.schema.json"
  producer_test: tests/test_fundamentals_snapshot_contract.py
  consumer_pins:
    - "crucible-dashboard:tests/contracts/fundamentals_snapshot.schema.json"
  # P-07 (alpha-engine-config-I10873, I10934): D10 is CONNECTED
  # (crucible-dashboard health_checker.py's `fundamentals` freshness check
  # genuinely reads `archive/fundamentals/` — verified 2026-09-16, NOT the
  # stale price_cache_slim reference the issue's remainder table named for
  # D03/D10; that claim does not hold for D10). Producer side built the
  # I10873 PR: a versioned schema for the flat ticker-keyed snapshot + a
  # producer test against the REAL `collect()` write body (both the
  # real-data and NEUTRAL sentinel shapes) and a hand-built fixture. The
  # I10934 companion PR (crucible-dashboard) pins
  # `tests/contracts/fundamentals_snapshot.schema.json` (copy of this file)
  # + a contract test exercising health_checker.py's `fundamentals` check
  # (it reads the object KEY's date, not the body — the test validates
  # schema-conformant real/NEUTRAL fixtures separately) and the pin is
  # declared above.
registry_rows:
  - fundamentals_snapshot
run_manifest_prefix: data_collection/runs/D10
