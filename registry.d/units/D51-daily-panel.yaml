# Unit descriptor — data collector unit D51 (the daily panel, plan P-25).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE. Registered
# the same PR the producer module lands, because `data.inventory.writers_declared`
# turns the board red for a write site no descriptor claims — and it should.
#
# Plan amendment 1 (foundation rule architecture.d/146): the daily panel is a
# DATA-COLLECTOR product, a PHASE-3 deliverable. Every column below is graded at
# phase 3 for that reason (`clause_phase`), beside the adoption clause
# `data.phase3.daily_panel_adopted` (data_gate/panel.py). Guard clauses are
# graded at phase 2 by construction (`data_gate/clauses.py::_clause_guard`).
#
# PUBLIC REPO. Key templates and code paths only.
unit_id: D51
component_id: "data-collector-d51-daily-panel"
owning_repo: "nousergon-data"
title: "Daily panel: one long OHLCV panel per session, compiled once from ArcticDB universe"
component: 1
lifecycle: in-service
owner: brian
code_path: "builders/daily_panel.py:174"
# PROMOTED 2026-10-28 (nous-ergon-ops-I1884: the pending row expired on its
# 2026-10-27 re-exam and turned the ops registry reconciler red). The
# promotes_when condition is met, read-only, on 2026-10-28:
# data_collection/panel/2026-10-27/manifest.json (909 symbols, 374,080 rows,
# generated_at 2026-10-28T00:32Z) and its scheduled run record
# data_collection/runs/D51/2026-10-27/ (status ok, trigger scheduled) exist;
# panel/ holds every session 2026-10-14..2026-10-27 and runs/D51/ every one
# but 2026-10-21; ne-data-collection-panel's last five starts (2026-10-23 ..
# 2026-10-28) SUCCEEDED. Per promotes_when, the pending dates are dropped.
trigger:
  kind: "step-functions"
  # Its own machine, ne-data-collection-panel, started by the EventBridge rule
  # ne-data-collection-panel-on-eod when ne-data-collection-eod SUCCEEDS
  # (scheduled run or heal), so it runs after the D32 ArcticDB append it reads
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::PanelOnEodSucceededRule).
  # It is deliberately NOT a workload of the EOD machine. The eod_pnl reconcile
  # starts on that machine's terminal event, and the panel must neither delay
  # nor gate it.
  owner: "ne-data-collection-panel"
  started_by: "eventbridge-rule:ne-data-collection-panel-on-eod"
  successor: "ne-data-collection-panel (alpha-engine-config-I10791); no v1 predecessor, because v1 never published a panel"
  # No `schedule:`. The machine is event-started, not cron-started, so
  # data_gate/trigger_reconcile.py has no fire time to reconcile it against.
  # In practice it starts when the weekday 18:15 America/New_York EOD
  # collection, or a heal of it, SUCCEEDS. `on_demand: true` is the cadence
  # shape data_gate/cadence.py offers an event-started unit. A missing day
  # still surfaces through data.phase3.daily_panel_adopted.
  on_demand: true
  runs_on: "ec2-spot"
writes:
  - "data_collection/panel/{trading_day}/panel.parquet"
  - "data_collection/panel/{trading_day}/manifest.json"
  - "data_collection/panel/{trading_day}/parity.json"
  - "data_collection/panel/history/"
consumers:
  - "crucible:crucible/data/sources.py"
consumers_reason: >-
    crucible v2 data.daily (D47) reads the published panel through
    PublishedPanelSource instead of compiling its own from raw ArcticDB
    (plan amendment 1). The crucible consumer PR lands alongside or after this
    producer (architecture.d/146 rule 3).
contract:
  schema: contracts/daily_panel.schema.json
  producer_test: tests/test_daily_panel_publisher.py
  consumer_pins:
    - repo: "crucible"
      path: "tests/contracts/daily_panel.schema.json"
      pins: "body_schema"
      producer: "contracts/daily_panel.schema.json"
      read_site: "crucible/data/sources.py::PublishedPanelSource"
      note: "contracts/daily_panel.py::CONSUMER; pending the crucible consumer PR"
registry_rows:
  - data_collector_daily_panel_manifest
  - data_collector_daily_panel_parquet
  - data_collector_daily_panel_parity
# alpha-engine-config-PR12777 (ee9979d6, 2026-10-28) registered the three
# per-session keys above in ARTIFACT_REGISTRY; parity is event_driven with
# absence_expected (operator write).
run_manifest_prefix: data_collection/runs/D51
detectors:
  - kind: "sf-execution"
    via: "ne-data-collection-panel"
    state: PRESENT
    note: "verify_units D51: a missing, failed or output-less D51 manifest fails the panel execution, which pages"
  - kind: "crucible-gate"
    via: "data.phase3.daily_panel_adopted (published leg)"
    state: ABSENT
    note: "the ARTIFACT_REGISTRY rows exist (registry_rows above, alpha-engine-config-PR12777); no freshness-monitor detector is declared for this unit yet"
freshness:
  status: proposed
  ratified_at: "alpha-engine-config-I10791 (with the schedule)"
completeness:
  denominator: "every symbol in the ArcticDB universe library on the session"
  floor: 1.0
  status: proposed
  # The parity receipt is written by the operator CLI
  # (`python -m builders.daily_panel parity --consumer-panel ...`), never by the
  # scheduled run, which publishes panel.parquet + manifest.json only. Without
  # this the completion check failed every scheduled panel run with
  # output_missing (first run, 2026-10-14). The receipt is graded by
  # data.phase3.daily_panel_adopted's parity leg (data_gate/panel.py).
  operator_writes:
    - "data_collection/panel/{trading_day}/parity.json"
    # The one-off frozen history export (`builders.daily_panel history`,
    # dispatcher workload `panel-history-export`, alpha-engine-config-I12399).
    - "data_collection/panel/history/"
  note: >-
    Enforced IN THE PRODUCER: an empty per-ticker frame, a null or non-positive
    value, or no rows on the session raises before any write
    (builders/daily_panel.py::frames_to_panel, contracts/daily_panel.py::validate_panel_frame).
guards:
  empty_fresh:
    state: present
    note: "a panel with no rows on its own session, or an empty per-ticker frame, raises before any write"
  cardinality:
    state: present
    note: "an empty ticker frame is refused, never dropped; symbol counts are on the manifest"
  units:
    state: present
    note: "columns carry the _raw unit suffix; values are copied from ArcticDB unconverted"
  pit:
    state: present
    note: "the manifest records generated_at and the session; the panel is keyed by session and never overwritten in place by a later session"
  vendor_fallback:
    state: present
    note: "one store (ArcticDB universe) and no fallback path: a failed or empty read raises, it is never substituted"
  success_without_output:
    state: present
    note: "the manifest is written only after the parquet, and a manifest naming no parquet reads as an incomplete publish"
audit:
  source: "alpha-engine-config-I10791 (unit added after the 2026-09-14 baseline)"
  baseline_date: "2026-10-06"
  cells:
    identity: ABSENT
    consumers: ABSENT
    schema_contract: PRESENT
    artifact_registry: ABSENT
    observability_row: PRESENT
    run_record: ABSENT
    detector: ABSENT
    console_entity: ABSENT
    survives_phase4: ABSENT
clause_phase:
  identity: 3
  consumers: 3
  schema_contract: 3
  artifact_registry: 3
  observability_row: 3
  run_record: 3
  detector: 3
  console_entity: 3
  survives_phase4: 3
