# Unit descriptor — data collector unit D07 (universe_classification).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D07
component_id: "data-collector-d07-universe-classification"
owning_repo: "nousergon-data"
title: universe_classification
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/universe_classification.py:95"
trigger:
  kind: "step-functions"
  # Since the decoupled data cutover (alpha-engine-config-I11269) this unit runs
  # in the standalone stack's weekly machine, dispatcher workload
  # `weekly-phase-one`, started at Sat 05:00 ET by the Scheduler entry below
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::WeeklySchedule).
  # ne-weekly-freshness-pipeline no longer runs it: that change removed its
  # DataPhase1 state, so the machine's Saturday starts are not this unit's run.
  owner: "ne-data-collection-weekly"
  started_by: "eventbridge-scheduler:nousergon-data-collection/data-collection-weekly"
  successor: "ne-data-collection-weekly (nousergon-data-PR1701), ENABLED at the decoupled cutover (alpha-engine-config-I11269); v1 was ne-weekly-freshness-pipeline:DataPhase1"
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "market_data/universe_classification/{date}.json"
  - market_data/universe_classification/latest.json
consumers:
  - "crucible-research:scoring/universe_board.py"
  - "crucible-research:scoring/attractiveness_history.py"
consumers_decision:
  # alpha-engine-config-I10873: renders the consumers clause UNCONNECTED (not MET, not red,
  # graded by no gate). Delete this block in the same change that adds a surviving consumer.
  decision: kept-unconnected
  ruled_by: Brian
  ruled_on: "2026-09-15"
  ruling: >-
    Brian 2026-09-15 (alpha-engine-config-I10873): "for the decision cant we keep all for now but the console should say they exist but there are no consumers"
  reason: >-
    kept, reincorporation possible — collected and graded on every other column; its only reader is crucible-research (scoring/universe_board.py, scoring/attractiveness_history.py), a v1 repo retiring in crucible v2 phase 4, and the console shows it as unconnected so what is and is not wired stays visible.
  reexam: >-
    a v2 component proposes reading this key (reincorporate: add the consumer, delete this block), or crucible v2 phase 4 decommission review
contract:
  schema: contracts/universe_classification.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins: []
  # No `unpinned_consumers` (alpha-engine-config-I10933, 2026-10-04). It used to
  # name `crucible:crucible/data/universe.py`, carried over from the P-07 plan's
  # boundary-table row 4, which groups constituents and classification. That
  # module reads `constituents.json` (D01's key, pinned by D01's body_schema pin)
  # and never this one; no file in crucible, crucible-executor, crucible-trader,
  # crucible-backtester, crucible-dashboard, metron or nousergon-console names
  # `universe_classification`. The only readers are the two crucible-research
  # modules under `consumers` above, which `consumers_decision` already records.
  # Re-add a consumer here, as a structured pin, in the same change that
  # deletes `consumers_decision`.
registry_rows:
  - universe_classification_latest
run_manifest_prefix: data_collection/runs/D07
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: weekly
  deadline: "Sat 13:00 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: constituents
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: present
    code:
      - "weekly_collector.py::_record_phase_lineage"
    records_as: data_empty_fresh
    note: >-
        Every key this unit publishes through weekly_collector.py::_phase_collect is graded
        after the collector returns by _record_phase_lineage:
        validators/expectations.py::check_empty_fresh HEADs it and reads a missing or zero-byte
        object, or a zero row count, as `empty_fresh`; an unreported count is `unmeasurable`,
        never a pass. Filed on every manifest as guard `data_empty_fresh` plus the
        data.D07.guard.empty_fresh MetricRecord (worst key wins). Observe/enforce staging is
        declared once, in validators/expectations.py::EMPTY_FRESH_GUARD
        (alpha-engine-config-I10785). Not in service until commissioned by an induced fault
        (P-19, alpha-engine-config-I10786).
  cardinality:
    state: partial
    code:
      - "collectors/universe_classification.py::collect"
    evaluates: 'ok_ratio < _MIN_OK_RATIO'
    note: >-
        HALF: collect() returns `status: error` and writes nothing when fewer than _MIN_OK_RATIO
        (0.50) of the requested tickers came back classified, which catches a vendor collapse.
        The declared floor is 1.0 of constituents; a run between 50% and 100% publishes as `ok`,
        and that half is the remaining work. The threshold is not changed here. Not in service
        until commissioned by an induced fault (P-19, alpha-engine-config-I10786).
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: present
    code:
      - "run_units.py::record_empty_production"
    records_as: data_success_without_output
    note: >-
        run_units.py::record_empty_production runs on every completed run that recorded no
        output and no rows: the manifest is filed `failed` (EmptyProduction) with guard
        `data_success_without_output` verdict `empty_fresh`, unless the descriptor declares
        `empty_is_valid` (then `not_applicable` with its closed-list reason). Never `ok`. The
        process exit code is unchanged; the record is the consequence. Reached through
        weekly_collector.py::_phase_collect -> _record_phase_lineage. Not in service until
        commissioned by an induced fault (P-19, alpha-engine-config-I10786).
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    Its consumer fail-softs to null (universe_board.py:1024), so a collapse here is silent
    downstream — which is why the floor is 1.0 rather than a ratio.
