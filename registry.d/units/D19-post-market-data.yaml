# Unit descriptor — data collector unit D19 (post-market-data (yfinance EOD)).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D19
component_id: "data-collector-d19-post-market-data"
owning_repo: "nousergon-data"
title: "post-market-data (yfinance EOD)"
component: 1
lifecycle: "in-service"
owner: brian
code_path: "weekly_collector.py:2811 -> collectors/daily_closes.collect(yfinance_only)"
trigger:
  kind: "step-functions"
  # Since the decoupled data cutover (alpha-engine-config-I11269; first
  # standalone EOD run 2026-09-29) this unit runs in the standalone stack's EOD
  # machine, started at 18:15 ET by the Scheduler entry below
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::EodSchedule).
  # ne-postclose-trading-pipeline (16:00 ET) no longer runs it: its data stages
  # were removed by that same change.
  owner: "ne-data-collection-eod"
  started_by: "eventbridge-scheduler:nousergon-data-collection/data-collection-eod"
  successor: "ne-data-collection-eod (nousergon-data-PR1701), ENABLED at the decoupled cutover (alpha-engine-config-I11269); v1 was ne-postclose-trading-pipeline"
  schedule: "weekdays 18:15 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "staging/daily_closes/{date}.parquet"
writes_shared_with:
  - D17
consumers:
  - "crucible-executor:executor/upstream_artifact_gate.py"
  - "crucible-dashboard:loaders/s3_loader.py"
contract:
  schema: "contracts/staging_daily_closes.schema.json"
  producer_test: tests/test_staging_daily_closes_contract.py
  consumer_pins:
    - repo: "crucible-executor"
      path: "contracts/staging_daily_closes.schema.json"
      pins: "body_schema"
      producer: "contracts/staging_daily_closes.schema.json"
      read_site: "executor/upstream_artifact_gate.py"
  # P-07 (alpha-engine-config#10870): same artifact as D17 (writes_shared_with:
  # D17, same S3 key template) — see D17's descriptor for the full note. The
  # consumer pin is crucible-executor's `contracts/staging_daily_closes.schema.json`
  # (alpha-engine-config-I10796), reconciled by
  # `tests/test_contract_producer_parity.py` and pinned by
  # `tests/test_contract_staging_daily_closes.py`.
registry_rows:
  - daily_closes_parquet
run_manifest_prefix: data_collection/runs/D19
detectors:
  - kind: "eventbridge-scheduler"
    via: "eod-snapshot-existence-check"
    state: PRESENT
  - kind: "sf-execution"
    via: "ne-postclose-trading-pipeline"
    state: PRESENT
freshness:
  family: "eod-spine"
  # The family's worst-case write bound, by the same rule the weekly family
  # uses (fire + declared runtime ceiling, plan §2 row 1): the 18:15 ET fire
  # plus each verify_unit writer's SSM-online budget and declared cap,
  # 18:15 + 95 + 65 = 20:55 ET (tests/test_data_collection_stack.py::
  # test_the_eod_ordering_chain_is_derived_from_the_template). It read 18:15
  # while the schedule was 16:45; once the fire moved to 18:15 that value
  # equalled the fire time and could never be met. Still `proposed`.
  deadline: "20:55 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: metron/holdings_universe.json
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: present
    note: "the ONLY unit setting verify_artifact_exists=True (weekly_collector.py:2867)"
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: present
    note: PriceBar
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: present
    code:
      - "run_units.py::record_empty_production"
    records_as: data_success_without_output
    note: >-
        run_units.py::record_empty_production runs on every completed run that recorded no
        output and no rows: the manifest is filed `failed` (EmptyProduction) with guard
        `data_success_without_output` verdict `empty_fresh`, unless the descriptor declares
        `empty_is_valid` (then `not_applicable` with its closed-list reason). Never `ok`. The
        process exit code is unchanged; the record is the consequence. Reached through
        weekly_collector.py::_phase_collect -> _record_phase_lineage. Not in service until
        commissioned by an induced fault (P-19, alpha-engine-config-I10786).
  vendor_crosscheck:
    state: absent
    note: "writes the same key as D17 in overwrite; the source stamp and divergence metric are P-16"
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
