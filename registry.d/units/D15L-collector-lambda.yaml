notes: >-
    Plan §8.1 EXCLUSION: RETIRE. RE-MEASURED 2026-09-14 (alpha-engine-config-I10779): the
    audit's trust-drift claim (audit §3 row D15L, E-ID2: "live trust `lambda.amazonaws.com`
    != codified GitHub OIDC (`trust-policy.json:4-18`)") does NOT reproduce. Live
    (`AWS_PROFILE=ne-admin aws iam get-role --role-name alpha-engine-data-role
    --query Role.AssumeRolePolicyDocument`) and codified
    (nous-ergon-ops `infrastructure/iam/alpha-engine-data-role/trust-policy.json`, unchanged
    since its only commit b253070d) BOTH declare `{"Principal": {"Service":
    "lambda.amazonaws.com"}}` — a 12-line, single-statement document with no OIDC content at
    all; the file has never had a `trust-policy.json:4-18` GitHub-OIDC form to diff against
    (git log confirms one commit, ever). No trust-policy PR is needed — there is no drift to
    reconcile. The S3 grant half of E-ID2 ("no market_data/* grant") is also narrower than
    stated: `alpha-engine-data-role-policy.json`'s S3Access statement covers the whole
    `alpha-engine-research`/`alpha-engine-research/*` bucket (over-broad, not absent) —
    consistent with audit finding 7's separate "every data spot writer holds whole-bucket
    Delete" complaint (note: this role's statement grants Get/Put/List only, not Delete).
    RECOMMENDATION: re-verify the audit's other E-ID2-tagged rows before treating this class
    of claim as settled elsewhere in the register.
    Function deletion (operator-gated) resolves the only real gap this row had (an
    over-broad, unused execution role attached to a superseded Lambda). The row persists as
    RETIRED for its declared period rather than vanishing.
