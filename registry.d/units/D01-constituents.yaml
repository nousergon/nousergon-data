# Unit descriptor — data collector unit D01 (constituents).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D01
component_id: "data-collector-d01-constituents"
owning_repo: "nousergon-data"
title: constituents
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/constituents.py:160"
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:DataPhase1"
  successor: "ne-data-collection-weekly (nousergon-data-PR1701, DISABLED)"
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "market_data/weekly/{date}/constituents.json"
  - market_data/latest_weekly.json
  # alpha-engine-config-I10898. `collectors/constituents.py` makes FOUR
  # `s3.put_object` call sites, not two: three of them write the same body to
  # a `data/` and a `reference/price_cache/` path (the dual-path convention
  # config#934 established). All six were undeclared, which is the same class
  # of gap I10895 closed for D03/D46 — `data_gate/writer_template_check.py`
  # flagged D01 on its first fleet-wide run. Declared as written keys, not as
  # consumers: `sub_industry_map.json` is additive with no reader yet, by its
  # own code comment, and declaring a consumer it does not have would be the
  # opposite defect.
  - data/sector_map.json
  - reference/price_cache/sector_map.json
  - data/sub_industry_map.json
  - reference/price_cache/sub_industry_map.json
  - data/sub_sector_etf_map.json
  - reference/price_cache/sub_sector_etf_map.json
consumers:
  - "crucible:crucible/data/universe.py"
  - "crucible:crucible/data/point_in_time.py"
  - "crucible-executor:executor/eod_reconcile.py"
contract:
  schema: contracts/constituents.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins: []
  # alpha-engine-config-I11282: declared as a consumer pin, but names no pinned
  # contract file the gate can resolve and compare — graded as a finding.
  unpinned_consumers:
    - "crucible:crucible/data/universe.py"
registry_rows:
  - constituents_dated
  # alpha-engine-config-I10870: the row for market_data/latest_weekly.json is
  # named weekly_collector_latest_pointer, not latest_weekly — the id below
  # was never a real artifact_id (config#1239's own row comment names the
  # producer and the correct id). Corrected; the key itself was already
  # covered via the by_template match, only this id reference was stale.
  - weekly_collector_latest_pointer
run_manifest_prefix: data_collection/runs/D01
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: weekly
  deadline: "Sat 13:00 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: "previous week's constituents.json"
  floor: "week-over-week membership change <= 5% (plan §2 row 2)"
  status: proposed
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: absent
    note: "no floor against the prior week's ~900 (audit §4.1)"
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: "Read by v2 and by the trader; a contract is phase-1 work (P-07)."
