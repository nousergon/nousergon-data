arcticdb_evidence:
  via: "data_collection/probes/arctic/{trading_day}.json"
  reason: >-
      ArcticDB is unreadable from the laptop and from the gate's own identity
      (alpha-engine-config-I9771). The gate NEVER opens ArcticDB; the EOD and morning
      machines write the probe as their final workload, and the probe's own staleness is a
      clause — so a probe that stops writing makes these clauses UNMEASURABLE rather than
      stale-green.
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: UNVERIFIED
    observability_row: ABSENT
    run_record: PRESENT
    detector: UNVERIFIED
    console_entity: ABSENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    ArcticDB is unreadable from the laptop (alpha-engine-config-I9771) and the gate never
    opens it. Every ArcticDB clause reads the in-region probe record instead, and the
    probe's own staleness is a clause — so a probe that stops writing makes these
    UNMEASURABLE rather than stale-green.
