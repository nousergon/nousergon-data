# Unit descriptor — data collector unit D39 (inst_ownership).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D39
component_id: "data-collector-d39-inst-ownership"
owning_repo: "nousergon-data"
title: inst_ownership
component: 1
lifecycle: pending
owner: brian
code_path: "data/derived/inst_ownership.py:1305"
trigger:
  kind: "github-actions"
  successor: unchanged by v2 phase 4
  runs_on: "github-hosted"
  detail: ".github/workflows/inst-ownership-weekly.yml, cron 40 12 * * 6"
  # alpha-engine-config-I10871/I10870: machine-readable cadence for
  # data_gate/cadence.py::unit_cadence, which parses the EventBridge
  # `cron(m h ? * DOW *)` shape, not GHA's POSIX `schedule: - cron: '40 12 *
  # * 6'`. Verified against .github/workflows/inst-ownership-weekly.yml on
  # origin/main: `- cron: '40 12 * * 6'` — 12:40 UTC every Saturday (POSIX
  # day-of-week 6 = Saturday).
  schedule: "cron(40 12 ? * SAT *)"
writes:
  - "data/inst_ownership/{quarter}/{ticker}.parquet"
  - data/inst_ownership/latest.json
consumers:
  - "crucible-research:thinktank/context.py"
  - "crucible-research:agents/sector_teams/qual_tools.py"
contract:
  schema: "contracts/inst_ownership.schema.json"
  producer_test: tests/test_inst_ownership_contract.py
  consumer_pins:
    - "crucible:tests/contracts/inst_ownership.schema.json"
  # P-07 (alpha-engine-config#10870): the `consumers` field above (crucible-research
  # only, v1, retiring) is STALE — crucible v2's
  # crucible/data/point_in_time.py::SnapshotPointInTimeSource._load_institutional
  # reads `{prefix}/{quarter}/latest.parquet` (write_inst_ownership_parquet's
  # per-quarter sidecar) via `crucible.keys.inst_ownership_key`, verified live on
  # crucible origin/main 2026-09-15. That write key is also missing from this
  # descriptor's `writes` list above (`data/inst_ownership/{quarter}/{ticker}.parquet`
  # + `latest.json` only). Both are `consumers`/`writes` corrections — out of scope
  # here (owned by a sibling agent this session, per P-07 dispatch scope) — flagged
  # for that follow-up. This contract pins the row shape crucible already depends on.
