# Unit descriptor — data collector unit D12 (features (weekly)).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D12
component_id: "data-collector-d12-features-weekly"
owning_repo: "nousergon-data"
title: features (weekly)
component: 1
lifecycle: "in-service"
owner: brian
code_path: "features/compute.py:1103"
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:DataPhase1"
  successor: "ne-data-collection-weekly (nousergon-data-PR1701, DISABLED)"
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "features/{date}/technical.parquet"
  - "features/{date}/fundamental.parquet"
  - "features/{date}/interaction.parquet"
  - "features/{date}/macro.parquet"
  - "features/{date}/alternative.parquet"
  # alpha-engine-config-I10855 (corrected 2026-09-15): "features/{date}/factor_loading.parquet"
  # removed — no writer ever produces this key. "factor_loading" is a feature
  # GROUP materialized as ArcticDB columns (features/cross_sectional.py::
  # materialize_factor_loading_zscores / update_factor_loading_zscores_latest,
  # wired via builders/daily_append.py), not a standalone S3 parquet snapshot;
  # `features/writer.py::write_feature_snapshot` only ever writes the 5 groups
  # above (features/registry.py::GROUPS). The completion check could never
  # have passed for this unit while this entry stood, regardless of the
  # recording fix — no run writes this path.
consumers:
  - "crucible-research:scoring/factor_scoring.py"
  - "crucible-research:data/fetchers/feature_store_reader.py"
  - "crucible-dashboard:views/13_Feature_Store.py"
contract:
  schema:
    - "features/registry.py::CATALOG <-> SCHEMA.md §3"
    - "contracts/feature_registry.schema.json"
  # LIST value (two schemas): the pre-existing per-COLUMN parquet contract
  # (unchanged) plus a new versioned JSON Schema for the SEPARATE
  # features/registry.json artifact — see below. data_gate/evidence.py only reads a
  # scalar today (the D37 defect, PR1747/a63bbb0b); a sibling in the data_gate track
  # is extending it to lists.
  producer_test:
    - tests/test_schema_contract.py
    - tests/test_feature_registry_contract.py
  consumer_pins:
    - "crucible-dashboard:tests/contracts/feature_registry.schema.json"
  # P-07 (alpha-engine-config#10870): schema/producer_test for the per-column parquet
  # contract already existed pre-PR. The coupling artifact
  # crucible-dashboard views/13_Feature_Store.py actually reads via S3 GET is
  # `features/registry.json` (features/registry.py::generate_registry_json/
  # upload_registry, a serialization of CATALOG) — it had no versioned JSON Schema
  # of its own before this PR. contracts/feature_registry.schema.json +
  # tests/test_feature_registry_contract.py (validates the REAL live CATALOG
  # serialization) formalize it, and the dashboard pins a copy in the same PR.
registry_rows:
  - feature_store_freshness_sentinel
run_manifest_prefix: data_collection/runs/D12
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: weekly
  deadline: "Sat 13:00 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: "constituents - declared exclusions"
  floor: 0.95
  status: proposed
  # alpha-engine-config-I10787 (P-20): the per-key ABSOLUTE floor the run-manifest
  # completion check grades `outputs[].rows_out` against. Distinct from `floor`
  # above, which is a RATIO against a denominator the check cannot resolve.
  # N/A-NOT-IMPL because this unit's collector reports no row count on its success
  # path at all — the same measured fact `run_units.PhaseUnit.rows_key = None`
  # already records, which makes its manifest `rows_out` a constant 0 rather than
  # a measurement. Grading a constant against a floor tests the constant. The key
  # is still graded on PRESENCE. Lifting this to a real floor is P-13
  # (alpha-engine-config-I5935), which is also what gives the collector a count.
  rows_out_floor: null
  rows_out_floor_na_code: "N/A-NOT-IMPL"
guards:
  empty_fresh:
    state: present
    note: >-
        zero-variance postflight marks `degraded` and ERROR-logs by column, but exits 0
        (alpha-engine-config-I7572)
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: present_static
    note: >-
        the units-suffix rule is CI-only (tests/test_schema_contract.py); no write-time
        assertion. This is the avg_volume_20d class. P-14.
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: broken
    note: "`degraded` reaches the EOD SF as success"
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
