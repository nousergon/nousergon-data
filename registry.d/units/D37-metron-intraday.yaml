# Unit descriptor — data collector unit D37 (metron-intraday).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D37
component_id: "data-collector-d37-metron-intraday"
owning_repo: "nousergon-data"
title: "metron-intraday"
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/metron_market_data.py:2222 (--only-intraday)"
trigger:
  kind: "systemd-timer"
  owner: dashboard box
  successor: unchanged by v2 phase 4
  runs_on: "ec2-on-demand"
  detail: "metron-intraday.timer, *:00/5:00, NYSE-session gated"
writes:
  - market_data/intraday/latest.json
  - market_data/intraday/technical_ratings.json
consumers:
  - "metron:api/services/market_snapshot.py"
  - "metron:api/services/technical_rating.py"
contract:
  schema:
    - contracts/technical_ratings.schema.json
    - contracts/metron_intraday_latest.schema.json
  producer_test:
    - tests/test_technical_rating_contracts.py
    - tests/test_p07_contracts.py
  consumer_pins:
    - "metron:tests/contracts/technical_ratings.schema.json"
    - "metron:tests/contracts/metron_intraday_latest.schema.json"
registry_rows: []
run_manifest_prefix: data_collection/runs/D37
detectors:
  - kind: "box-timer-health"
    via: "timer-level exit/streak"
    state: PRESENT
  - kind: "code-refusal"
    via: "empty-write refusal (metron_market_data.py:2331-2348)"
    state: PRESENT
freshness:
  family: intraday
  deadline: "age <= 10 minutes in >= 99% of session slots"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: declared indices + fund proxies
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: present
    note: >-
        refuses to overwrite latest.json when indices or fund proxies are empty; dedicated
        .venv-intraday. This is the guard that would have caught the 2026-07-29
        pandas-less venv writing empty artifacts every 5 minutes.
  cardinality:
    state: not_applicable
    na_code: "N/A-MISSING-INPUT"
    note: >-
        empty quotes are legitimate for zero holdings; the index and proxy floor above is
        the graded denominator
  units:
    state: present
    note: technical_ratings.schema.json
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: present
    note: same refusal
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: ABSENT
    observability_row: ABSENT
    run_record: ABSENT
    detector: PRESENT
    console_entity: ABSENT
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    The audit's §7 correction: this unit writes TWO keys, and the descriptor declares
    both. Run record ABSENT (journald only) and no registry row at all. P-06, P-09.
