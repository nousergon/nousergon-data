# Unit descriptor — data collector unit D49 (Nasdaq-100 membership + weights).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# WHY THIS FILE EXISTS: the data gate's writer-inventory clause caught
# `collectors/nasdaq100.py` as a write site with no descriptor and no declared
# parent, which is exactly what `data_gate/config/writer_inventory.yaml`'s own
# header says that clause is for — "a new collector with no descriptor turns the
# board red on its own" is "the only mechanism in this design that notices a
# unit nobody registered". This unit has no parent; it is its own producer. So
# the response is the descriptor, not an entry in the scope that hides it.
#
# LIFECYCLE IS `pending`, AND THAT IS THE POINT. The module is complete and
# unit-tested but NOTHING RUNS IT: it has no trigger yet. Declaring
# `in-service` would claim a component the console's discovery cannot find, and
# declaring a cadence would make the freshness monitor report a false
# `state=missing` every cycle — the opposite of the signal it exists for.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D49
component_id: "data-collector-d49-nasdaq100-constituents"
owning_repo: "nousergon-data"
title: "Nasdaq-100 membership + per-constituent weight"
component: 1
lifecycle: pending
owner: brian
code_path: "collectors/nasdaq100.py:328"
# RE-EXAMINED 2026-10-14 on a CHANGED reason: the trigger is in this change.
# History: declared pending 2026-09-21 (re-exam 2026-10-05); re-declared
# 2026-10-06 (re-exam 2026-10-20) because nothing scheduled it. This window
# no longer waits on scheduling. It waits on the first scheduled run's
# artifact, which promotes_when names. pending_since + 14 days is the ops
# ceiling (PENDING_MAX_DAYS); the window spans two Saturday weekly runs.
pending_since: "2026-10-14"
lifecycle_reexam: "2026-10-28"
lifecycle_reason: >-
    SCHEDULED by alpha-engine-config-I11306: `weekly_collector.py
    --nasdaq100-constituents` (run-manifest-wrapped) runs on
    ne-data-collection-panel, started by the rule
    ne-data-collection-ndx-constituents-on-weekly when
    ne-data-collection-weekly SUCCEEDS, after D10 has written the
    fundamentals archive its weights read. D49 is that execution's only
    verify_unit. The unit stays pending until a scheduled run has published
    market_data/index_constituents/NDX.json with a current date
    (promotes_when).
lifecycle_owner: brian
promotes_when: >-
    A scheduled ne-data-collection-panel execution has filed an ok D49 run
    manifest, and market_data/index_constituents/NDX.json exists with a current
    `date`. The cadence is already declared (trigger below), so the promotion
    PR flips lifecycle to in-service, drops the pending dates, and clears the
    two registry rows' declared-off block (see registry_rows below).
trigger:
  kind: "step-functions"
  # Its own execution on ne-data-collection-panel, started by the EventBridge
  # rule ne-data-collection-ndx-constituents-on-weekly when
  # ne-data-collection-weekly SUCCEEDS (scheduled run or rerun)
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::NdxConstituentsOnWeeklySucceededRule).
  # The weekly membership cadence beside D01, after D10's fundamentals archive.
  # Not a workload of the weekly machine, so a D49 failure (Nasdaq's endpoint
  # refusing the box) pages as D49 and never fails the weekly collection.
  owner: "ne-data-collection-panel"
  started_by: "eventbridge-rule:ne-data-collection-ndx-constituents-on-weekly"
  successor: "ne-data-collection-panel (alpha-engine-config-I11306); no v1 predecessor, because v1 never published NDX membership"
  # No `schedule:`. The machine is event-started, so
  # data_gate/trigger_reconcile.py has no fire time to reconcile it against.
  # In practice it starts when the Saturday 05:00 America/New_York weekly
  # collection, or a rerun of it, SUCCEEDS. `on_demand: true` is the cadence
  # shape data_gate/cadence.py offers an event-started unit.
  on_demand: true
  runs_on: "ec2-spot"
writes:
  # Key TEMPLATES, not globs: shadow.parity.resolve_contract matches a
  # templated key against a contract's x-key-pattern, and a bare `*` resolves
  # to NOTHING — a glob would declare a write whose contract cannot be found,
  # which is what
  # test_declared_contracts_are_reachable_from_their_keys.py exists to catch.
  - market_data/index_constituents/NDX.json
  - "market_data/weekly/{date}/NDX.json"
consumers:
  - "nousergon-data:collectors/index_contributions.py (D48, alpha-engine-config-I11297)"
consumers_reason: >-
    The declared consumer is D48, the per-constituent index contribution
    producer, which reads this file's weight_map for the NDX leg. Downstream of
    that is metron (metron-ops-I346), but it reads D48's artifact rather than
    this one — so the pin below names the direct reader, not the eventual one.
contract:
  schema: contracts/ndx_constituents.schema.json
  producer_test: tests/test_nasdaq100.py
  consumer_pins:
    - repo: "nousergon-data"
      path: "tests/test_ndx_constituents_consumer_contract.py"
      pins: "in_repo_reader"
      read_site: "collectors/index_contributions.py::_default_weights_source"
      note: "D48, in-repo consumer; the test feeds the real producer's body to the real reader"
registry_rows:
  - ndx_constituents_latest
  - ndx_constituents_dated
# alpha-engine-config-I11307 / I11282 (C11, 2026-10-02): both rows are
# registered and DECLARED OFF against alpha-engine-config-I11306, which clears
# on the `index_contribution_producers_scheduled` milestone. Flipping this unit
# to in-service while they are still declared off reads `artifact_registry` as
# parked, so the promotion PR has to clear them.
run_manifest_prefix: data_collection/runs/D49
detectors:
  - kind: "sf-execution"
    via: "ne-data-collection-panel"
    state: PRESENT
    note: "verify_units D49: a missing, failed or output-less D49 manifest fails its execution, which pages"
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: ABSENT
    note: "row registered but declared off until alpha-engine-config-I11306 schedules the producer; the monitor grades nothing before then"
freshness:
  family: "weekly-membership"
  status: proposed
  ratified_at: "alpha-engine-config-I11306 (with the trigger)"
completeness:
  denominator: "Nasdaq-100 published membership (101 securities, dual share classes)"
  floor: 1.0
  status: proposed
  note: >-
    Enforced IN THE PRODUCER: a membership count outside [100, 102] raises before
    any write. 101 is the published cardinality — 100 companies, 101 securities —
    so a hard-coded 100 would fail on the dual-class pair.
guards:
  empty_fresh:
    state: present
    note: "count-range refusal before write; an empty roster cannot be published"
  cardinality:
    state: present
    note: "membership count outside [100, 102] raises (_validate_membership_count)"
  units:
    state: present
    note: >-
        weights are normalised fractions over the weighted subset, with the raw sum
        recorded; weight_method distinguishes the source rung.
  pit:
    state: present
    note: >-
        dated snapshot at market_data/weekly/{date}/NDX.json alongside the latest
        pointer, so membership becomes point-in-time from the first run.
  vendor_fallback:
    state: present
    note: >-
        Declared rung ladder with the selected rung recorded as weight_method, and
        invesco_status recording the measured 406 rather than hiding the fallback.
        MEASURED 2026-09-21: the Invesco host refuses this client on every path,
        including the plain HTML product pages, so rung 2 is what actually runs and
        weights are modified_cap_approx until a licensed feed lands.
  success_without_output:
    state: present
    note: "count-range and market-cap-coverage checks precede the write"
audit:
  source: "alpha-engine-config-I11296 (unit added after the 2026-09-14 baseline)"
  baseline_date: "2026-09-21"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: ABSENT
    observability_row: ABSENT
    run_record: ABSENT
    detector: ABSENT
    console_entity: UNVERIFIED
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
