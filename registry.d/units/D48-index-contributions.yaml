# Unit descriptor — data collector unit D48 (per-constituent index contribution).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# WHY THIS FILE EXISTS AT ALL, rather than an entry in
# `data_gate/config/writer_inventory.yaml`: that file's own header says a new
# collector with no descriptor turning the board red "is the only mechanism in
# this design that notices a unit nobody registered", and that attributing a
# module to a parent ATTRIBUTES its writes rather than excusing them. This unit
# has no parent — it is its own producer — so the honest response to the gate
# was to write the descriptor, not to widen the scope that hides it.
#
# LIFECYCLE IS `pending`, AND THAT IS THE POINT. The module is complete and
# unit-tested but NOTHING RUNS IT: the trigger and the ops-side rows are
# operational assembly and land in the ops repos, tracked as
# alpha-engine-config-I11306. Declaring `in-service` here would claim a
# component the console's discovery cannot find, and declaring a cadence would
# make the freshness monitor report a false `state=missing` every cycle — the
# opposite of the signal it exists for. `pending` says "registered, not yet
# running", which is a work item with an address rather than a silent gap.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D48
component_id: "data-collector-d48-index-contributions"
owning_repo: "nousergon-data"
title: "per-constituent index contribution"
component: 1
lifecycle: pending
owner: brian
code_path: "collectors/index_contributions.py:1"
# RE-EXAMINED 2026-10-29 on a CHANGED reason (alpha-engine-config-I11306).
# History: declared pending 2026-09-21 (re-exam 2026-10-05); re-declared
# 2026-10-06 (re-exam 2026-10-20) because nothing scheduled it; re-declared
# 2026-10-14 (re-exam 2026-10-28) when the trigger landed, to wait on the
# first scheduled run. That wait is OVER: promotes_when is met (see
# lifecycle_reason). This window waits only on the coordinated promotion,
# whose alpha-engine-config half has to land first or with it.
# pending_since + 14 days is the ops ceiling (PENDING_MAX_DAYS).
pending_since: "2026-10-29"
lifecycle_reexam: "2026-11-12"
lifecycle_reason: >-
    SCHEDULED by alpha-engine-config-I11306 and PRODUCING: `weekly_collector.py
    --index-contributions` runs on ne-data-collection-panel, started by the
    rule ne-data-collection-index-contributions-on-eod when
    ne-data-collection-eod SUCCEEDS. Measured read-only 2026-10-29: status-ok
    scheduled D48 run manifests for trading days 2026-10-22, 23, 26, 27 and 28
    under data_collection/runs/D48/, and
    market_data/index_contributions/{SPX,NDX}/latest.json both at trading_day
    2026-10-28. So promotes_when is met. The unit stays pending only because
    the promotion is cross-repo and is not yet ready on the
    alpha-engine-config side (blocker, tracked on alpha-engine-config-I11306):
    its two ARTIFACT_REGISTRY rows are still declared_off against I11306 with
    `produced_by: manual`, and their eod_sf cadence and 120-minute SLA predate
    the trigger, while the run lands about 20:30-20:40 ET; and
    cross-repo-checks/test_producer_registry_contract.py does not match the
    registry's `*` segment against this descriptor's `{index}` placeholder the
    way data_gate/unit_readers.py does. Flipping this unit to in-service before
    those land reads artifact_registry as parked here and turns that check red
    there. The NDX leg is live: D49 has published, so a missing or stale NDX.json
    makes the run partial and pages.
lifecycle_owner: brian
promotes_when: >-
    A scheduled ne-data-collection-panel execution has filed an ok D48 run
    manifest, and market_data/index_contributions/{SPX,NDX}/latest.json exists
    with that session's trading_day. The cadence is already declared (trigger
    below), so the promotion PR flips lifecycle to in-service, drops the pending
    dates, and clears the two registry rows' declared-off block (see
    registry_rows below).
    Measured MET on 2026-10-29 (see lifecycle_reason). What is still
    outstanding is the alpha-engine-config half (alpha-engine-config-I11306):
    the two ARTIFACT_REGISTRY rows lose `declared_off`, name
    ne-data-collection-panel as producer, and carry a cadence and SLA
    re-checked against the landed trigger; and
    cross-repo-checks/test_producer_registry_contract.py matches a registry
    `*` segment against a descriptor placeholder the way
    data_gate/unit_readers.py does. The promotion PR here lands with or after
    that change.
trigger:
  kind: "step-functions"
  # Its own execution on ne-data-collection-panel, started by the EventBridge
  # rule ne-data-collection-index-contributions-on-eod when
  # ne-data-collection-eod SUCCEEDS (scheduled run or heal), so it runs after
  # the D32 ArcticDB append it reads
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::IndexContributionsOnEodSucceededRule).
  # Not a workload of the EOD machine, whose terminal event starts the eod_pnl
  # reconcile, and not a second workload of the D51 execution, so a D48
  # failure pages as D48 alone. IN-REGION on a data-spot box: the job reads the
  # close archive, and a read that size from outside the bucket's region is
  # dominated by S3 round-trip latency (measured 2026-07-15: a 20-40 minute
  # in-region job took 3+ hours locally).
  owner: "ne-data-collection-panel"
  started_by: "eventbridge-rule:ne-data-collection-index-contributions-on-eod"
  successor: "ne-data-collection-panel (alpha-engine-config-I11306); no v1 predecessor, because v1 never published the decomposition"
  # No `schedule:`. The machine is event-started, so
  # data_gate/trigger_reconcile.py has no fire time to reconcile it against.
  # In practice it starts when the weekday 18:15 America/New_York EOD
  # collection, or a heal of it, SUCCEEDS. `on_demand: true` is the cadence
  # shape data_gate/cadence.py offers an event-started unit.
  on_demand: true
  runs_on: "ec2-spot"
writes:
  # Key TEMPLATES, not globs: shadow.parity.resolve_contract matches a
  # templated key against a contract's x-key-pattern, and a bare `*` resolves
  # to NOTHING — so a glob here would declare a write whose contract could not
  # be found, which is the exact gap
  # test_declared_contracts_are_reachable_from_their_keys.py exists to catch.
  - "market_data/index_contributions/{index}/{date}.json"
  - "market_data/index_contributions/{index}/latest.json"
consumers:
  - "metron:api/services/benchmark_gap.py (metron-ops-I346, reads latest.json)"
consumers_reason: >-
    The consumer is cross-repo and lands alongside this producer rather than
    after it: metron-ops-I346 is the reason this artifact exists. Metron is a
    pure S3 consumer and makes no market-data calls of its own, which is why the
    weight-times-return join lives here and not there.
contract:
  schema: contracts/index_contributions.schema.json
  producer_test: tests/test_index_contributions.py
  consumer_pins:
    - repo: "metron"
      path: "tests/contracts/index_contributions.schema.json"
      pins: "body_schema"
      producer: "contracts/index_contributions.schema.json"
      read_site: "portfolio_analytics/index_contributions/spine_source.py::spine_index_contributions"
  # alpha-engine-config-I11282 (C11, 2026-10-02): metron-PR526. The artifact
  # has never been written (this unit is pending, I11306), so the consumer
  # fixture is built from this schema and its stated unit identity rather
  # than sampled.
registry_rows:
  - index_contributions_dated
  - index_contributions_latest
# alpha-engine-config-I11282 (C11, 2026-10-02): both rows are registered and
# DECLARED OFF against alpha-engine-config-I11306, which clears on the
# `index_contribution_producers_scheduled` milestone. That keeps the original
# deferral's point (no false state=missing for a producer nothing runs) while
# giving the gate rows to grade. The registry spells the `{index}` segment `*`.
# Flipping this unit to in-service while the rows are still declared off reads
# `artifact_registry` as parked (data_gate/unit_readers.py::_parked), so the
# promotion PR has to clear them.
run_manifest_prefix: data_collection/runs/D48
detectors:
  - kind: "sf-execution"
    via: "ne-data-collection-panel"
    state: PRESENT
    note: "verify_units D48: a missing, failed or output-less D48 manifest fails its execution, which pages"
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: ABSENT
    note: "row registered but declared off until alpha-engine-config-I11306 schedules the producer; the monitor grades nothing before then"
freshness:
  family: "eod-spine"
  status: proposed
  ratified_at: "alpha-engine-config-I11306 (with the trigger)"
completeness:
  denominator: "index membership (constituents.json weight_map, index_constituents/NDX.json)"
  floor: 0.97
  status: proposed
  note: >-
    Enforced IN THE PRODUCER as COVERAGE_FLOOR, not only proposed on this board:
    collect() raises rather than publishing when less than this fraction of
    index weight has a usable return. A decomposition missing a tenth of the
    index explains nothing and must not reach a consumer looking authoritative.
guards:
  empty_fresh:
    state: present
    note: >-
        An empty weight map is refused rather than published as an index that moved
        0% (index_contributions.py, the `not weights.weight_map` branch) — which is
        what makes constituents' own cache_no_weights declaration load-bearing.
  cardinality:
    state: present
    note: "COVERAGE_FLOOR refusal plus coverage.members_missing_return in the payload"
  units:
    state: present
    note: >-
        contracts/index_contributions.schema.json bounds weights to [0,1] fractions
        and names contribution_pp/return_pct as percentage points; the producer
        consumes weights as fractions and emits pp, tested in
        tests/test_index_contributions.py.
  pit:
    state: present
    note: >-
        Weights are taken as of the PRIOR close and the trading-day pair is read off
        the proxy's own observed series rather than a calendar, so a multi-day return
        cannot be labelled as one day (a proxy with fewer than two closes raises).
  vendor_fallback:
    state: absent
    note: >-
        Single path per input: weights from the weight producers, member returns from
        ArcticDB, and each index proxy from the ONE source its IndexSpec.proxy_source
        declares (SPY: ArcticDB universe; QQQ: D21's market_data/close_history/QQQ.json,
        because universe does not hold QQQ). Nothing falls through to a second source,
        and the honest response to a missing input is the refusal above rather than a
        substitute.
  success_without_output:
    state: present
    note: >-
        collect() raises when no index produced a publishable decomposition, and
        returns status=partial (never `ok`) when one index failed — the per-index
        soft-fail records the error in the return value rather than swallowing it.
audit:
