# Unit descriptor — data collector unit D46 (insider_transactions (Form 4)).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D46
component_id: "data-collector-d46-insider-transactions"
owning_repo: "nousergon-data"
title: insider_transactions (Form 4)
component: 1
lifecycle: "in-service"
owner: brian
code_path: "rag/pipelines/ingest_form4.py:559"
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:RAGIngestion"
  successor: >-
    nousergon-data-collection/data-collection-weekly, dispatcher workload
    `rag-weekly-ingestion` (alpha-engine-config-I10753) — SAME shared key as
    D16, step 6 (`rag.pipelines.ingest_form4`) of the unchanged
    run_weekly_ingestion.sh. No separate dispatcher key: it is a substep of
    that one script, not a standalone entry point, and a second key would
    double-fetch the same EDGAR Form 4 filings each week.
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  # alpha-engine-config-I10895: corrected from the never-produced
  # "data/insider_transactions/{date}.parquet". `rag/pipelines/ingest_form4.py`'s
  # `write_form4_parquet` (DEFAULT_S3_PREFIX = "data/insider_transactions") uses
  # `nousergon_lib.eval_artifacts` — one dated artifact per run (YYMMDDHHMM +
  # "_result.parquet", per `new_eval_run_id`/`eval_artifact_key`) plus the
  # operator-UX `latest.json` sidecar (`eval_latest_key`) on every invocation. Both are
  # declared so parity pairs the unit by run manifest (alpha-engine-config-I10890) instead
  # of the retired date-partitioned scheme.
  - "data/insider_transactions/{run_stamp}_result.parquet"
  - "data/insider_transactions/latest.json"
consumers:
  - "crucible-research:data/substrate/reader.py"
  - "crucible-research:thinktank/analyst.py"
consumers_decision:
  # alpha-engine-config-I10873: renders the consumers clause UNCONNECTED (not MET, not red,
  # graded by no gate). Delete this block in the same change that adds a surviving consumer.
  decision: kept-unconnected
  ruled_by: Brian
  ruled_on: "2026-09-15"
  ruling: >-
    Brian 2026-09-15 (alpha-engine-config-I10873): "for the decision cant we keep all for now but the console should say they exist but there are no consumers"
  reason: >-
    kept, reincorporation possible — collected and graded on every other column; its only readers are v1 repos retiring in crucible v2 phase 4, and the console shows it as unconnected so what is and is not wired stays visible.
  reexam: >-
    a v2 component proposes reading this key (reincorporate: add the consumer, delete this block), or crucible v2 phase 4 decommission review
contract:
  schema: null
  producer_test: null
  consumer_pins: []
registry_rows: []
# alpha-engine-config-I10753: points at D16's manifest, not a `D46`-shaped
# prefix of its own. D46 has no standalone dispatcher entry point (see
# trigger.successor) — `rag.pipelines.run_weekly_ingestion_recorded` (D16's
# wrapper) records D46's declared `writes:` keys into the SAME
# `data_run_manifest.v1` it already writes for D16
# (`OUTPUT_PREFIXES` includes `data/insider_transactions/`). The dispatcher's
# completion check reads `run_manifest_prefix` per-unit
# (`index.py::_check_unit`), so naming "D46" in a schedule's `verify_units`
# grades these same keys against D46's own `writes:`/floor without a second
# manifest or a second script run.
run_manifest_prefix: data_collection/runs/D16
