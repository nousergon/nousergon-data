notes: >-
    alpha-engine-config-I10753: covered by the `rag-weekly-ingestion` workload
    (shared with D16, see `trigger.successor`) — no standalone dispatcher key.
    D46 is now named in the `weekly` schedule's `verify_units`
    (`infrastructure/cloudformation/nousergon-data-collection.yaml`) and its
    `run_manifest_prefix` points at D16's manifest (see the field's own
    comment above) — without this, `data_gate.standalone.read_survives_phase4`
    read D46 as having no covering schedule at all (neither a workload nor a
    recorded retirement), which is a real UNMET, not the same
    schedule-still-DISABLED UNMET D15/D16 read pre-cutover. Verified live via
    `python -m data_gate read --gate data-cutover-ready --dry-run` on
    2026-09-16: D15/D16 now UNMET only on "schedule DISABLED" (expected,
    cutover-gated); D46 was UNMET on "no schedule ... lists it in
    verify_units" before this fix. Its consumer's survival past phase 4 is
    confirmed at the data-cutover-ready gate, not assumed here.
