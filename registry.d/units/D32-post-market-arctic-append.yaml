# Unit descriptor — data collector unit D32 (post-market-arctic-append).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D32
component_id: "data-collector-d32-post-market-arctic-append"
owning_repo: "nousergon-data"
title: "post-market-arctic-append"
component: 1
lifecycle: "in-service"
owner: brian
code_path: "builders/daily_append.py:2960"
trigger:
  kind: "step-functions"
  # Since the decoupled data cutover (alpha-engine-config-I11269; first
  # standalone EOD run 2026-09-29) this unit runs in the standalone stack's EOD
  # machine, started at 18:15 ET by the Scheduler entry below
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::EodSchedule).
  # ne-postclose-trading-pipeline (16:00 ET) no longer runs it: its data stages
  # were removed by that same change.
  owner: "ne-data-collection-eod"
  started_by: "eventbridge-scheduler:nousergon-data-collection/data-collection-eod"
  successor: "ne-data-collection-eod (nousergon-data-PR1701), ENABLED at the decoupled cutover (alpha-engine-config-I11269); v1 was ne-postclose-trading-pipeline"
  schedule: "weekdays 18:15 America/New_York"
  runs_on: "ec2-spot"
writes:
  - arcticdb/universe (library)
consumers:
  - "crucible:crucible/data/sources.py"
contract:
  schema: contracts/arctic_universe.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins:
    - repo: "crucible"
      path: "tests/contracts/arctic_universe.schema.json"
      pins: "body_schema"
      producer: "contracts/arctic_universe.schema.json"
      read_site: "crucible/data/sources.py::ArcticPriceSource.load_panel"
  target: "contracts/arctic_universe.schema.json, pinned in crucible (P-07)"
registry_rows:
  - feature_store_freshness_sentinel (indirect)
run_manifest_prefix: data_collection/runs/D32
detectors:
  - kind: "cloudwatch-alarm"
    via: "eod-precondition-probe + heal loop"
    state: PRESENT
    # Subject for the detector reader (alpha-engine-config-I10795, A3), verified 2026-10-07.
    # No CloudWatch alarm carries this path. The probe (alpha-engine-eod-precondition-probe)
    # reads the sentinels D32 writes; on a gap, ne-postclose-reconcile-pipeline's
    # SkipEODReconcileDataGap state publishes "Alpha Engine EOD Reconcile SKIPPED (data
    # gap, self-healing)" to alpha-engine-alerts and enters the heal loop. The subject is
    # that publishing state (live definition read 2026-10-07).
    subject: "ne-postclose-reconcile-pipeline:SkipEODReconcileDataGap"
freshness:
  family: "eod-spine"
  # The family's worst-case write bound, by the same rule the weekly family
  # uses (fire + declared runtime ceiling, plan §2 row 1): the 18:15 ET fire
  # plus each verify_unit writer's SSM-online budget and declared cap,
  # 18:15 + 95 + 65 = 20:55 ET (tests/test_data_collection_stack.py::
  # test_the_eod_ordering_chain_is_derived_from_the_template). It read 18:15
  # while the schedule was 16:45; once the fire moved to 18:15 that value
  # equalled the fire time and could never be met. Still `proposed`.
  deadline: "20:55 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: "constituents - delisted"
  floor: 0.99
  status: proposed
  # alpha-engine-config-I10787 (P-20): the per-key ABSOLUTE floor the run-manifest
  # completion check grades `outputs[].rows_out` against. Distinct from `floor`
  # above, which is a RATIO against a denominator the check cannot resolve.
  # N/A-NOT-IMPL because this unit's collector reports no row count on its success
  # path at all — the same measured fact `run_units.PhaseUnit.rows_key = None`
  # already records, which makes its manifest `rows_out` a constant 0 rather than
  # a measurement. Grading a constant against a floor tests the constant. The key
  # is still graded on PRESENCE. Lifting this to a real floor is P-13
  # (alpha-engine-config-I5935), which is also what gives the collector a count.
  rows_out_floor: null
  rows_out_floor_na_code: "N/A-NOT-IMPL"
guards:
  empty_fresh:
    state: present
    code:
      - "weekly_collector.py::_record_phase_lineage"
      - "weekly_collector.py::_record_mode_lineage"
    records_as: data_empty_fresh
    note: >-
        Graded on both of its paths: the ('daily', 'arcticdb') phase through
        weekly_collector.py::_phase_collect -> _record_phase_lineage (ArcticDB library output
        graded on its measured count), and the daily_arctic_append mode through
        _run_whole_mode_unit -> _record_mode_lineage (zero rows -> `empty_fresh`, unreported ->
        `unmeasurable`). Filed as guard `data_empty_fresh`. Observe/enforce staging is declared
        once, in validators/expectations.py::EMPTY_FRESH_GUARD (alpha-engine-config-I10785).
        Not in service until commissioned by an induced fault (P-19,
        alpha-engine-config-I10786).
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: partial
    code:
      - "builders/daily_append.py::_daily_append_impl"
    evaluates: 'if splice_verdict == "refused":'
    note: >-
        HALF, price scale only: every incoming bar goes through _splice_basis_guard, which
        restates it onto the stored basis when a registered split explains the gap and refuses
        it when a split-like ratio disagrees with a stored same-date row; a refused ticker is
        counted as quality-blocked and not appended. A pure append with an unexplained
        split-like ratio is written at ERROR, and the appended feature columns' units have no
        runtime check; both are the remaining work. Not in service until commissioned by an
        induced fault (P-19, alpha-engine-config-I10786).
  pit:
    state: present
    note: UniverseFreshnessViolation
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: present
    note: exits 1 on append failure
arcticdb_evidence:
  via: "data_collection/probes/arctic/{trading_day}.json"
  reason: >-
      ArcticDB is unreadable from the laptop and from the gate's own identity
      (alpha-engine-config-I9771). The gate NEVER opens ArcticDB; the EOD and morning
      machines write the probe as their final workload, and the probe's own staleness is a
      clause — so a probe that stops writing makes these clauses UNMEASURABLE rather than
      stale-green.
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
