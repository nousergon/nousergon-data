# Unit descriptor — data collector unit D43 (manual repair builders).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D43
component_id: "data-collector-d43-manual-repair-builders"
owning_repo: "nousergon-data"
title: manual repair builders
component: 1
lifecycle: "in-service"
owner: brian
code_path: >-
    builders/splice_rebase.py:189, builders/repair_macro_series.py:285,
    builders/purge_phantom_day.py:72, collectors/daily_closes_fred_repair.py:342,
    corporate_actions/
trigger:
  kind: manual
  owner: operator CLI
  successor: code survives; it has no trigger to lose
  runs_on: "in-region only (alpha-engine-config-I9771)"
writes:
  - arcticdb/universe (library)
  - arcticdb/macro (library)
consumers:
  - "crucible:crucible/data/sources.py (via the parent libraries)"
contract:
  schema: contracts/arctic_universe.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins:
    - "crucible:crucible/data/sources.py::ArcticPriceSource"
  target: "none — it writes D13's libraries, under D13's contract"
registry_rows: []
run_manifest_prefix: data_collection/runs/D43
detectors: []
freshness:
  na_code: "N/A-NOT-RUN"
  note: "manual CLI, no trigger"
  status: not_applicable
completeness:
  denominator: null
  floor: null
  status: not_applicable
  na_code: "N/A-NOT-RUN"
  note: "manual repair, no denominator"
guards:
  empty_fresh:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
  cardinality:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
  units:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
  pit:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
  vendor_fallback:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
  success_without_output:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: >-
        manual_writes_parent_library — these tools write D13's libraries and are graded by
        D13's guards; a second guard here would grade the same write twice
arcticdb_evidence:
  via: "data_collection/probes/arctic/{trading_day}.json"
  reason: >-
      ArcticDB is unreadable from the laptop and from the gate's own identity
      (alpha-engine-config-I9771). The gate NEVER opens ArcticDB; the EOD and morning
      machines write the probe as their final workload, and the probe's own staleness is a
      clause — so a probe that stops writing makes these clauses UNMEASURABLE rather than
      stale-green.
partial_exclusion:
  columns:
    - schema_contract
    - artifact_registry
    - detector
    - console_entity
  na_code: "N/A-NOT-RUN"
  reason: >-
      manual_writes_parent_library — plan §8.1 PARTIAL EXCLUSION: no trigger and no
      artifact of its own. It still carries identity (P2: in-region under the component
      role only, alpha-engine-config-I10756), consumers, run_record (P-24) and
      survives_phase4.
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: UNVERIFIED
    consumers: PRESENT
    schema_contract: ABSENT
    artifact_registry: ABSENT
    observability_row: ABSENT
    run_record: ABSENT
    detector: ABSENT
    console_entity: ABSENT
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    Identity is UNVERIFIED — 'whoever runs it'. Under alpha-engine-config-I10756 these run
    in-region under the component role only, never from the laptop
    (alpha-engine-config-I9771).
