# Unit descriptor — data collector unit D31 (features (daily) + metron_supplemental).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D31
component_id: "data-collector-d31-features-daily"
owning_repo: "nousergon-data"
title: features (daily) + metron_supplemental
component: 1
lifecycle: "in-service"
owner: brian
code_path: "features/compute.py:1103, features/metron_supplemental.py"
trigger:
  kind: "step-functions"
  # Since the decoupled data cutover (alpha-engine-config-I11269; first
  # standalone EOD run 2026-09-29) this unit runs in the standalone stack's EOD
  # machine, started at 18:15 ET by the Scheduler entry below
  # (infrastructure/cloudformation/nousergon-data-collection.yaml::EodSchedule).
  # ne-postclose-trading-pipeline (16:00 ET) no longer runs it: its data stages
  # were removed by that same change.
  owner: "ne-data-collection-eod"
  started_by: "eventbridge-scheduler:nousergon-data-collection/data-collection-eod"
  successor: "ne-data-collection-eod (nousergon-data-PR1701), ENABLED at the decoupled cutover (alpha-engine-config-I11269); v1 was ne-postclose-trading-pipeline"
  schedule: "weekdays 18:15 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "features/{date}/*.parquet"
  - features/metron_supplemental/
  # alpha-engine-config-I10793: uploaded on every non-dry run by
  # features/compute.py -> features/registry.py::upload_registry and recorded in
  # the run manifest's outputs[] (weekly_collector._feature_registry_extra_output).
  # Declared so contracts/feature_registry.schema.json is reachable from a key
  # this unit writes, now that the parquet keys resolve to their own contract.
  - "features/registry.json"
consumers:
  - "crucible-research:scoring/factor_scoring.py"
  - "crucible-dashboard:views/13_Feature_Store.py"
consumers_reason: >-
    The `metron_supplemental` reader was NOT found by a live `git grep -rn
    metron_supplemental` across `metron` origin/main, 2026-09-16
    (alpha-engine-config-I10873) — zero matches. `features/metron_supplemental.py`
    writes `features/metron_supplemental/{date}/` with no known consumer anywhere
    in the roster. This is a genuine R7-style retirement candidate for the
    `metron_supplemental` sub-artifact specifically (NOT for D31's main
    `features/{date}/*.parquet` write, which crucible-dashboard and
    crucible-research both read). Reserved: routed to the Decision Queue via
    alpha-engine-config-I10932 (filed this session) rather than retired unilaterally.
contract:
  schema:
    - "features/registry.py::CATALOG <-> SCHEMA.md §3"
    - "contracts/features_parquet.schema.json"
    - "contracts/feature_registry.schema.json"
  # Two artifacts, two contracts (alpha-engine-config-I10793, Brian's ruling
  # 2026-10-14, option (a)):
  #   * features/{date}/{group}.parquet -> contracts/features_parquet.schema.json,
  #     the per-COLUMN contract GENERATED from CATALOG by
  #     features/gen_parquet_contract.py (tests/test_features_parquet_contract.py
  #     fails CI when the committed file is stale). It carries the parquet keys'
  #     x-key-pattern and x-settling-bar, so parity grades them as before.
  #   * features/registry.json -> contracts/feature_registry.schema.json, the
  #     CATALOG serialisation the dashboard GETs. D31 and D12 run the SAME code
  #     path (features/compute.py -> upload_registry), so one producer, one
  #     registry.json, one contract whichever trigger last ran.
  producer_test:
    - tests/test_schema_contract.py
    - tests/test_features_parquet_contract.py
    - tests/test_feature_registry_contract.py
  consumer_pins:
    - repo: "crucible-dashboard"
      path: "tests/contracts/feature_registry.schema.json"
      pins: "body_schema"
      producer: "contracts/feature_registry.schema.json"
      read_site: "views/13_Feature_Store.py::_load_registry"
    - repo: "crucible-dashboard"
      path: "tests/contracts/features_parquet.schema.json"
      pins: "body_schema"
      producer: "contracts/features_parquet.schema.json"
      read_site: "views/13_Feature_Store.py::_load_parquet"
    - repo: "crucible-research"
      path: "tests/contracts/features_parquet.schema.json"
      pins: "body_schema"
      producer: "contracts/features_parquet.schema.json"
      read_site: "scoring/factor_scoring.py::_resolve_group_snapshot"
  # P-07 (alpha-engine-config-I10873): the registry.json pin reuses the
  # crucible-dashboard pin from D12 (crucible-dashboard-PR862). The two
  # features_parquet pins are alpha-engine-config-I10793's consumer PRs; each
  # pinned copy must keep the producer's validation SHAPE (data_gate.consumer_pins
  # strips descriptions and x-* annotations before comparing), so a CATALOG
  # column change re-generates the producer file and stales both copies until
  # they are re-pinned — which is the drift a pin exists to surface.
registry_rows:
  - feature_store_freshness_sentinel
run_manifest_prefix: data_collection/runs/D31
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: "eod-spine"
  # The family's worst-case write bound, by the same rule the weekly family
  # uses (fire + declared runtime ceiling, plan §2 row 1): the 18:15 ET fire
  # plus each verify_unit writer's SSM-online budget and declared cap,
  # 18:15 + 95 + 65 = 20:55 ET (tests/test_data_collection_stack.py::
  # test_the_eod_ordering_chain_is_derived_from_the_template). It read 18:15
  # while the schedule was 16:45; once the fire moved to 18:15 that value
  # equalled the fire time and could never be met. Still `proposed`.
  deadline: "20:55 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: "constituents - declared exclusions"
  floor: 0.95
  status: proposed
  # alpha-engine-config-I10787 (P-20): the per-key ABSOLUTE floor the run-manifest
  # completion check grades `outputs[].rows_out` against. Distinct from `floor`
  # above, which is a RATIO against a denominator the check cannot resolve.
  # Corrected 2026-09-17 (alpha-engine-config-I10785): the collector DOES now
  # report a row count — `run_units.PhaseUnit.rows_key = "tickers_computed"`
  # (features/compute.py::compute_and_write's `result["tickers_computed"]`,
  # the count of rows actually written to the snapshot). `rows_out_floor`
  # itself stays null: no numeric absolute floor has been ruled for this key
  # yet — that ruling is P-13 (alpha-engine-config-I5935). The key is graded
  # on PRESENCE and on the `empty_fresh`/`below_floor` guard (data_empty_fresh,
  # I10785), which can now actually evaluate instead of reading unmeasurable.
  rows_out_floor: null
  rows_out_floor_na_code: "N/A-NOT-IMPL"
guards:
  empty_fresh:
    state: present
    note: as D12
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: present_static
    note: "as D12; P-14 adds the runtime half"
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: broken
    note: "`degraded` exits 0 (alpha-engine-config-I7572)"
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: PRESENT
    observability_row: ABSENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: BROKEN
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
