# Unit descriptor — data collector unit D42 (ArcticDB migrations).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D42
component_id: "data-collector-d42-arcticdb-migrations"
owning_repo: "nousergon-data"
title: ArcticDB migrations
component: 1
lifecycle: "in-service"
owner: brian
code_path: >-
    scripts/run_arctic_migrations.py;
    infrastructure/lambdas/arctic-migration-dispatcher/index.py:603
trigger:
  kind: "github-actions"
  on_demand: true
  successor: unchanged by v2 phase 4
  runs_on: "github-hosted"
  detail: >-
      .github/workflows/run-arctic-migrations.yml, on push to migrations/** and
      workflow_dispatch
  # alpha-engine-config-I10871/I10870/I10877: verified against
  # .github/workflows/run-arctic-migrations.yml on origin/main — `on: {push:
  # {paths: [migrations/**]}, workflow_dispatch: {}}`, no `schedule:` block at
  # all. This is genuinely on-demand (event-driven by a migrations/** push, or
  # a manual dispatch), never scheduled. `kind` stays `github-actions` — that
  # value drives SUBSTRATE_BY_TRIGGER_KIND (scripts/gen_observability_rows.py)
  # to the correct GitHub-Actions log location and alert channel
  # (notify-main-failure); reusing `kind: on-demand-dispatch` here would
  # misdescribe this unit's substrate to satisfy a cadence classification (that
  # value means "EC2 spot dispatcher", D35's shape). `trigger.on_demand: true`
  # is the fix (I10877): a cadence declaration independent of `kind`, read by
  # `data_gate/cadence.py::unit_cadence` before it looks at `kind` at all — so
  # this unit is graded as `on_demand` (most-recent-invocation, or a declared
  # not-applicable if none) instead of `undeclared`/graded against the gate's
  # own day.
writes:
  - arcticdb/universe (library)
  - arcticdb/macro (library)
  - arcticdb/universe_schema_meta (library)
consumers:
  - "crucible:crucible/data/sources.py"
  - "crucible-predictor:inference/stages/load_prices.py"
contract:
  schema: contracts/arctic_universe.schema.json
  producer_test: tests/test_p07_contracts.py
  consumer_pins:
    - "crucible:crucible/data/sources.py::ArcticPriceSource"
  target: migrations/README.md is normative; a migration schema test is P2
registry_rows: []
run_manifest_prefix: data_collection/runs/D42
detectors:
  - kind: "cloudwatch-alarm"
    via: "arctic-migration-dispatcher errors/throttles"
    state: PRESENT
    note: alarm JSON exists; EXECUTION not verified. P3.
freshness:
  na_code: "N/A-NOT-RUN"
  note: >-
      event-triggered on a code push, not scheduled; a deadline would be a clause about
      how often we change schemas
  status: not_applicable
completeness:
  denominator: declared migrations in migrations/
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
arcticdb_evidence:
  via: "data_collection/probes/arctic/{trading_day}.json"
  reason: >-
      ArcticDB is unreadable from the laptop and from the gate's own identity
      (alpha-engine-config-I9771). The gate NEVER opens ArcticDB; the EOD and morning
      machines write the probe as their final workload, and the probe's own staleness is a
      clause — so a probe that stops writing makes these clauses UNMEASURABLE rather than
      stale-green.
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: PRESENT
    schema_contract: UNVERIFIED
    artifact_registry: ABSENT
    observability_row: PRESENT
    run_record: ABSENT
    detector: PRESENT
    console_entity: UNVERIFIED
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    Run record ABSENT (GHA logs only) and no registry row for the migration ledger. P-06,
    P-09.
