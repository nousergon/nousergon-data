# Unit descriptor — data collector unit D05 (macro).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D05
component_id: "data-collector-d05-macro"
owning_repo: "nousergon-data"
title: macro
component: 1
lifecycle: "in-service"
owner: brian
code_path: "collectors/macro.py:100"
trigger:
  kind: "step-functions"
  owner: "ne-weekly-freshness-pipeline:DataPhase1"
  successor: "ne-data-collection-weekly (nousergon-data-PR1701, DISABLED)"
  schedule: "Sat 05:00 America/New_York"
  runs_on: "ec2-spot"
writes:
  - "market_data/weekly/{date}/macro.json"
  # alpha-engine-config-I10855 (corrected 2026-09-15): the prior two entries
  # here ("macro_history.parquet", "market_data/weekly/{date}/release_calendar.json")
  # did not match what collectors/macro.py actually writes
  # (write_macro_history/write_release_calendar write UNDER market_data/, to
  # fixed non-dated keys, not a weekly/{date}/ partition) — the completion
  # check could never have passed for this unit regardless of the recording
  # fix, because no run would ever produce a manifest output matching these
  # templates. Corrected to the real keys.
  - "market_data/macro_history.parquet"
  - "market_data/macro_release_calendar.parquet"
consumers:
  - "crucible-research:data/fetchers/macro_fetcher.py"
  - "crucible-research:agents/macro_agent.py"
contract:
  schema: null
  producer_test: null
  consumer_pins: []
registry_rows:
  - macro_snapshot
run_manifest_prefix: data_collection/runs/D05
detectors:
  - kind: "freshness-monitor"
    via: "artifact-registry-row"
    state: PRESENT
freshness:
  family: weekly
  deadline: "Sat 13:00 America/New_York"
  status: proposed
  ratified_at: "phase-3 exit (plan §2 row 1)"
completeness:
  denominator: declared macro series list
  floor: 1.0
  status: proposed
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: not_applicable
    na_code: "N/A-MISSING-INPUT"
    note: not priced against the equity universe; see D04
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  success_without_output:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
