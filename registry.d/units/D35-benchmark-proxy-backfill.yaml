        induced fault (P-19).
  vendor_fallback:
    state: absent
    note: not examined
  success_without_output:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
arcticdb_evidence:
  via: "data_collection/probes/arctic/{trading_day}.json"
  reason: >-
      ArcticDB is unreadable from the laptop and from the gate's own identity
      (alpha-engine-config-I9771). The gate NEVER opens ArcticDB; the EOD and morning
      machines write the probe as their final workload, and the probe's own staleness is a
      clause — so a probe that stops writing makes these clauses UNMEASURABLE rather than
      stale-green.
partial_exclusion:
  columns:
    - artifact_registry
    - detector
    - console_entity
  na_code: "N/A-NOT-RUN"
  reason: >-
      on_demand_no_schedule — plan §8.1 PARTIAL EXCLUSION: an on-demand operator tool
      carries no freshness, registry or alarm clause. It still carries identity,
      consumers, schema, run_record (P-24, through the manifest wrapper) and
      survives_phase4.
audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: PRESENT
    consumers: UNVERIFIED
    schema_contract: ABSENT
    artifact_registry: ABSENT
    observability_row: ABSENT
    run_record: UNVERIFIED
    detector: ABSENT
    console_entity: ABSENT
    survives_phase4: UNVERIFIED
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
