consumers_reason: UNVERIFIED in the audit. Phase 0 resolves the consumer and the exact key.
contract:
  schema: null
  producer_test: null
  consumer_pins: []
registry_rows: []
run_manifest_prefix: data_collection/runs/D35
detectors: []
freshness:
  na_code: "N/A-NOT-RUN"
  note: >-
      on-demand operator tool with no schedule; a freshness deadline on a tool nobody
      schedules is a clause that can only ever be red
  status: not_applicable
completeness:
  denominator: null
  floor: null
  status: not_applicable
  na_code: "N/A-NOT-RUN"
  note: "on-demand"
guards:
  empty_fresh:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  cardinality:
    state: not_applicable
    na_code: "N/A-NOT-RUN"
    note: "on-demand backfill of a declared proxy list"
  units:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
        phase-2 work; the clause is UNMET until it exists and is commissioned by an
        induced fault (P-19).
  pit:
    state: absent
    note: >-
        no code halts or refuses on this class for this unit (audit §4.1). The guard is
