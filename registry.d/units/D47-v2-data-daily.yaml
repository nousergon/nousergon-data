# Unit descriptor — data collector unit D47 (crucible v2 data.daily / data.weekly / data.heal).
#
# `console-policy` §2.6: onboarding a module is writing THIS FILE, committed
# beside the thing it describes and pointing at where its facts ALREADY live.
# Nothing about the console changes to render this unit.
#
# `data_collection_plan_260914.md` §4.1: `data_gate/clauses.py` GENERATES every
# clause from these descriptors. Nothing is hand-listed (`observability-policy`
# §2.2) — a hand-maintained monitored-things list drifts, and its drift is
# invisible because the missing rows produce no signal.
#
# RED BY DEFAULT. The `audit.cells` block below is the 2026-09-14 baseline
# reading, transcribed from alpha-engine-config/private-docs/data_collection_audit_260914.md §3. It is NOT evidence: every cell, including
# the ones scored PRESENT, is a clause that is RED until the gate measures it,
# and a first reading that DISAGREES with its cell is itself a finding — either
# the audit was wrong or the system has drifted since.
#
# PUBLIC REPO. This file carries key templates, triggers and consumer paths that
# are already public in this repository's own code. IAM role names, alarm
# thresholds and runbook detail stay in `nous-ergon-ops` (plan §5).
unit_id: D47
component_id: "data-collector-d47-v2-data-daily"
owning_repo: "nousergon-data"
title: crucible v2 data.daily / data.weekly / data.heal
component: 2
graded_on: "crucible-board"
lifecycle: "in-service"
owner: brian
code_path: "crucible:crucible/track_a.py:702-705, crucible/data/daily.py:172"
trigger:
  kind: "eventbridge-scheduler"
  owner: "crucible-v2-dispatcher"
  successor: is v2
  schedule: "cron(30 18 ? * MON-FRI *)"
  runs_on: "ec2-spot"
writes:
  - "crucible-v2 store: data/{trading_day}/panel.parquet"
  - "crucible-v2 store: data/{trading_day}/coverage.json"
  - "crucible-v2 store: features/{version}/{trading_day}.parquet"
consumers:
  - "crucible:crucible/board.py"
  - "crucible:crucible/features/depth.py"
contract:
  schema: "contracts/arctic_universe.schema.json"
  producer_test: tests/test_p07_contracts.py
  consumer_pins:
    - "crucible:tests/test_arctic_universe_contract.py"
  # P-07 (alpha-engine-config-I10873): the plan §8.1 exclusion's single input-contract
  # clause. Previous value was PROSE ("crucible: coverage floor +
  # UndeclaredUniverseError") — data_gate/evidence.py::_declared_schema_files skips
  # any cross-repo token, so a prose description was read as "no schema and no
  # producer test declared" even though the real contract already existed on both
  # sides. Corrected to real, already-existing paths: this repo's
  # contracts/arctic_universe.schema.json (the column/dtype/index contract for the
  # ArcticDB `universe` library D47 reads via `ArcticPriceSource.load_panel`) +
  # tests/test_p07_contracts.py (hand-built-fixture producer test, existing) +
  # crucible's ALREADY-MERGED consumer pin `tests/test_arctic_universe_contract.py`
  # (verified live on crucible origin/main, 2026-09-16: exercises the pinned schema
  # copy at `tests/contracts/arctic_universe.schema.json` through the real
  # `ArcticPriceSource.load_panel` rename/refuse contract). This is a mechanical
  # fix to how the existing contract is DECLARED, not a change to what is graded —
  # D47 stays excluded from every other clause per the `notes` block below.
registry_rows: []
partial_exclusion:
  # alpha-engine-config-I11245 (`artifact_registry`) / -I10810 (`run_record`,
  # `identity`, `survives_phase4`): all four read UNMEASURABLE (or, for
  # `survives_phase4`, an incidentally-inherited MET worded as if a "current
  # run" existed) for the SAME reason — D47's `writes` are prose describing
  # the crucible-v2 store, not S3 key templates or ArcticDB libraries any of
  # these readers can grade; it declares no registry_rows (nothing to
  # register), no `data_collection/runs/D47/` prefix (nothing to list), and
  # no writer identity of its own to simulate (nothing to scope).
  # `survives_phase4` (`data_gate/standalone.py::read_survives_phase4`)
  # reuses `read_run_record` internally to decide "does it still fire" — once
  # `run_record` is excluded, that reuse would otherwise inherit the MET
  # incidentally rather than declaring it, so it is named here too and
  # checked explicitly, first, in that reader. Plan §8.1 EXCLUSION stands:
  # D47 is component 2, its row/identity/store live on the crucible board,
  # and this repo grades only its single input-contract clause (P-07, under
  # `contract` above) — never a second verdict on an artifact that isn't this
  # repo's to publish. One `partial_exclusion` block names every column this
  # shape applies to, rather than a parallel not-applicable mechanism per
  # column.
  columns:
    - artifact_registry
    - run_record
    - identity
    - survives_phase4
  na_code: "N/A-NOT-IMPL"
  reason: >-
      component 2 — its row, identity and store live on the crucible board (plan §8.1
      EXCLUSION); this repo grades no artifact, run record, writer identity or
      standalone-survival state for it, only the input-contract clause already
      declared under `contract`
run_manifest_prefix: data_collection/runs/D47
detectors:
  - kind: "crucible-gate"
    via: crucible board (component 2)
    state: PRESENT
freshness:
