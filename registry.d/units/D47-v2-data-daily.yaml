    note: >-
        component 2 — its guards are crucible's, and grading them here would put two
        verdicts on one producer
  success_without_output:
    state: not_applicable
    na_code: "N/A-NOT-IMPL"
    note: >-
        component 2 — its guards are crucible's, and grading them here would put two
