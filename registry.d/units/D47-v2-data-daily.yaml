audit:
  source: "alpha-engine-config/private-docs/data_collection_audit_260914.md §3"
  baseline_date: "2026-09-14"
  cells:
    identity: UNVERIFIED
    consumers: PRESENT
    schema_contract: PRESENT
    artifact_registry: ABSENT
    observability_row: PRESENT
    run_record: PRESENT
    detector: PRESENT
    console_entity: PRESENT
    survives_phase4: PRESENT
clause_phase:
  identity: 2
  consumers: 1
  schema_contract: 1
  artifact_registry: 1
  observability_row: 1
  run_record: 1
  detector: 3
  console_entity: 3
  survives_phase4: 1
notes: >-
    Plan §8.1 EXCLUSION: COMPONENT 2. It is the first-class CONSUMER of component 1's
    ArcticDB universe, not a producer of it, and its row, identity and store live on the
    crucible board. It keeps a descriptor here for exactly one reason: its nine audit
    cells are nine of the 414, and dropping them would make the board's own completeness
    claim unverifiable against the audit it was built from. Every clause on this unit
    reads the CRUCIBLE board as its evidence, never a data-collector artifact, and the
    data ladder's own deliverable for it is the single input-contract clause: crucible
    pins contracts/arctic_universe.schema.json (P-07).
